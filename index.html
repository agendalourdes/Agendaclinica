<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGP LOURDES - PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; padding-bottom: 100px; }
        .ios-card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .borda-esp { border-left: 8px solid #fed7aa; } 
        .borda-emag { border-left: 8px solid #bfdbfe; } 
        .borda-apl { border-left: 8px solid #e9d5ff; } 
        .relatorio-tabela { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 9px; }
        .relatorio-tabela th { background: #f1f5f9; padding: 8px 4px; text-align: left; border: 1px solid #e2e8f0; text-transform: uppercase; }
        .relatorio-tabela td { padding: 8px 4px; border: 1px solid #e2e8f0; background: white; }
        .suggestions-box { position: absolute; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 150px; overflow-y: auto; z-index: 100; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        .suggestion-item:hover { background: #f8fafc; color: #f97316; }
        @media print { .no-print { display: none !important; } .print-area { display: block !important; } }
    </style>
</head>
<body>

<header class="no-print p-6 bg-white border-b flex justify-between items-center sticky top-0 z-40">
    <h1 class="text-lg font-black uppercase tracking-tighter">CLÍNICA <span class="text-orange-600">LOURDES</span></h1>
    <input type="date" id="datepicker" onchange="loadAll()" class="p-2 border rounded-xl font-bold text-xs bg-slate-50 outline-none">
</header>

<main id="content" class="p-4 max-w-[1200px] mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 no-print shadow-2xl">
    <button onclick="showTab('agenda')" id="t-agenda" class="flex flex-col items-center text-slate-400"><i class="fas fa-calendar-alt text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Agenda</span></button>
    <button onclick="showTab('relatorio')" id="t-relatorio" class="flex flex-col items-center text-slate-400"><i class="fas fa-file-medical text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Relatório</span></button>
    <button onclick="showTab('historico')" id="t-historico" class="flex flex-col items-center text-slate-400"><i class="fas fa-users text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Pacientes</span></button>
    <button onclick="showTab('ausentes')" id="t-ausentes" class="flex flex-col items-center text-slate-400"><i class="fas fa-clock text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Retornos</span></button>
</nav>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white w-full max-w-lg rounded-[32px] p-8 shadow-2xl overflow-y-auto max-h-[90vh]" onclick="event.stopPropagation()">
        <div id="m-content"></div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyQ0Is21i54hYt5M0rpknsSBRZDRELKsHJIRwhvsfA9-J5D1AyjZiRvDIcg4kSZ2iM/exec"; 
    let pacs = [], appts = [], currentTab = 'agenda';

    async function loadAll() {
        const c = document.getElementById('content');
        c.innerHTML = '<div class="text-center mt-20 font-black text-slate-300 animate-pulse uppercase text-xs">Sincronizando...</div>';
        try {
            const r = await fetch(API + '?action=getAll');
            const d = await r.json();
            pacs = d.patients || [];
            appts = d.appointments || [];
            render();
        } catch(e) { c.innerHTML = '<div class="text-center p-10 font-bold text-red-500 uppercase text-xs">Erro de Conexão</div>'; }
    }

    function render() {
        const c = document.getElementById('content');
        const dVal = document.getElementById('datepicker').value;
        if(currentTab === 'agenda') renderAgenda(c, dVal);
        else if(currentTab === 'relatorio') renderRelatorio(c, dVal);
        else if(currentTab === 'historico') renderHistorico(c);
        else renderAusentes(c);
        
        document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-orange-600', 'text-slate-400'));
        document.getElementById('t-'+currentTab).classList.replace('text-slate-400', 'text-orange-600');
    }

    function renderAgenda(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        let html = `<div class="mb-6 text-center"><button onclick="openAgendar('ENCAIXE','')" class="bg-orange-600 text-white px-10 py-3 rounded-2xl text-[10px] font-black uppercase shadow-lg shadow-orange-100">+ Encaixe</button></div>`;
        const config = [{n:'ESPORTIVO', b:'borda-esp', step:25},{n:'EMAGRECIMENTO', b:'borda-emag', step:35},{n:'APLICAÇÃO', b:'borda-apl', max:3}];
        config.forEach(cat => {
            html += `<h3 class="font-black text-[10px] text-slate-400 mb-4 mt-8 uppercase tracking-widest border-l-4 border-slate-200 pl-2">${cat.n}</h3>`;
            const list = appts.filter(a => a.dataStr.includes(dataF) && a.categoria.toUpperCase().trim() === cat.n);
            if(cat.n === 'APLICAÇÃO') {
                for(let i=1; i<=cat.max; i++) html += list[i-1] ? slotBusy(list[i-1], cat.b) : `<div onclick="openAgendar('${cat.n}', '')" class="bg-white border border-dashed p-4 mb-4 text-[10px] rounded-xl text-slate-300 text-center italic">Livre</div>`;
            } else {
                let h=9, m=0;
                while(h < 12 || (h == 11 && m <= 55)){
                    const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                    const ag = list.find(a => a.hora.includes(t));
                    html += ag ? slotBusy(ag, cat.b) : `<div onclick="openAgendar('${cat.n}', '${t}')" class="bg-white border border-dashed p-4 mb-3 flex justify-between text-[10px] rounded-xl text-slate-300 font-bold"><span>${t}</span><span>Disponível</span></div>`;
                    m += cat.step; if(m>=60){ h++; m-=60; }
                }
            }
        });
        c.innerHTML = html;
    }

    function slotBusy(ag, borda) {
        return `<div class="ios-card p-5 mb-4 ${borda} flex justify-between items-center" onclick="openAcoes('${ag.id}')">
            <div><p class="text-[9px] font-bold text-slate-400 uppercase">${ag.hora} — ${ag.servico}</p>
            <p class="font-black text-slate-800 uppercase text-base">${ag.paciente}</p>
            <p class="text-[8px] text-orange-500 font-bold uppercase mt-1 italic">${ag.obs ? 'OBS: ' + ag.obs : ''}</p></div>
            <i class="fab fa-whatsapp text-green-500 text-2xl"></i>
        </div>`;
    }

    function openAcoes(id) {
        const ag = appts.find(a => a.id == id);
        document.getElementById('m-content').innerHTML = `
            <div class="text-center mb-8"><h2 class="font-black text-2xl uppercase italic">${ag.paciente}</h2></div>
            <div class="flex flex-col gap-3">
                <button onclick="enviarZap('confirmar','${id}')" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Confirmar <i class="fas fa-check"></i></button>
                <button onclick="enviarZap('lembrete','${id}')" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Lembrete <i class="fab fa-whatsapp"></i></button>
                <button onclick="openEditarAgendamento('${id}')" class="w-full bg-slate-100 text-slate-600 p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Editar <i class="fas fa-edit"></i></button>
                <button onclick="deletarAgendamento('${id}')" class="w-full bg-red-50 text-red-500 p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Cancelar Agendamento <i class="fas fa-trash-alt"></i></button>
                <button onclick="closeModal()" class="text-slate-300 font-black text-[9px] uppercase mt-6">Voltar</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
    }

    async function deletarAgendamento(id) {
        if(confirm("Deseja realmente CANCELAR este agendamento?")) {
            await fetch(API, { method: 'POST', body: JSON.stringify({action: 'deleteAppointment', id: id}) });
            closeModal(); loadAll();
        }
    }

    function renderHistorico(c) {
        c.innerHTML = `<div class="p-2"><input type="text" id="histSearch" oninput="searchHist()" placeholder="PESQUISAR PACIENTE..." class="w-full p-5 rounded-2xl border-2 border-slate-100 font-black uppercase outline-none focus:border-orange-500 shadow-sm mb-8 text-center"><div id="histResults"></div></div>`;
    }

    function searchHist() {
        const term = document.getElementById('histSearch').value.toUpperCase().trim();
        const results = document.getElementById('histResults');
        if(term.length < 3) return results.innerHTML = "";
        const pac = pacs.find(p => p.nome.includes(term));
        if(!pac) return results.innerHTML = "";
        results.innerHTML = `
            <div class="ios-card p-6 border-l-8 border-orange-500 shadow-xl">
                <h3 class="font-black text-lg uppercase mb-4 italic">${pac.nome}</h3>
                <div class="grid grid-cols-2 gap-3 text-[10px] mb-6">
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">WhatsApp</label><input type="text" id="eTel" value="${pac.telefone}" class="w-full bg-transparent font-bold outline-none"></div>
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">Altura</label><input type="text" id="eAlt" value="${pac.altura}" class="w-full bg-transparent font-bold outline-none"></div>
                </div>
                <div class="flex gap-2">
                    <button onclick="salvarEdicao('${pac.nome}')" class="flex-1 bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-[10px]">Salvar</button>
                    <button onclick="deletarPaciente('${pac.nome}')" class="bg-red-50 text-red-500 px-6 rounded-xl font-black uppercase text-[10px]"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>`;
    }

    async function deletarPaciente(nome) {
        if(confirm("ATENÇÃO: Isso excluirá o CADASTRO do paciente. Deseja continuar?")) {
            await fetch(API, { method: 'POST', body: JSON.stringify({action: 'deletePatient', nome: nome}) });
            document.getElementById('histSearch').value = ""; loadAll();
        }
    }

    // --- FUNÇÕES DE APOIO ---
    function openAgendar(cat, hora) {
        document.getElementById('m-content').innerHTML = `
            <h2 class="font-black text-xl mb-6 uppercase text-center italic">${cat}</h2>
            <div class="space-y-4 relative">
                <input type="text" id="newPac" placeholder="NOME DO PACIENTE" autocomplete="off" class="w-full p-4 bg-slate-50 rounded-xl font-black uppercase outline-none border-2 border-transparent focus:border-orange-500">
                <div id="suggestions" class="suggestions-box hidden"></div>
                <div id="extra" class="hidden space-y-4 p-4 bg-orange-50 rounded-2xl border border-orange-100">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="nTel" placeholder="WhatsApp" class="w-full p-3 rounded-xl text-xs font-bold border-none shadow-sm">
                        <input type="text" id="nAlt" placeholder="Altura" class="w-full p-3 rounded-xl text-xs font-bold border-none shadow-sm">
                        <input type="text" id="nNasc" placeholder="Nasc. DD/MM/AAAA" class="w-full p-3 rounded-xl text-xs font-bold border-none shadow-sm">
                        <input type="text" id="nEmail" placeholder="Email" class="w-full p-3 rounded-xl text-xs font-bold border-none shadow-sm">
                    </div>
                </div>
                <textarea id="nObs" placeholder="OBSERVAÇÃO" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-xs uppercase outline-none min-h-[80px]"></textarea>
                <button onclick="salvarNovo('${cat}', '${hora}')" class="w-full bg-slate-900 text-white p-5 rounded-[22px] font-black uppercase shadow-2xl">Salvar</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
        const input = document.getElementById('newPac');
        const suggBox = document.getElementById('suggestions');
        input.addEventListener('input', () => {
            const val = input.value.toUpperCase().trim();
            suggBox.innerHTML = '';
            if(val.length < 2) { suggBox.classList.add('hidden'); return; }
            const filtered = pacs.filter(p => p.nome.includes(val)).slice(0, 5);
            if(filtered.length > 0) {
                suggBox.classList.remove('hidden');
                filtered.forEach(p => {
                    const div = document.createElement('div'); div.className = 'suggestion-item'; div.innerText = p.nome;
                    div.onclick = () => { input.value = p.nome; suggBox.classList.add('hidden'); document.getElementById('extra').classList.add('hidden'); };
                    suggBox.appendChild(div);
                });
            } else { suggBox.classList.add('hidden'); document.getElementById('extra').classList.remove('hidden'); }
        });
    }

    async function salvarNovo(cat, hora) {
        const data = document.getElementById('datepicker').value.split('-').reverse().join('/');
        let servico = cat === 'APLICAÇÃO' ? 'APLICAÇÃO' : (cat === 'ESPORTIVO' ? 'NUTRIÇÃO ESPORTIVA' : 'EMAGRECIMENTO');
        const obj = { action: 'addAppointment', paciente: document.getElementById('newPac').value.toUpperCase(), servico: servico, data: data, hora: hora || 'ENCAIXE', categoria: cat, obs: document.getElementById('nObs').value.toUpperCase(), telefone: document.getElementById('nTel')?.value || "", nascimento: document.getElementById('nNasc')?.value || "", email: document.getElementById('nEmail')?.value || "", altura: document.getElementById('nAlt')?.value || "" };
        await fetch(API, { method: 'POST', body: JSON.stringify(obj) });
        // Se for novo paciente, adiciona na planilha de pacientes também (no script doPost já faz)
        closeModal(); loadAll();
    }

    function renderRelatorio(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        let html = `<div class="no-print mb-6"><button onclick="window.print()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-[10px]">Imprimir Relatório</button></div><div class="print-area bg-white p-2"><h2 class="text-center font-black mb-6 uppercase text-sm border-b-2 border-black pb-2 italic">AGENDA — ${dataF}</h2>`;
        const cats = [{n:'ESPORTIVO', bg:'bg-orange-50', p:['LIBIA', 'GERALDO']},{n:'EMAGRECIMENTO', bg:'bg-blue-50', p:['BRUNO']},{n:'APLICAÇÃO', bg:'bg-purple-50', p:['SUELLEN']}];
        cats.forEach(cat => {
            const list = appts.filter(a => a.dataStr.includes(dataF) && a.categoria.toUpperCase().trim() === cat.n);
            html += `<div class="cat-header ${cat.bg} border"><span>${cat.n}</span><select class="bg-transparent font-black text-[10px] outline-none border-none">${cat.p.map(p => `<option>PROF: ${p}</option>`).join('')}</select></div><table class="relatorio-tabela"><thead><tr><th>Hora</th><th>Paciente</th><th>WhatsApp</th><th>Nasc.</th><th>Email</th><th>Alt.</th><th>Últ. Visita</th><th>Últ. Proc.</th><th>Hoje</th><th>Obs.</th></tr></thead><tbody>`;
            list.forEach(a => {
                const p = pacs.find(x => x.nome === a.paciente) || {};
                const hPac = appts.filter(x => x.paciente === a.paciente && x.dataStr !== dataF);
                const ultima = hPac.length > 0 ? hPac[hPac.length-1] : {dataStr: '-', servico: '-'};
                html += `<tr><td>${a.hora}</td><td class="font-bold">${a.paciente}</td><td>${p.telefone || '-'}</td><td>${p.nascimento || '-'}</td><td class="text-[7px]">${p.email || '-'}</td><td>${p.altura || '-'}</td><td>${ultima.dataStr}</td><td>${ultima.servico}</td><td class="font-bold">${a.servico}</td><td class="text-orange-600 font-bold">${a.obs || ''}</td></tr>`;
            });
            html += `</tbody></table>`;
        });
        c.innerHTML = html + `</div>`;
    }

    function openEditarAgendamento(id) {
        const ag = appts.find(a => a.id == id);
        const partes = ag.dataStr.split('/');
        const dataParaInput = `${partes[2]}-${partes[1]}-${partes[0]}`;
        document.getElementById('m-content').innerHTML = `<h2 class="font-black text-xl mb-6 uppercase text-center italic">Editar</h2><div class="space-y-4"><div><label class="text-[8px] font-black">Paciente</label><input type="text" id="editPac" value="${ag.paciente}" class="w-full p-3 bg-slate-50 rounded-xl font-bold uppercase outline-none"></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[8px] font-black">Data</label><input type="date" id="editData" value="${dataParaInput}" class="w-full p-3 bg-slate-50 rounded-xl font-bold"></div><div><label class="text-[8px] font-black">Hora</label><input type="text" id="editHora" value="${ag.hora}" class="w-full p-3 bg-slate-50 rounded-xl font-bold"></div></div><div><label class="text-[8px] font-black">Serviço</label><input type="text" id="editServ" value="${ag.servico}" class="w-full p-3 bg-slate-50 rounded-xl font-bold uppercase"></div><textarea id="editObs" class="w-full p-3 bg-slate-50 rounded-xl font-bold text-xs uppercase outline-none">${ag.obs}</textarea><button onclick="salvarEdicaoAgendamento('${id}', '${ag.categoria}')" class="w-full bg-slate-900 text-white p-5 rounded-[22px] font-black uppercase">Salvar Alterações</button></div>`;
    }

    async function salvarEdicaoAgendamento(id, categoria) {
        const novaData = document.getElementById('editData').value.split('-').reverse().join('/');
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'updateAppointment', id: id, paciente: document.getElementById('editPac').value.toUpperCase(), data: novaData, hora: document.getElementById('editHora').value, servico: document.getElementById('editServ').value.toUpperCase(), categoria: categoria, obs: document.getElementById('editObs').value.toUpperCase() }) });
        closeModal(); loadAll();
    }

    async function salvarEdicao(nome) {
        await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'editPatient', nome: nome, telefone: document.getElementById('eTel').value, nascimento: "", email: "", altura: document.getElementById('eAlt').value }) });
        alert("Atualizado!"); loadAll();
    }

    function renderAusentes(c) {
        const hoje = new Date();
        const faltosos = pacs.filter(p => {
            const h = appts.filter(a => a.paciente === p.nome);
            if(h.length === 0) return false;
            const u = h[h.length-1];
            const dataP = u.dataStr.split('/');
            const dV = new Date(dataP[2], dataP[1]-1, dataP[0]);
            return ((hoje - dV)/(1000*3600*24)) > 25;
        });
        c.innerHTML = `<h2 class="font-black text-slate-400 uppercase text-[10px] mb-6 italic">Retornos pendentes</h2>` + (faltosos.length ? faltosos.map(p => `<div class="ios-card p-6 mb-4 flex justify-between items-center"><div class="uppercase"><p class="font-black">${p.nome}</p></div><button onclick="window.open('https://wa.me/55${p.telefone.replace(/\D/g,'')}?text=Ola')" class="bg-green-50 text-green-500 p-3 rounded-full"><i class="fab fa-whatsapp text-xl"></i></button></div>`).join('') : '<p class="text-center py-10 text-slate-300 font-black uppercase text-[10px]">Tudo em dia!</p>');
    }

    function showTab(t){ currentTab = t; render(); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
    function enviarZap(tipo, id) { const ag = appts.find(a => a.id == id); const p = pacs.find(x => x.nome === ag.paciente) || {}; const tel = (p.telefone || "").replace(/\D/g,''); let msg = (tipo === 'confirmar') ? `Oi ${ag.paciente}! Confirmado para ${ag.dataStr} as ${ag.hora}.` : `Lembrete de consulta amanha as ${ag.hora}.`; window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`); }
    window.onload = () => { document.getElementById('datepicker').value = new Date().toISOString().split('T')[0]; loadAll(); };
</script>
</body>
</html>
