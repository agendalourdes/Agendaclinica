<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENDA LOURDES — OFICIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ── Base ── */
        body {
            background: linear-gradient(160deg, #fdf8fb 0%, #f8f4f9 50%, #f5f8fd 100%);
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* ── Brand colors ── */
        .text-vinho { color: #722f51; }
        .bg-vinho   { background-color: #722f51; }
        .text-ouro  { color: #bca374; }
        .bg-ouro    { background-color: #bca374; }
        .border-ouro{ border-color: #bca374; }

        /* ── Animations ── */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes zapPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.45); }
            60%      { box-shadow: 0 0 0 9px rgba(34,197,94,0); }
        }
        @keyframes logoGlow {
            0%,100% { text-shadow: 0 0 8px rgba(188,163,116,0.25); }
            50%      { text-shadow: 0 0 22px rgba(188,163,116,0.6); }
        }
        @keyframes headerShimmer {
            0%   { background-position: -300% center; }
            100% { background-position: 300% center; }
        }
        @keyframes bounceSoft {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-5px); }
        }
        @keyframes popIn {
            0%   { opacity:0; transform: scale(0.88); }
            70%  { transform: scale(1.04); }
            100% { opacity:1; transform: scale(1); }
        }
        @keyframes navDot {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        .logo-glow    { animation: logoGlow 3.5s ease-in-out infinite; }
        .zap-btn      { animation: zapPulse 2.2s ease-in-out infinite; }
        .modal-pop    { animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }
        .bounce-icon  { animation: bounceSoft 2s ease-in-out infinite; }

        /* ── Cards ── */
        .premium-card {
            background: #ffffff;
            border-radius: 22px;
            border: 1px solid rgba(241,245,249,0.9);
            box-shadow: 0 4px 18px rgba(114,47,81,0.06), 0 1px 3px rgba(0,0,0,0.04);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .premium-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(114,47,81,0.12), 0 4px 10px rgba(0,0,0,0.06);
        }
        .premium-card:active { transform: scale(0.985); }

        /* ── Left borders ── */
        .borda-esp  { border-left: 6px solid #f9c784; }
        .borda-emag { border-left: 6px solid #7ab8f5; }
        .borda-apl  { border-left: 6px solid #c084fc; }

        /* ── Buttons ── */
        .btn-vinho {
            background: linear-gradient(135deg, #722f51 0%, #8c3965 100%);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(114,47,81,0.28);
        }
        .btn-vinho:hover {
            box-shadow: 0 8px 22px rgba(114,47,81,0.38);
            transform: translateY(-1px) scale(1.01);
        }
        .btn-vinho:active { transform: scale(0.97); }

        /* ── Autocomplete ── */
        .suggestions-box {
            position: absolute; width: 100%; background: white;
            border-radius: 16px; max-height: 200px; overflow-y: auto;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            border: 1px solid #f1f5f9;
            animation: slideInUp 0.2s ease;
        }
        .suggestion-item {
            padding: 14px; cursor: pointer;
            border-bottom: 1px solid #f8fafc;
            font-size: 12px; font-weight: 700; text-transform: uppercase;
            transition: background 0.15s;
        }
        .suggestion-item:hover { background: #fdf4f8; }

        /* ── Header ── */
        header {
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .logo-icon-wrap {
            background: linear-gradient(135deg, #fdf4f8, #f5eef6);
            box-shadow: inset 0 2px 6px rgba(114,47,81,0.08);
        }

        /* ── Nav ── */
        nav {
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        nav button { transition: all 0.2s ease; position: relative; }
        nav button.nav-active::after {
            content: '';
            display: block;
            height: 3px;
            border-radius: 2px;
            background: #722f51;
            margin-top: 4px;
            animation: navDot 0.25s ease;
        }
        nav button:not(.nav-active)::after {
            content: '';
            display: block;
            height: 3px;
        }

        /* ── Slot livre ── */
        .slot-livre {
            background: white;
            border: 1.5px dashed #d1d5db;
            border-radius: 22px;
            transition: all 0.2s ease;
        }
        .slot-livre:hover {
            border-color: #bca374;
            background: #fffbf5;
            box-shadow: 0 4px 14px rgba(188,163,116,0.1);
        }

        /* ── Input focus ── */
        input:focus, select:focus {
            border-color: #bca374 !important;
            box-shadow: 0 0 0 3px rgba(188,163,116,0.15);
            outline: none;
        }

        /* ── FAB Disponibilidade ── */
        .fab-disp {
            position: fixed;
            bottom: 88px;
            right: 18px;
            z-index: 49;
            background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 13px 18px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 22px rgba(37,211,102,0.45);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            animation: zapPulse 2.5s ease-in-out infinite;
        }
        .fab-disp:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 10px 30px rgba(37,211,102,0.55);
        }
        .fab-disp:active { transform: scale(0.96); }

        /* ── Print ── */
        #print-header { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; padding: 0 !important; }
            body { background: white !important; padding: 0 !important; }
            .relatorio-section { page-break-inside: avoid; }
            .premium-card { box-shadow: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="no-print p-5 border-b flex flex-wrap gap-4 justify-between items-center sticky top-0 z-40 shadow-sm">
    <div class="flex items-center">
        <div class="logo-icon-wrap p-2.5 rounded-2xl mr-3">
            <i class="fas fa-apple-whole text-ouro text-2xl bounce-icon"></i>
        </div>
        <div>
            <h1 class="text-lg font-black uppercase tracking-tighter text-vinho logo-glow">
                AGENDA <span class="text-ouro">LOURDES</span>
            </h1>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
            <button onclick="navegarTerca(-1)"
                class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-vinho hover:text-white text-slate-500 transition-all font-black text-sm shadow-sm active:scale-95">
                ‹
            </button>
            <div onclick="document.getElementById('datepicker').showPicker()" class="flex flex-col items-center cursor-pointer px-2">
                <span id="data-label-dia"  class="text-[9px] font-black text-ouro uppercase tracking-widest leading-none">Terça-feira</span>
                <span id="data-label-data" class="text-sm font-black text-vinho leading-tight mt-0.5">00/00/0000</span>
            </div>
            <button onclick="navegarTerca(1)"
                class="w-9 h-9 flex items-center justify-center rounded-xl bg-slate-100 hover:bg-vinho hover:text-white text-slate-500 transition-all font-black text-sm shadow-sm active:scale-95">
                ›
            </button>
            <!-- input escondido mantém a lógica existente -->
            <input type="date" id="datepicker" onchange="onDateChange()" class="sr-only">
        </div>
    </div>
</header>

<div id="print-header">
    <i class="fas fa-apple-whole" style="font-size:30px;color:#bca374;"></i>
    <h1 style="font-size:24px;font-weight:900;color:#722f51;margin:5px 0;">AGENDA LOURDES</h1>
    <p style="font-size:12px;font-weight:800;color:#bca374;letter-spacing:2px;text-transform:uppercase;" id="print-date-label"></p>
</div>

<main id="content" class="p-5 max-w-[1200px] mx-auto"></main>

<!-- ── NAV ── -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/90 border-t flex items-center justify-around z-50 no-print shadow-[0_-8px_30px_rgba(114,47,81,0.07)] px-2 py-3">
    <button onclick="showTab('agenda')"    id="t-agenda"    class="flex flex-col items-center px-5 py-2 rounded-2xl transition-all">
        <i class="fas fa-calendar-day text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Agenda</span>
    </button>
    <button onclick="showTab('relatorio')" id="t-relatorio" class="flex flex-col items-center px-5 py-2 rounded-2xl transition-all">
        <i class="fas fa-print text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Relatório</span>
    </button>
    <button onclick="showTab('historico')" id="t-historico" class="flex flex-col items-center px-5 py-2 rounded-2xl transition-all">
        <i class="fas fa-address-book text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Pacientes</span>
    </button>
    <button onclick="showTab('ausentes')"  id="t-ausentes"  class="flex flex-col items-center px-5 py-2 rounded-2xl transition-all">
        <i class="fas fa-clock-rotate-left text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Retornos</span>
    </button>
</nav>

<!-- ── FAB Disponibilidade ── -->
<button class="fab-disp no-print" onclick="openDisponibilidade()">
    <i class="fab fa-whatsapp text-base"></i>
    Horários Livres
</button>

<!-- ── MODAL ── -->
<div id="modal" class="hidden fixed inset-0 z-[100] bg-vinho/20 backdrop-blur-md flex items-center justify-center p-4" onclick="closeModal()">
    <div class="modal-pop bg-white w-full max-w-lg rounded-[35px] p-8 shadow-2xl overflow-y-auto max-h-[90vh]" onclick="event.stopPropagation()">
        <div id="m-content"></div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbxmaWUWvspZKA9OqHyoyGo0Mcy0hTwLhZ_f5JFfkep1GSYN_3_JhNTgb1trwUc2HcNe/exec";

    let pacs = [], appts = [], currentTab = 'agenda';
    let excludedRetornos = JSON.parse(localStorage.getItem('excludedRetornos') || '[]');
    let currentEspProf = 'GERALDO';


    /* ─── Helpers de normalização ─────────────────────────────────────
       Garante que diferenças de espaço, caixa ou acento não quebrem
       a busca de paciente entre a planilha de agendamentos e a de cadastros.
    ─────────────────────────────────────────────────────────────────── */
    function normalizar(str) {
        return (str || '')
            .trim()
            .toUpperCase()
            .replace(/\s+/g, ' ')                      // espaços duplos
            .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // remove acentos p/ comparação
    }

    function buscarPac(nome) {
        if (!nome) return {};
        const n = normalizar(nome);

        /* 1. Correspondência exata normalizada */
        let pac = pacs.find(x => normalizar(x.nome) === n);
        if (pac) return pac;

        /* 2. Um contém o outro (ex: "ANA KARINE" dentro de "ANA KARINE FERREIRA") */
        pac = pacs.find(x => {
            const xn = normalizar(x.nome);
            return xn.includes(n) || n.includes(xn);
        });
        if (pac) return pac;

        /* 3. Todas as palavras do nome buscado existem no cadastro */
        const palavras = n.split(' ').filter(p => p.length > 1);
        pac = pacs.find(x => {
            const xn = normalizar(x.nome);
            return palavras.every(p => xn.includes(p));
        });
        if (pac) return pac;

        /* 4. Pelo menos 2 palavras em comum (evita falso positivo em nomes curtos) */
        if (palavras.length >= 2) {
            pac = pacs.find(x => {
                const xn = normalizar(x.nome);
                const comuns = palavras.filter(p => xn.includes(p));
                return comuns.length >= 2;
            });
            if (pac) return pac;
        }

        return {};
    }

    /* Formata telefone: remove tudo que não é dígito, garante 55 uma só vez */
    function formatarTel(tel) {
        const nums = (tel || '').replace(/\D/g, '');
        if (!nums) return '';
        if (nums.startsWith('55') && nums.length >= 12) return nums;
        return '55' + nums;
    }

    /* ─── formato curto do serviço para exibição nos cards da agenda ─── */
    function formatServico(servico, categoria) {
        if (!servico) return '';
        const s = servico.toUpperCase();
        const ret = s.includes('RETORNO');
        if (categoria === 'ESPORTIVO'     || s.includes('ESPORTIVO'))     return ret ? 'RETORNO ESPORTIVO'     : 'CONSULTA ESPORTIVO';
        if (categoria === 'EMAGRECIMENTO' || s.includes('EMAGRECIMENTO')) return ret ? 'RETORNO EMAGRECIMENTO' : 'CONSULTA EMAGRECIMENTO';
        if (categoria === 'APLICAÇÃO'     || s.includes('APLICAÇÃO'))     return ret ? 'RETORNO APLICAÇÃO'     : 'APLICAÇÃO';
        return servico;
    }

    /* ─────────────────────────────────────────────
       CONTROLE DE DIAS — só Terças + exceções
       Para liberar um dia extra: adicione a data
       no formato 'AAAA-MM-DD' no array abaixo.
    ───────────────────────────────────────────── */
    /* ─── Profissional alternado por semana ───
       Referência: 02/06/2026 = GERALDO, depois alterna a cada terça ─── */
    function getProfPadrao(dateStr) {
        const ref     = new Date('2026-06-02T12:00:00'); // GERALDO
        const d       = new Date(dateStr + 'T12:00:00');
        const semanas = Math.round((d - ref) / (7 * 24 * 3600 * 1000));
        return semanas % 2 === 0 ? 'GERALDO' : 'LÍBIA';
    }

    function atualizarLabel(val) {
        if (!val) return;
        const dt   = new Date(val + 'T12:00:00');
        const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
        const meses= ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        const dia  = String(dt.getDate()).padStart(2,'0');
        const mes  = String(dt.getMonth()+1).padStart(2,'0');
        const ano  = dt.getFullYear();
        const nomeDia = dias[dt.getDay()];
        document.getElementById('data-label-dia').innerText  = `${nomeDia}, ${meses[dt.getMonth()]} ${ano}`;
        document.getElementById('data-label-data').innerText = `${dia}/${mes}/${ano}`;
        /* define automaticamente o profissional padrão da semana */
        currentEspProf = getProfPadrao(val);
    }

    /* ─────────────────────────────────────────────
       CONTROLE DE DIAS
       diasExcecao   → dias que SUBSTITUEM uma terça
       diasCancelados → terças que NÃO acontecem
    ───────────────────────────────────────────── */
    const diasExcecao    = ['2026-07-13', '2026-07-24'];
    const diasCancelados = ['2026-07-14', '2026-07-21'];

    /* Gera lista ordenada de todos os dias válidos num intervalo de ±2 anos */
    function getDiasValidos() {
        const hoje   = new Date();
        const inicio = new Date(hoje); inicio.setFullYear(hoje.getFullYear() - 1);
        const fim    = new Date(hoje); fim.setFullYear(hoje.getFullYear() + 2);
        const dias   = [];
        for (let d = new Date(inicio); d <= fim; d.setDate(d.getDate() + 1)) {
            const str = d.toISOString().split('T')[0];
            if (d.getDay() === 2 && !diasCancelados.includes(str)) dias.push(str);
            else if (diasExcecao.includes(str))                      dias.push(str);
        }
        return dias.sort();
    }

    function proximaTerca(from) {
        const ref  = from || new Date().toISOString().split('T')[0];
        const dias = getDiasValidos();
        return dias.find(d => d >= ref) || dias[dias.length - 1];
    }

    function navegarTerca(direcao) {
        const val  = document.getElementById('datepicker').value || proximaTerca();
        const dias = getDiasValidos();
        const idx  = dias.indexOf(val);
        const novo = idx === -1
            ? (direcao > 0 ? dias.findIndex(d => d > val) : [...dias].reverse().findIndex(d => d < val))
            : idx + direcao;
        if (novo < 0 || novo >= dias.length) return;
        const novaData = idx === -1
            ? (direcao > 0 ? dias.find(d => d > val) : [...dias].reverse().find(d => d < val))
            : dias[novo];
        if (!novaData) return;
        document.getElementById('datepicker').value = novaData;
        atualizarLabel(novaData);
        loadAll();
    }

    function onDateChange() {
        const val  = document.getElementById('datepicker').value;
        if (!val) return;
        const dias = getDiasValidos();
        if (!dias.includes(val)) {
            document.getElementById('datepicker').value = proximaTerca(val);
        }
        atualizarLabel(document.getElementById('datepicker').value);
        loadAll();
    }

    async function loadAll() {
        const c = document.getElementById('content');
        c.innerHTML = `<div class="text-center mt-32">
            <i class="fas fa-apple-whole text-ouro text-5xl bounce-icon"></i>
            <p class="mt-5 font-black text-vinho text-xs tracking-[0.35em] uppercase">Preparando Agenda...</p>
        </div>`;
        try {
            const r = await fetch(API + '?action=getAll');
            const d = await r.json();
            pacs  = d.patients     || [];
            appts = d.appointments || [];
            render();
        } catch(e) {
            c.innerHTML = '<div class="text-center p-10 font-bold text-red-500 uppercase text-xs">ERRO DE CONEXÃO. VERIFIQUE A INTERNET.</div>';
        }
    }

    function render() {
        const dVal = document.getElementById('datepicker').value;

        /* nav highlight */
        document.querySelectorAll('nav button').forEach(b => {
            b.classList.remove('text-vinho', 'bg-vinho/5', 'nav-active');
            b.classList.add('text-slate-500');
        });
        const ab = document.getElementById('t-' + currentTab);
        if (ab) { ab.classList.remove('text-slate-500'); ab.classList.add('text-vinho', 'bg-vinho/5', 'nav-active'); }

        const c = document.getElementById('content');
        if      (currentTab === 'agenda')    renderAgenda(c, dVal);
        else if (currentTab === 'relatorio') renderRelatorio(c, dVal);
        else if (currentTab === 'historico') renderHistorico(c);
        else                                 renderAusentes(c);
    }

    function changeEspProf(val) { currentEspProf = val; render(); }

    /* ══════════════════════════════════════════
       AGENDA
    ══════════════════════════════════════════ */
    function renderAgenda(c, dVal) {
        if (!dVal) return;
        const dataF = dVal.split('-').reverse().join('/');
        let html = '';

        const config = [
            { n: 'ESPORTIVO',     b: 'borda-esp',  step: 25 },
            { n: 'EMAGRECIMENTO', b: 'borda-emag', step: 35 },
            { n: 'APLICAÇÃO',     b: 'borda-apl'           }
        ];

        config.forEach(cat => {
            const list = appts.filter(a => a.dataStr === dataF && a.categoria === cat.n);

            /* cabeçalho da seção */
            html += `<div class="flex justify-between items-center mb-5 mt-10 pb-2" style="border-bottom:2px solid #f1f5f9;">
                <h3 class="font-black text-[11px] text-slate-700 uppercase tracking-widest">
                    <i class="fas fa-tag text-ouro mr-2"></i>
                    ${cat.n} ${cat.n==='ESPORTIVO' ? '— '+currentEspProf : cat.n==='EMAGRECIMENTO' ? '— BRUNO' : '— SUELEN'}
                </h3>
                ${cat.n==='ESPORTIVO' ? `
                <select onchange="changeEspProf(this.value)"
                    class="p-1.5 border border-slate-200 rounded-xl font-bold text-[10px] bg-white outline-none text-vinho uppercase no-print shadow-sm">
                    <option value="GERALDO" ${currentEspProf==='GERALDO'?'selected':''}>Geraldo</option>
                    <option value="LÍBIA"   ${currentEspProf==='LÍBIA'  ?'selected':''}>Líbia</option>
                </select>` : ''}
            </div>`;

            let cardIdx = 0;

            if (cat.n === 'APLICAÇÃO') {
                const withTime = list.filter(a => a.hora && a.hora!=='ENCAIXE').sort((a,b)=>a.hora.localeCompare(b.hora));
                const noTime   = list.filter(a => !a.hora || a.hora==='ENCAIXE');
                [...withTime, ...noTime].forEach(f => { html += slotBusy(f, cat.b, cardIdx++); });
            } else {
                /* gera horários fixos */
                const fixedTimes = [];
                let h=9, m=0;
                while (h < 12) {
                    fixedTimes.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
                    m += cat.step; if (m>=60){ h++; m-=60; }
                }
                const encaixeTimes = list.filter(a => a.hora && a.hora!=='ENCAIXE' && !fixedTimes.includes(a.hora)).map(a=>a.hora);
                const noTime       = list.filter(a => !a.hora || a.hora==='ENCAIXE');
                const allTimes     = [...new Set([...fixedTimes,...encaixeTimes])].sort();

                allTimes.forEach(t => {
                    const ags = list.filter(a => a.hora===t);
                    if (ags.length===0) {
                        if (fixedTimes.includes(t)) {
                            const d=(cardIdx++*0.06).toFixed(2);
                            html += `<div onclick="openAgendar('${cat.n}','${t}')"
                                style="animation:slideInUp 0.4s ease ${d}s both;"
                                class="slot-livre p-5 mb-3 flex justify-between text-[11px] cursor-pointer">
                                <span class="font-bold text-slate-500">${t}</span>
                                <span class="text-slate-400 italic font-normal text-[10px]">Livre</span>
                            </div>`;
                        }
                    } else {
                        ags.forEach(ag => { html += slotBusy(ag, cat.b, cardIdx++); });
                    }
                });
                noTime.forEach(en => { html += slotBusy(en, cat.b, cardIdx++); });
            }

            /* botão encaixe por especialidade */
            html += `<div class="mb-8 mt-4">
                <button onclick="openAgendar('${cat.n}','')" class="btn-vinho w-full py-4 text-[10px]">
                    <i class="fas fa-plus mr-2"></i>Encaixe ${cat.n}
                </button>
            </div>`;
        });

        c.innerHTML = html;
    }

    function renderRelatorio(c, dVal) {
        if (!dVal) return;
        const dataF = dVal.split('-').reverse().join('/');
        document.getElementById('print-date-label').innerText = "RELATÓRIO DE ATENDIMENTOS — " + dataF;

        let html = `
        <div class="no-print mb-6 flex gap-3 items-center">
            <button onclick="window.print()" class="btn-vinho flex-1 py-5 rounded-[22px] text-[10px]">
                <i class="fas fa-print mr-2"></i>Imprimir Folha de Atendimento
            </button>
            <select onchange="changeEspProf(this.value)"
                class="p-4 border-2 border-slate-100 rounded-2xl font-black text-[10px] bg-white outline-none text-vinho uppercase shadow-sm">
                <option value="GERALDO" ${currentEspProf==='GERALDO'?'selected':''}>GERALDO</option>
                <option value="LÍBIA"   ${currentEspProf==='LÍBIA'  ?'selected':''}>LÍBIA</option>
            </select>
        </div>
        <div class="print-area">
            <div style="text-align:center;padding:16px 0 14px;border-bottom:2.5px solid #722f51;margin-bottom:22px;">
                <i class="fas fa-apple-whole" style="font-size:22px;color:#bca374;"></i>
                <div style="font-size:14px;font-weight:900;color:#722f51;letter-spacing:2px;text-transform:uppercase;margin:5px 0 3px;">
                    AGENDA LOURDES — RELATÓRIO DE ATENDIMENTOS
                </div>
                <div style="font-size:11px;font-weight:700;color:#bca374;letter-spacing:1px;">${dataF}</div>
            </div>`;

        /* cores de fundo das seções (igual à foto) — texto sempre escuro */
        const blocos = [
            { id:'ESPORTIVO',     title:`ESPORTIVO — ${currentEspProf}`, bgSec:'#FFF3E6', bgTh:'#FFD9A8' },
            { id:'EMAGRECIMENTO', title:'EMAGRECIMENTO — BRUNO',          bgSec:'#E8F2FF', bgTh:'#BBDEFB' },
            { id:'APLICAÇÃO',     title:'APLICAÇÃO',                      bgSec:'#F3E8FF', bgTh:'#DFC5FF' }
        ];
        const txtEscuro = '#334155';   /* cor única escura para todos os textos do relatório */

        blocos.forEach(b => {
            const list = appts.filter(a => a.dataStr===dataF && a.categoria===b.id)
                .sort((p,q)=>{
                    if (!p.hora||p.hora==='ENCAIXE') return 1;
                    if (!q.hora||q.hora==='ENCAIXE') return -1;
                    return p.hora.localeCompare(q.hora);
                });

            const rows = list.map(a => {
                const pac  = buscarPac(a.paciente);
                const hist = appts.filter(x => x.paciente===a.paciente && x.dataStr!==dataF)
                    .sort((x,y)=>{
                        const dx=x.dataStr.split('/'), dy=y.dataStr.split('/');
                        return new Date(dy[2],dy[1]-1,dy[0]) - new Date(dx[2],dx[1]-1,dx[0]);
                    });
                const ultimaVisita = hist.length ? hist[0].dataStr : '';
                const ultimoProc   = hist.length ? hist[0].servico  : '';
                let hojeLabel = '';
                if      (!hist.length)                              hojeLabel = 'Primeira Consulta';
                else if (a.servico.toUpperCase().includes('RETORNO')) hojeLabel = 'Retorno';
                else                                                hojeLabel = 'Consulta';
                return { a, pac, ultimaVisita, ultimoProc, hojeLabel };
            });

            const thS = `padding:8px 10px;border:1px solid #e2e8f0;font-size:8.5px;font-weight:900;text-transform:uppercase;color:${txtEscuro};`;
            const tdS = `padding:9px 10px;border:1px solid #e2e8f0;color:${txtEscuro};`;

            html += `
            <div class="relatorio-section" style="margin-bottom:28px;">
                <div style="background:${b.bgSec};padding:9px 14px;font-weight:900;font-size:11px;
                    text-transform:uppercase;color:${txtEscuro};border-radius:6px 6px 0 0;
                    border:1px solid ${b.bgTh};border-bottom:none;">
                    * ${b.title}
                </div>
                <table style="width:100%;border-collapse:collapse;font-size:10.5px;background:white;border:1px solid #e2e8f0;">
                    <thead>
                        <tr style="background:${b.bgTh};">
                            <th style="${thS}white-space:nowrap;">Horário</th>
                            <th style="${thS}">Paciente</th>
                            <th style="${thS}">Telefone</th>
                            <th style="${thS}white-space:nowrap;">Nascimento</th>
                            <th style="${thS}">Email</th>
                            <th style="${thS}">Alt.</th>
                            <th style="${thS}white-space:nowrap;">Última visita</th>
                            <th style="${thS}white-space:nowrap;">Último proc.</th>
                            <th style="${thS}">Hoje</th>
                            <th style="${thS}">Observação</th>
                        </tr>
                    </thead>
                    <tbody>`;

            if (!rows.length) {
                html += `<tr><td colspan="10" style="text-align:center;padding:18px;color:#cbd5e1;font-style:italic;">Sem pacientes listados</td></tr>`;
            } else {
                rows.forEach(({ a, pac, ultimaVisita, ultimoProc, hojeLabel }) => {
                    html += `<tr>
                        <td style="${tdS}text-align:center;font-weight:700;white-space:nowrap;">${a.hora||'ENC'}</td>
                        <td style="${tdS}font-weight:800;text-transform:uppercase;">${a.paciente}</td>
                        <td style="${tdS}text-align:center;">${pac.telefone   ||'-'}</td>
                        <td style="${tdS}text-align:center;">${pac.nascimento ||'-'}</td>
                        <td style="${tdS}">${pac.email||'-'}</td>
                        <td style="${tdS}text-align:center;">${pac.altura||'-'}</td>
                        <td style="${tdS}text-align:center;font-size:9.5px;">${ultimaVisita}</td>
                        <td style="${tdS}font-size:8.5px;text-align:center;">${ultimoProc}</td>
                        <td style="${tdS}font-weight:700;font-size:9.5px;text-align:center;white-space:nowrap;">${hojeLabel}</td>
                        <td style="${tdS}font-style:italic;">${a.obs||''}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div>`;
        });

        c.innerHTML = html + `</div>`;
    }

    function openAgendar(cat, hora) {
        let servOptions = cat === 'APLICAÇÃO'
            ? `<option value="CONSULTA">CONSULTA / APLICAÇÃO</option><option value="RETORNO">RETORNO</option>`
            : `<option value="CONSULTA">CONSULTA</option><option value="RETORNO">RETORNO</option>`;

        document.getElementById('m-content').innerHTML = `
            <div class="text-center mb-6">
                <div class="inline-block bg-gradient-to-br from-amber-50 to-orange-50 p-4 rounded-3xl shadow-inner">
                    <i class="fas fa-calendar-check text-ouro text-3xl"></i>
                </div>
                <h2 class="font-black text-xl mt-3 uppercase text-vinho">Encaixe — ${cat}</h2>
            </div>
            <div class="space-y-4 relative">
                <div class="relative">
                    <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Paciente</label>
                    <input type="text" id="newPac" placeholder="BUSCAR OU DIGITAR NOME" autocomplete="off"
                        class="w-full p-4 bg-slate-50 border rounded-2xl font-black uppercase outline-none text-xs text-vinho transition-all">
                    <div id="suggestions" class="suggestions-box hidden"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Horário</label>
                        <input type="text" id="newHora" value="${hora||''}" placeholder="HH:MM"
                            class="w-full p-4 bg-slate-50 border rounded-2xl font-black text-xs outline-none transition-all">
                    </div>
                    <div>
                        <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Observação</label>
                        <input type="text" id="newObs" placeholder="OPCIONAL"
                            class="w-full p-4 bg-slate-50 border rounded-2xl font-bold text-xs outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="text-[8px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Serviço</label>
                    <select id="newServ" class="w-full p-4 bg-slate-50 border rounded-2xl font-black text-[10px] outline-none text-vinho uppercase transition-all">
                        ${servOptions}
                    </select>
                </div>
                <button id="btnS" onclick="salvarNovo('${cat}')" class="btn-vinho w-full p-5 mt-4">Reservar Horário</button>
            </div>`;

        document.getElementById('modal').classList.remove('hidden');
        const pop = document.querySelector('#modal > div');
        pop.classList.remove('modal-pop'); void pop.offsetWidth; pop.classList.add('modal-pop');

        const input = document.getElementById('newPac');
        const Snowy = document.getElementById('suggestions');
        input.addEventListener('input', () => {
            const val = normalizar(input.value);
            Snowy.innerHTML = '';
            if (val.length < 2) { Snowy.classList.add('hidden'); return; }
            const filtered = pacs.filter(p => normalizar(p.nome).includes(val)).slice(0,5);
            if (filtered.length) {
                Snowy.classList.remove('hidden');
                filtered.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = p.nome;
                    div.onclick = () => { input.value = p.nome; Snowy.classList.add('hidden'); };
                    Snowy.appendChild(div);
                });
            } else Snowy.classList.add('hidden');
        });
    }

    async function salvarNovo(cat) {
        const inputNome = document.getElementById('newPac').value.toUpperCase().trim();
        if (!inputNome) return alert("NOME VAZIO!");
        document.getElementById('btnS').innerText = "AGENDANDO...";
        const data     = document.getElementById('datepicker').value.split('-').reverse().join('/');
        const horaVal  = document.getElementById('newHora').value.trim() || 'ENCAIXE';
        const obsVal   = document.getElementById('newObs').value;
        const servBase = document.getElementById('newServ').value;
        let servFull   = servBase;
        if      (cat==='ESPORTIVO')     servFull = servBase==='RETORNO' ? `RETORNO NUTRIÇÃO ESPORTIVA (${currentEspProf})`     : `CONSULTA NUTRIÇÃO ESPORTIVA (${currentEspProf})`;
        else if (cat==='EMAGRECIMENTO') servFull = servBase==='RETORNO' ? 'RETORNO NUTRIÇÃO EMAGRECIMENTO (BRUNO)'               : 'CONSULTA NUTRIÇÃO EMAGRECIMENTO (BRUNO)';
        else if (cat==='APLICAÇÃO')     servFull = servBase==='RETORNO' ? 'RETORNO APLICAÇÃO (SUELEN)'                           : 'APLICAÇÃO DE INJETÁVEIS (SUELEN)';
        await fetch(API,{method:'POST',body:JSON.stringify({action:'addAppointment',paciente:inputNome,servico:servFull,data:data,hora:horaVal,categoria:cat,obs:obsVal})});
        closeModal(); loadAll();
    }

            <div class="p-1">

                <div id="histResults" class="mt-6"></div>
            </div>`;
    }

    function searchHist() {

        matches.forEach(pac => {
            const safeId = pac.nome.replace(/\s+/g,'');
            const hPac   = appts.filter(x=>x.paciente===pac.nome).sort((a,b)=>b.dataStr.localeCompare(a.dataStr)).slice(0,3);
            html += `
                <div class="premium-card p-6 mb-4 border-l-8 border-vinho" style="animation:slideInUp 0.35s ease both;">
                    <div class="bg-slate-50 p-4 rounded-2xl mb-4 border border-slate-100">
                        <label class="text-[8px] font-black text-slate-400 block uppercase mb-1">Paciente</label>
                        <input type="text" id="eNome-${safeId}" value="${pac.nome}" class="w-full bg-transparent font-black text-sm uppercase outline-none text-vinho">
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[7px] font-black text-slate-400 block uppercase">Tel</label>  <input type="text" id="eTel-${safeId}"   value="${pac.telefone   ||''}" class="w-full bg-transparent font-bold text-xs outline-none"></div>
                        <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[7px] font-black text-slate-400 block uppercase">Nasc</label> <input type="text" id="eNas-${safeId}"   value="${pac.nascimento||''}" class="w-full bg-transparent font-bold text-xs outline-none"></div>
                        <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[7px] font-black text-slate-400 block uppercase">Email</label><input type="text" id="eEmail-${safeId}" value="${pac.email      ||''}" class="w-full bg-transparent font-bold text-xs outline-none"></div>
                        <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[7px] font-black text-slate-400 block uppercase">Alt</label>  <input type="text" id="eAlt-${safeId}"   value="${pac.altura     ||''}" class="w-full bg-transparent font-bold text-xs outline-none"></div>
                    </div>
                    <div class="mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <p class="text-[8px] font-black text-slate-500 uppercase mb-2">
                            <i class="fas fa-clock-rotate-left mr-1"></i>Histórico Recente
                        </p>
                        ${hPac.length
                            ? hPac.map(v=>`<div class="flex justify-between text-[10px] py-1.5 border-b last:border-0 border-slate-200">
                                <span class="font-bold text-slate-600">${v.dataStr}</span>
                                <span class="font-black uppercase text-[8px] text-slate-700">${formatServico(v.servico,v.categoria)}</span>

                            : '<p class="text-[10px] text-slate-300 italic">Sem visitas registradas</p>'}

                    <div class="flex gap-2">
                        <button onclick="salvarEdicao('${pac.nome}')"    class="btn-vinho flex-1 py-3 text-[9px]">Atualizar Dados</button>
                        <button onclick="deletarPaciente('${pac.nome}')" class="bg-red-50 text-red-500 px-5 rounded-2xl hover:bg-red-100 transition-all"><i class="fas fa-trash-can"></i></button>
                    </div>

        });
        results.innerHTML = html || "<p class='text-center text-slate-300 font-black text-[10px] uppercase py-8 tracking-widest'>Nenhum paciente localizado</p>";

    async function salvarEdicao(nomeOrig) {
        const safeId = nomeOrig.replace(/\s+/g,'');
        await fetch(API,{method:'POST',body:JSON.stringify({action:'editPatient',nome:nomeOrig,novoNome:document.getElementById(`eNome-${safeId}`).value.toUpperCase().trim(),telefone:document.getElementById(`eTel-${safeId}`).value,nascimento:document.getElementById(`eNas-${safeId}`).value,email:document.getElementById(`eEmail-${safeId}`).value,altura:document.getElementById(`eAlt-${safeId}`).value})});
        alert("ATUALIZADO!"); loadAll();
    }

    async function salvarCadastroCompleto() {
        const n = document.getElementById('cadNome').value.toUpperCase().trim();
        if (!n) return alert("NOME OBRIGATÓRIO!");
        document.getElementById('btnCad').innerText = "GRAVANDO...";
        await fetch(API,{method:'POST',body:JSON.stringify({action:'addPatient',nome:n,telefone:document.getElementById('cadTel').value,nascimento:document.getElementById('cadNas').value,email:document.getElementById('cadEmail').value,altura:document.getElementById('cadAlt').value})});
        alert("CADASTRADO COM SUCESSO!"); loadAll();
    }

    async function deletarPaciente(nome) {
        if (!confirm("REMOVER CADASTRO?")) return;
        await fetch(API,{method:'POST',body:JSON.stringify({action:'deletePatient',nome:nome})});
        loadAll();
    }

    /* ══════════════════════════════════════════
       RENOVAÇÃO DE PROTOCOLO
    ══════════════════════════════════════════ */
    const PRAZO_PROTOCOLO = 28; /* dias — margem antes dos 30 */
    let filtroRetorno = 'urgente';

    function renderAusentes(c) {
        const hoje = new Date(); hoje.setHours(0,0,0,0);

        /* Monta lista de todos os pacientes com histórico, ignorando os ocultos */
        const lista = pacs
            .filter(p => !excludedRetornos.includes(p.nome))
            .map(p => {
                const hist = appts
                    .filter(a => a.paciente === p.nome)
                    .sort((a,b) => {
                        const da = a.dataStr.split('/'); const db = b.dataStr.split('/');
                        return new Date(db[2],db[1]-1,db[0]) - new Date(da[2],da[1]-1,da[0]);
                    });
                if (!hist.length) return null;
                const ult  = hist[0];
                const dp   = ult.dataStr.split('/');
                const dtUlt= new Date(dp[2],dp[1]-1,dp[0]);
                const dtRet= new Date(dtUlt); dtRet.setDate(dtUlt.getDate() + PRAZO_PROTOCOLO);
                const diasRestantes = Math.round((dtRet - hoje)/(1000*3600*24));
                return { p, ult, dtRet, diasRestantes };
            })
            .filter(Boolean)
            .sort((a,b) => a.diasRestantes - b.diasRestantes); /* mais urgentes primeiro */

        /* Aplica filtro */
        const filtrado = lista.filter(item => {
            if (filtroRetorno === 'urgente')  return item.diasRestantes <= 0;
            if (filtroRetorno === 'semana')   return item.diasRestantes > 0 && item.diasRestantes <= 7;
            return true; /* todos */
        });

        /* Contadores para os badges */
        const cUrgente = lista.filter(i => i.diasRestantes <= 0).length;
        const cSemana  = lista.filter(i => i.diasRestantes > 0 && i.diasRestantes <= 7).length;
        const cTodos   = lista.length;

        const btnClass  = (k) => filtroRetorno === k
            ? 'btn-vinho px-4 py-2 text-[9px] rounded-2xl'
            : 'bg-slate-100 text-slate-500 px-4 py-2 text-[9px] font-black uppercase rounded-2xl hover:bg-slate-200 transition-all';

        let html = `
        <div class="mb-6">
            <h2 class="font-black text-slate-700 uppercase text-[11px] mb-4 tracking-widest">
                <i class="fas fa-rotate text-ouro mr-2"></i>Renovação de Protocolo
            </h2>
            <div class="flex gap-2 flex-wrap">
                <button onclick="setFiltroRetorno('urgente')" class="${btnClass('urgente')}">
                    🔴 Vencido <span class="ml-1 bg-white/30 px-1.5 rounded-full">${cUrgente}</span>
                </button>
                <button onclick="setFiltroRetorno('semana')" class="${btnClass('semana')}">
                    🟠 Esta semana <span class="ml-1 bg-white/30 px-1.5 rounded-full">${cSemana}</span>
                </button>
                <button onclick="setFiltroRetorno('todos')" class="${btnClass('todos')}">
                    📋 Todos <span class="ml-1 bg-white/30 px-1.5 rounded-full">${cTodos}</span>
                </button>
            </div>
        </div>`;

        if (!filtrado.length) {
            const msgs = {
                urgente: '✓ Nenhum protocolo vencido!',
                semana:  '✓ Nenhum vencimento esta semana!',
                todos:   '✓ Nenhum paciente com histórico.'
            };
            html += `<p class="text-center py-20 text-slate-300 font-black text-xs tracking-widest">${msgs[filtroRetorno]}</p>`;
            c.innerHTML = html; return;
        }

        filtrado.forEach((item, i) => {
            const { p, ult, dtRet, diasRestantes } = item;
            const diaRet = String(dtRet.getDate()).padStart(2,'0');
            const mesRet = String(dtRet.getMonth()+1).padStart(2,'0');
            const anoRet = dtRet.getFullYear();
            const dataRetFmt = `${diaRet}/${mesRet}/${anoRet}`;
            const servLabel  = formatServico(ult.servico, ult.categoria);

            /* cor e status */
            let borda, statusIcon, statusTxt, bgStatus;
            if (diasRestantes < 0) {
                borda='border-red-400'; bgStatus='bg-red-50'; statusIcon='🔴';
                statusTxt=`VENCIDO HÁ ${Math.abs(diasRestantes)} DIA${Math.abs(diasRestantes)>1?'S':''}`;
            } else if (diasRestantes === 0) {
                borda='border-red-300'; bgStatus='bg-red-50'; statusIcon='🔴';
                statusTxt='VENCE HOJE';
            } else if (diasRestantes <= 3) {
                borda='border-orange-400'; bgStatus='bg-orange-50'; statusIcon='🟠';
                statusTxt=`VENCE EM ${diasRestantes} DIA${diasRestantes>1?'S':''}`;
            } else if (diasRestantes <= 7) {
                borda='border-yellow-400'; bgStatus='bg-yellow-50'; statusIcon='🟡';
                statusTxt=`VENCE EM ${diasRestantes} DIAS`;
            } else if (diasRestantes <= 14) {
                borda='border-blue-300'; bgStatus='bg-blue-50'; statusIcon='🔵';
                statusTxt=`VENCE EM ${diasRestantes} DIAS`;
            } else {
                borda='border-green-300'; bgStatus='bg-green-50'; statusIcon='🟢';
                statusTxt=`VENCE EM ${diasRestantes} DIAS`;
            }

            html += `
            <div class="premium-card p-5 mb-3 border-l-8 ${borda}"
                style="animation:slideInUp 0.4s ease ${(i*0.06).toFixed(2)}s both;">
                <div class="flex justify-between items-start">
                    <div class="flex-1 min-w-0 mr-3">
                        <p class="font-black uppercase text-vinho text-sm tracking-tight leading-tight">${p.nome}</p>
                        <p class="text-[10px] text-slate-500 font-medium mt-1">${servLabel} • Últ: ${ult.dataStr}</p>
                        <div class="inline-flex items-center gap-1.5 mt-2 px-3 py-1 rounded-xl ${bgStatus}">
                            <span class="text-[10px]">${statusIcon}</span>
                            <span class="text-[9px] font-black uppercase tracking-wide text-slate-600">${statusTxt}</span>
                        </div>
                        <p class="text-[9px] text-slate-400 font-medium mt-1.5">
                            <i class="fas fa-calendar-check mr-1"></i>Retorno sugerido: <span class="font-black text-slate-600">${dataRetFmt}</span>
                        </p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="chamarProtocolo('${p.nome}','${p.telefone}','${servLabel}','${ult.categoria}')"
                            class="bg-green-50 text-green-600 p-3 rounded-2xl zap-btn hover:bg-green-100 transition-all">
                            <i class="fab fa-whatsapp text-lg"></i>
                        </button>
                        <button onclick="excludeRetorno('${p.nome}')"
                            class="bg-slate-100 text-slate-400 p-3 rounded-2xl hover:bg-slate-200 transition-all">
                            <i class="fas fa-eye-slash text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        });

        c.innerHTML = html;
    }

    function setFiltroRetorno(f) { filtroRetorno = f; render(); }

    function chamarProtocolo(nome, tel, servico, categoria) {
        const livres = getProximosLivres(categoria, 2);

        let horariosMsg = '';
        if (livres.length) {
            horariosMsg = '\n\n📅 *Horários disponíveis:*\n' +
                livres.map(l => `▪️ ${l.dataFmt} às ${l.hora}`).join('\n');
        } else {
            horariosMsg = '\n\nPodemos verificar um horário disponível para você!';
        }

        const msg = `Olá ${nome}! 👋\nEstamos passando para avisar que está na hora de renovar o seu *protocolo de ${servico}*! 💊✨${horariosMsg}\n\nQual prefere? 😊`;
        abrirZap(tel, msg);
    }

    /* ─── Abre WhatsApp Business no Android; wa.me no iOS/desktop ─── */
    function abrirZap(tel, msg) {
        const encoded = encodeURIComponent(msg);
        const fone    = tel.startsWith('55') ? tel : formatarTel(tel);
        if (/android/i.test(navigator.userAgent)) {
            window.location.href = `intent://send?phone=${fone}&text=${encoded}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end`;
        } else {
            window.open(`https://wa.me/${fone}?text=${encoded}`);
        }
    }

    function chamarRetorno(n, t) {
        abrirZap(t, `Olá ${n}! 👋\nGostaríamos de convidá-lo(a) a retornar ao consultório para dar continuidade às suas metas! 📊✨\nPodemos agendar um horário para você esta semana?`);
    }

    function excludeRetorno(n) {
        excludedRetornos.push(n);
        localStorage.setItem('excludedRetornos', JSON.stringify(excludedRetornos));
        render();
    }

    /* ══════════════════════════════════════════
       DISPONIBILIDADE RÁPIDA — WhatsApp
    ══════════════════════════════════════════ */
    function openDisponibilidade() {
        document.getElementById('m-content').innerHTML = `
            <div class="text-center mb-6">
                <div class="inline-block bg-green-50 p-4 rounded-3xl shadow-inner">
                    <i class="fab fa-whatsapp text-green-500 text-3xl"></i>
                </div>
                <h2 class="font-black text-xl mt-3 uppercase text-vinho">Horários Livres</h2>
                <p class="text-[10px] text-slate-400 mt-1">Gera mensagem com os 2 próximos horários</p>
            </div>
            <div class="space-y-4">

                    <div class="grid grid-cols-3 gap-2">

                            <i class="fas fa-dumbbell block text-lg mb-1"></i>Esportivo
                        </button>
                        <button onclick="selecionarEsp(this,'EMAGRECIMENTO')"
                            class="esp-btn p-3 rounded-2xl border-2 border-slate-200 text-[9px] font-black uppercase text-slate-600 transition-all hover:border-vinho hover:text-vinho">
                            <i class="fas fa-weight-scale block text-lg mb-1"></i>Emagrecimento
                        </button>
                        <button onclick="selecionarEsp(this,'APLICAÇÃO')"
                            class="esp-btn p-3 rounded-2xl border-2 border-slate-200 text-[9px] font-black uppercase text-slate-600 transition-all hover:border-vinho hover:text-vinho">
                            <i class="fas fa-syringe block text-lg mb-1"></i>Aplicação
                        </button>
                    </div>
                </div>
                <div id="disp-preview" class="hidden">
                    <div class="bg-green-50 border border-green-200 rounded-2xl p-4 mt-2">
                        <p class="text-[9px] font-black text-green-700 uppercase tracking-widest mb-3">
                            <i class="fas fa-eye mr-1"></i>Prévia da mensagem
                        </p>
                        <p id="disp-texto" class="text-[11px] text-slate-700 font-medium whitespace-pre-line leading-relaxed"></p>
                    </div>
                    <button id="btnZapDisp" onclick="enviarDisponibilidade()"
                        class="w-full mt-4 p-5 rounded-2xl font-black uppercase text-[10px] tracking-widest text-white shadow-xl transition-all"
                        style="background:linear-gradient(135deg,#25d366,#1da851);box-shadow:0 4px 14px rgba(37,211,102,0.4);">
                        <i class="fab fa-whatsapp mr-2"></i>Abrir WhatsApp
                    </button>
                </div>
                <div id="disp-vazio" class="hidden text-center py-6">
                    <i class="fas fa-calendar-xmark text-slate-300 text-3xl mb-3 block"></i>
                    <p class="text-[11px] font-black text-slate-400 uppercase">Nenhum horário livre nos próximos 14 dias</p>
                </div>
                <button onclick="closeModal()" class="w-full text-slate-400 font-black text-[10px] uppercase mt-2 tracking-widest text-center hover:text-slate-600 transition-all">Cancelar</button>
            </div>`;

        document.getElementById('modal').classList.remove('hidden');
        const pop = document.querySelector('#modal > div');
        pop.classList.remove('modal-pop'); void pop.offsetWidth; pop.classList.add('modal-pop');

    let _espSelecionada = '';
    let _msgDisp = '';

    function selecionarEsp(btn, esp) {
        /* highlight do botão */
        document.querySelectorAll('.esp-btn').forEach(b => {
            b.classList.remove('border-vinho','text-vinho','bg-vinho/5');
            b.classList.add('border-slate-200','text-slate-600');
        });
        btn.classList.remove('border-slate-200','text-slate-600');
        btn.classList.add('border-vinho','text-vinho','bg-vinho/5');

        _espSelecionada = esp;
        const livres = getProximosLivres(esp, 2);

        const preview  = document.getElementById('disp-preview');
        const vazio    = document.getElementById('disp-vazio');
        const textoEl  = document.getElementById('disp-texto');

        if (!livres.length) {
            preview.classList.add('hidden');
            vazio.classList.remove('hidden');
            return;
        }
        vazio.classList.add('hidden');

        const espLabel = esp === 'ESPORTIVO'
            ? `Nutrição Esportiva (${currentEspProf})`
            : esp === 'EMAGRECIMENTO'
                ? 'Nutrição Emagrecimento'
                : 'Aplicação de Injetáveis';

        const linhas = livres.map(l => `📅 ${l.dataFmt} às ${l.hora}`).join('\n');
        _msgDisp = `Olá! 😊\nTemos estes horários disponíveis para *${espLabel}*:\n\n${linhas}\n\nQual prefere?`;

        textoEl.innerText = _msgDisp;
        preview.classList.remove('hidden');
    }

    function getProximosLivres(esp, quantidade) {
        const stepMap = { 'ESPORTIVO': 25, 'EMAGRECIMENTO': 35 };
        const livres  = [];
        const hoje    = new Date();

        for (let d = 0; d <= 60 && livres.length < quantidade; d++) {
            const dt = new Date(hoje);
            dt.setDate(hoje.getDate() + d);

            /* ── SOMENTE TERÇAS (getDay() === 2) ── */
            if (dt.getDay() !== 2) continue;

            const dia   = String(dt.getDate()).padStart(2,'0');
            const mes   = String(dt.getMonth()+1).padStart(2,'0');
            const ano   = dt.getFullYear();
            const dataF = `${dia}/${mes}/${ano}`;

            const ocupados = appts
                .filter(a => a.dataStr === dataF && a.categoria === esp)
                .map(a => a.hora);

            if (esp === 'APLICAÇÃO') {
                if (!ocupados.length)
                    livres.push({ dataFmt: `Terça ${dataF}`, hora: 'horário a combinar' });
            } else {
                let h = 9, m = 0;
                const step = stepMap[esp];
                while (h < 12 && livres.length < quantidade) {
                    const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                    if (!ocupados.includes(t))
                        livres.push({ dataFmt: `Terça ${dataF}`, hora: t });
                    m += step; if (m >= 60) { h++; m -= 60; }
                }
            }
        }
        return livres;
    }

    function enviarDisponibilidade() {
        abrirZap('', _msgDisp);
    }

    function showTab(t)   { currentTab = t; render(); }
    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    window.onload = () => {
        const terca = proximaTerca();
        document.getElementById('datepicker').value = terca;
        atualizarLabel(terca);
        loadAll();
    };
