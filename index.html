<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Clínica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--esp:#f97316;--emag:#3b82f6;--aplic:#a855f7;--roxo:#4a148c}
        body{background:#fafafa;font-family:'Quicksand',sans-serif;color:#111;-webkit-tap-highlight-color:transparent}
        .header-bar{width:100%;background:linear-gradient(135deg, #4a148c 0%, #7b1fa2 100%);padding:16px;text-align:center;color:white}
        .header-title{font-size:18px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
        .date-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:#fff;border-bottom:2px solid #eee}
        .date-row input[type=date]{padding:6px 12px;border:2px solid #eee;border-radius:12px;font-weight:700;font-size:14px;background:#fafafa}
        .badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
        .b-ter{background:#f0fdf4;color:#16a34a}.b-blq{background:#fef2f2;color:#dc2626}
        .slot{border-radius:18px;border:1px solid #f0f0f0;cursor:pointer;margin-bottom:10px;background:#fff;padding:18px 20px;position:relative}
        .sl-esp{border-left:8px solid var(--esp)}.sl-emag{border-left:8px solid var(--emag)}.sl-aplic{border-left:8px solid var(--aplic)}
        .sl-busy{border:none!important;color:#fff!important}
        .bg-esp{background:var(--esp)!important}.bg-emag{background:var(--emag)!important}.bg-aplic{background:var(--aplic)!important}
        .slot-btns{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:10}
        .slot-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.2);color:#fff}
        nav button{transition:color .15s}.tab-on{color:var(--roxo)!important;font-weight:800;border-top:3px solid var(--roxo)}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
        .modal-box{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:28px 24px 40px;max-height:92vh;overflow-y:auto}
        .sug{position:absolute;width:100%;top:100%;left:0;z-index:300;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);overflow:hidden;max-height:250px}
        .sug div{padding:13px 16px;border-bottom:1px solid #f5f5f5;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
        .spinner{width:36px;height:36px;border:4px solid #eee;border-top:4px solid var(--roxo);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .rtable{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:20px}
        .rtable th,.rtable td{border:1px solid #ccc;padding:6px;text-align:left}
        @media print { nav, .header-bar, .date-row, .btn-print { display: none !important; } body { background: white; padding: 0; } .rtable { font-size: 12px; } }
    </style>
</head>
<body class="pb-24">
<header>
    <div class="header-bar"><div class="header-title">📋 Clínica Dr. Jorge Salomão</div></div>
    <div class="date-row">
        <input type="date" id="datepicker" onchange="onDateChange()">
        <span id="day-badge" class="badge"></span>
    </div>
</header>

<main id="content" class="p-4 max-w-2xl mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 shadow-lg text-gray-400 text-[9px] font-bold uppercase overflow-x-auto">
    <button onclick="showTab('agenda')" id="tab-agenda" class="flex-1 flex flex-col items-center gap-1 pt-2"><i class="fas fa-calendar-day text-xl"></i>Agenda</button>
    <button onclick="showTab('historico')" id="tab-historico" class="flex-1 flex flex-col items-center gap-1 pt-2"><i class="fas fa-history text-xl"></i>Histórico</button>
    <button onclick="showTab('relatorio')" id="tab-relatorio" class="flex-1 flex flex-col items-center gap-1 pt-2"><i class="fas fa-file-alt text-xl"></i>Relatório</button>
    <button onclick="showTab('acompanhamento')" id="tab-acompanhamento" class="flex-1 flex flex-col items-center gap-1 pt-2"><i class="fas fa-phone text-xl"></i>Acomp.</button>
</nav>

<div id="modal" class="hidden modal-bg" onclick="closeBg(event)">
    <div class="modal-box">
        <h2 id="modal-title" class="font-black text-xl mb-5 uppercase text-center text-purple-900">Agendar</h2>
        
        <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Paciente</label>
        <div class="relative mb-4">
            <input type="text" id="m-pac" oninput="sugerir(this.value,'sug-modal')" placeholder="Nome do paciente..." class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 outline-none text-sm">
            <div id="sug-modal" class="sug hidden"></div>
        </div>

        <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Serviço</label>
        <select id="m-servico" class="w-full p-4 border-2 rounded-2xl mb-4 font-bold bg-gray-50 text-sm">
            <option>Consulta</option><option>Retorno</option><option>Aplicação</option><option>Primeira Consulta</option>
        </select>

        <label class="text-[10px] font-bold text-gray-400 uppercase ml-2">Profissional Responsável</label>
        <input list="lista-pro" id="m-pro" placeholder="Nome do Médico/Profissional" class="w-full p-4 border-2 rounded-2xl mb-4 font-bold bg-gray-50 text-sm outline-none">
        <datalist id="lista-pro">
            <option value="Geraldo">
            <option value="Libia">
            <option value="Bruno">
            <option value="Suelen">
        </datalist>

        <div id="edit-fields" class="hidden space-y-3 mb-4">
            <div class="flex gap-2">
                <div class="flex-1"><label class="text-[10px] font-bold text-gray-400 ml-2">DATA</label><input type="date" id="m-data" class="w-full p-3 border-2 rounded-xl font-bold bg-gray-50 text-sm"></div>
                <div class="flex-1"><label class="text-[10px] font-bold text-gray-400 ml-2">HORA</label><input type="time" id="m-hora" class="w-full p-3 border-2 rounded-xl font-bold bg-gray-50 text-sm"></div>
            </div>
            <label class="text-[10px] font-bold text-gray-400 ml-2 uppercase">Categoria</label>
            <select id="m-cat" class="w-full p-3 border-2 rounded-xl font-bold bg-gray-50 text-sm"><option>Esportivo</option><option>Emagrecimento</option><option>Aplicação</option></select>
        </div>

        <div class="flex gap-2 flex-wrap mt-4">
            <button onclick="closeModal()" class="flex-1 p-3 font-bold text-gray-400 rounded-2xl border-2 text-xs">SAIR</button>
            <button id="btn-del-modal" onclick="delAppt()" class="hidden flex-1 bg-red-500 text-white p-3 rounded-2xl font-bold text-xs uppercase">Excluir</button>
            <button onclick="saveAppt()" class="flex-1 bg-black text-white p-3 rounded-2xl font-bold text-xs uppercase">Salvar Agendamento</button>
        </div>
    </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyxG7L8_zUGjzhFUFwMQzLI2R_IGjIBgZiw4lESf7wqK4YBTCS23Wub0BFuhOfp_FM5/exec";
let pacs = [], appts = [];
let mTime, mCat, mId = null;

function normalizar(t) { return String(t || '').trim().toUpperCase(); }

function formatarData(d) {
    if (!d) return ''; d = String(d).trim();
    if (d.includes('GMT') || d.length > 15) {
        const dateObj = new Date(d);
        return isNaN(dateObj) ? d : `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
    }
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : d;
}

window.onload = () => {
    const d = new Date();
    const diff = (2 - d.getDay() + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
    document.getElementById('datepicker').value = d.toLocaleDateString('en-CA');
    updateBadge(); showTab('agenda'); loadAll();
};

async function loadAll() {
    showSpinner();
    try {
        const r = await fetch(API + '?action=getAll');
        const d = await r.json();
        pacs = (d.patients || []).map(p => ({...p, norm: normalizar(p.nome)}));
        appts = (d.appointments || []).map(a => ({
            ...a, data: formatarData(a.data), hora: String(a.hora || '').trim(), norm: normalizar(a.paciente), pro: a.profissional || ''
        }));
        render();
    } catch(e) { console.error(e); }
}

function onDateChange() { updateBadge(); render(); }
function updateBadge() {
    const b = document.getElementById('day-badge');
    const day = new Date(document.getElementById('datepicker').value + 'T12:00:00').getDay();
    if (day === 2) { b.textContent = 'TERÇA'; b.className = 'badge b-ter'; }
    else { b.textContent = 'BLOQUEADO'; b.className = 'badge b-blq'; }
}

function showTab(t) { 
    window.TAB = t; 
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-on'));
    document.getElementById('tab-'+t).classList.add('tab-on');
    render(); 
}

function showSpinner() { document.getElementById('content').innerHTML = '<div class="spinner"></div>'; }

function render() {
    const c = document.getElementById('content');
    const day = new Date(document.getElementById('datepicker').value + 'T12:00:00').getDay();
    if (window.TAB === 'agenda') {
        if (day !== 2) { c.innerHTML = `<p class="mt-12 text-center text-red-400 font-bold uppercase">Selecione uma terça-feira.</p>`; return; }
        c.innerHTML = catHTML('Esportivo', 'sl-esp', 'bg-esp', 25) + catHTML('Emagrecimento', 'sl-emag', 'bg-emag', 35) + catHTML('Aplicação', 'sl-aplic', 'bg-aplic', 30);
    } else if (window.TAB === 'historico') {
        c.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><h2 class="font-black text-xl mb-4 text-purple-900 uppercase">Histórico</h2><div class="relative"><input id="inp-hist" oninput="sugerir(this.value,'sug-hist')" type="text" placeholder="Nome do paciente..." class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 outline-none text-sm"><div id="sug-hist" class="sug hidden"></div></div><div id="hist-list" class="mt-6 space-y-3"></div></div>`;
    } else if (window.TAB === 'relatorio') {
        renderRel();
    } else if (window.TAB === 'acompanhamento') {
        renderAcomp();
    }
}

function catHTML(cat, slCl, bgCl, step) {
    const dataF = document.getElementById('datepicker').value.split('-').reverse().join('/');
    const ags = appts.filter(a => a.data === dataF && a.categoria === cat);
    
    // Nome do profissional padrão para a categoria se não houver agendamento
    let proPadrao = "";
    if(cat === "Emagrecimento") proPadrao = "Bruno";
    if(cat === "Aplicação") proPadrao = "Suelen";
    if(cat === "Esportivo") proPadrao = "Geraldo / Libia";

    let html = `<div class="flex justify-between items-end mt-8 mb-3"><h3 class="font-black text-[10px] uppercase text-gray-400">${cat}</h3><span class="text-[9px] font-bold text-purple-600 italic">${proPadrao}</span></div>`;
    
    let h = 9, m = 0;
    while (h < 12 || (h === 12 && m === 0)) {
        const hora = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        const ag = ags.find(a => a.hora === hora);
        if (ag) {
            html += `<div class="slot sl-busy ${bgCl}" onclick="openEdit('${ag.hora}','${cat}', '${ag.id}')">
                <div class="slot-btns">
                    <button onclick="event.stopPropagation(); zap('${ag.paciente}','confirmar','${ag.hora}')" class="slot-btn" title="Confirmar"><i class="fas fa-check"></i></button>
                    <button onclick="event.stopPropagation(); zap('${ag.paciente}','lembrar','${ag.hora}')" class="slot-btn" title="Lembrar"><i class="fab fa-whatsapp"></i></button>
                </div>
                <div class="flex justify-between text-[9px] font-bold opacity-80 uppercase"><span>${hora} - ${ag.servico}</span><span>${ag.pro || ''}</span></div>
                <p class="text-lg font-black uppercase pr-16">${ag.paciente}</p>
            </div>`;
        } else {
            html += `<div onclick="openNew('${hora}','${cat}')" class="slot ${slCl} flex justify-between items-center text-gray-400 font-bold"><span>${hora} — LIVRE</span><i class="fas fa-plus"></i></div>`;
        }
        m += step; if (m >= 60) { h += 1; m = 0; }
    }
    return html;
}

function renderRel() {
    const c = document.getElementById('content');
    const dataF = document.getElementById('datepicker').value.split('-').reverse().join('/');
    let html = `<div class="flex justify-between items-center mb-6"><h2 class="font-black text-xl text-purple-900 uppercase">Relatório do Dia</h2><button onclick="window.print()" class="btn-print bg-black text-white px-4 py-2 rounded-xl text-[10px] font-bold uppercase"><i class="fas fa-print mr-2"></i>PDF / Imprimir</button></div>`;
    ['Esportivo', 'Emagrecimento', 'Aplicação'].forEach(ct => {
        const ags = appts.filter(a => a.data === dataF && a.categoria === ct).sort((a,b)=>a.hora.localeCompare(b.hora));
        html += `<div class="mb-6 overflow-x-auto shadow-sm rounded-xl"><table class="rtable"><thead class="bg-gray-100"><tr><th colspan="5" class="py-2 text-center uppercase font-black">${ct}</th></tr><tr class="text-[8px]"><th>HORA</th><th>PACIENTE</th><th>PROFISSIONAL</th><th>TEL</th><th>ÚLT.</th></tr></thead><tbody class="bg-white">`;
        ags.forEach(ag => {
            const p = pacs.find(x => x.norm === ag.norm);
            const ult = appts.filter(a => a.norm === ag.norm && a.data !== dataF).sort((a,b)=>b.data.localeCompare(a.data))[0];
            html += `<tr><td class="font-bold">${ag.hora}</td><td class="font-black uppercase">${ag.paciente}</td><td class="font-bold text-purple-700">${ag.pro || '—'}</td><td>${p?.telefone||'—'}</td><td>${ult?ult.data:'—'}</td></tr>`;
        });
        if(!ags.length) html += `<tr><td colspan="5" class="text-center py-4 text-gray-400 italic">Nenhum agendamento.</td></tr>`;
        html += `</tbody></table></div>`;
    });
    c.innerHTML = html;
}

function renderAcomp() {
    const c = document.getElementById('content');
    const hoje = new Date();
    const limite = new Date(hoje.getTime() - 25 * 24 * 60 * 60 * 1000);
    const ultimas = {};
    appts.forEach(a => {
        const d = a.data.split('/');
        const dObj = new Date(d[2], d[1]-1, d[0]);
        if(!ultimas[a.norm] || dObj > ultimas[a.norm].dObj) ultimas[a.norm] = {...a, dObj};
    });
    const lista = Object.values(ultimas).filter(a => a.dObj < limite).sort((a,b)=>a.dObj - b.dObj);
    c.innerHTML = `<h2 class="font-black text-xl mb-4 text-purple-900 uppercase">Acompanhamento (+25 dias)</h2><div class="space-y-3">` + 
        lista.map(a => `<div class="p-4 border-2 border-orange-200 rounded-2xl bg-orange-50 flex justify-between items-center"><div><p class="font-black text-sm uppercase">${a.paciente}</p><p class="text-xs text-gray-500">Última em: ${a.data}</p></div><button onclick="zap('${a.paciente}','lembrar','')" class="bg-green-500 text-white p-3 rounded-xl text-xs"><i class="fab fa-whatsapp"></i></button></div>`).join('') + `</div>`;
}

function sugerir(v, sid) {
    const el = document.getElementById(sid);
    if (!v) { el.classList.add('hidden'); return; }
    const matches = pacs.filter(p => p.nome.toLowerCase().includes(v.toLowerCase())).slice(0, 8);
    el.innerHTML = matches.map(p => `<div onclick="selPac('${p.nome}','${sid}')">${p.nome}</div>`).join('');
    el.classList.remove('hidden');
}

function selPac(n, sid) {
    document.getElementById(sid).classList.add('hidden');
    if (sid === 'sug-modal') document.getElementById('m-pac').value = n;
    if (sid === 'sug-hist') { document.getElementById('inp-hist').value = n; showHist(n); }
}

function showHist(n) {
    const norm = normalizar(n);
    const p = pacs.find(x => x.norm === norm);
    const ags = appts.filter(a => a.norm === norm).sort((a,b)=>b.data.localeCompare(a.data));
    const el = document.getElementById('hist-list');
    el.innerHTML = `<div class="bg-purple-50 p-4 rounded-2xl text-xs font-bold mb-4 border-2 border-purple-100"><p class="text-purple-900 uppercase mb-2">Dados do Paciente</p><p>NASC: ${formatarData(p?.nascimento)||'—'}</p><p>TEL: ${p?.telefone||'—'}</p></div>` + 
        ags.map(a => `<div class="p-3 border rounded-xl bg-white shadow-sm mb-2"><p class="font-black text-sm">${a.data} - ${a.hora}</p><p class="text-xs text-gray-500 uppercase">${a.servico} (${a.pro || 'Sem médico'})</p></div>`).join('');
}

function zap(nome, tipo, hora) {
    const p = pacs.find(x => x.norm === normalizar(nome));
    if(!p?.telefone) { alert('Telefone não encontrado!'); return; }
    const tel = p.telefone.replace(/\D/g,'');
    const msg = tipo === 'confirmar' ? `Olá ${nome}, confirmamos seu horário às ${hora}?` : `Olá ${nome}, passando para lembrar da sua consulta hoje às ${hora}.`;
    window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`);
}

function openNew(h, c) { 
    mTime = h; mCat = c; mId = null; 
    document.getElementById('modal-title').textContent = `Agendar — ${h}`; 
    document.getElementById('m-pac').value = ''; 
    document.getElementById('m-pro').value = (c === 'Emagrecimento' ? 'Bruno' : (c === 'Aplicação' ? 'Suelen' : 'Geraldo'));
    document.getElementById('edit-fields').classList.add('hidden'); 
    document.getElementById('btn-del-modal').classList.add('hidden'); 
    document.getElementById('modal').classList.remove('hidden'); 
}

function openEdit(h, c, id) { 
    const ag = appts.find(a => a.id == id); 
    mTime = h; mCat = c; mId = id; 
    document.getElementById('modal-title').textContent = `Editar Horário`; 
    document.getElementById('m-pac').value = ag.paciente; 
    document.getElementById('m-servico').value = ag.servico; 
    document.getElementById('m-pro').value = ag.pro || '';
    document.getElementById('edit-fields').classList.remove('hidden'); 
    document.getElementById('btn-del-modal').classList.remove('hidden'); 
    document.getElementById('modal').classList.remove('hidden'); 
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function closeBg(e) { if(e.target.id==='modal') closeModal(); }

async function saveAppt() {
    const pac = document.getElementById('m-pac').value.trim(); if(!pac) return;
    const serv = document.getElementById('m-servico').value;
    const pro = document.getElementById('m-pro').value;
    const dataBR = document.getElementById('datepicker').value.split('-').reverse().join('/');
    closeModal(); showSpinner();
    // Importante: a URL da API deve aceitar o parâmetro "profissional"
    await fetch(`${API}?action=saveAppt&data=${dataBR}&hora=${mTime}&paciente=${pac}&servico=${serv}&categoria=${mCat}&id=${mId||''}&profissional=${pro}`);
    loadAll();
}

async function delAppt(id) { if(!confirm('Deseja excluir este agendamento?')) return; if(id) mId = id; closeModal(); showSpinner(); await fetch(`${API}?action=delAppt&id=${mId}`); loadAll(); }
</script>
</body>
</html>
