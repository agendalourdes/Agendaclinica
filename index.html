<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGP LOURDES - PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; padding-bottom: 100px; }
        .ios-card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn-loading { pointer-events: none; opacity: 0.7; position: relative; }
        .btn-loading::after { content: "..."; animation: ellipsis 1s infinite; }
        @keyframes ellipsis { 0% { content: "."; } 33% { content: ".."; } 66% { content: "..."; } }
        .suggestions-box { position: absolute; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 12px; max-height: 150px; overflow-y: auto; z-index: 100; }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<header class="no-print p-6 bg-white border-b flex justify-between items-center sticky top-0 z-40">
    <h1 class="text-lg font-black uppercase italic">LOURDES <span class="text-orange-600">SGP</span></h1>
    <input type="date" id="datepicker" onchange="loadAll()" class="p-2 border rounded-xl font-bold text-xs outline-none">
</header>

<main id="content" class="p-4 max-w-[1200px] mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 shadow-2xl">
    <button onclick="showTab('agenda')" id="t-agenda" class="flex flex-col items-center text-slate-400"><i class="fas fa-calendar-alt"></i><span class="text-[9px] font-black mt-1 uppercase">Agenda</span></button>
    <button onclick="showTab('relatorio')" id="t-relatorio" class="flex flex-col items-center text-slate-400"><i class="fas fa-file-medical"></i><span class="text-[9px] font-black mt-1 uppercase">Relatório</span></button>
    <button onclick="showTab('historico')" id="t-historico" class="flex flex-col items-center text-slate-400"><i class="fas fa-users"></i><span class="text-[9px] font-black mt-1 uppercase">Pacientes</span></button>
</nav>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white w-full max-w-lg rounded-[32px] p-8 shadow-2xl overflow-y-auto max-h-[90vh]" onclick="event.stopPropagation()">
        <div id="m-content"></div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyQ0Is21i54hYt5M0rpknsSBRZDRELKsHJIRwhvsfA9-J5D1AyjZiRvDIcg4kSZ2iM/exec"; 
    let pacs = [], appts = [], currentTab = 'agenda';

    async function loadAll() {
        const c = document.getElementById('content');
        c.innerHTML = '<div class="text-center mt-20 font-black text-slate-300 animate-pulse text-xs">SINCRONIZANDO...</div>';
        try {
            const r = await fetch(API + '?action=getAll');
            const d = await r.json();
            pacs = d.patients || [];
            appts = d.appointments || [];
            render();
        } catch(e) { c.innerHTML = '<div class="text-center p-10 font-bold text-red-500 uppercase">ERRO DE CONEXÃO</div>'; }
    }

    function render() {
        const c = document.getElementById('content');
        const dVal = document.getElementById('datepicker').value;
        document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-orange-600', 'text-slate-400'));
        document.getElementById('t-'+currentTab).classList.replace('text-slate-400', 'text-orange-600');
        if(currentTab === 'agenda') renderAgenda(c, dVal);
        else if(currentTab === 'relatorio') renderRelatorio(c, dVal);
        else renderHistorico(c);
    }

    function renderAgenda(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        let html = `<div class="mb-6 text-center"><button onclick="openAgendar('ENCAIXE','')" class="bg-orange-600 text-white px-10 py-3 rounded-2xl text-[10px] font-black uppercase">+ Encaixe</button></div>`;
        const cats = ['ESPORTIVO', 'EMAGRECIMENTO', 'APLICAÇÃO'];
        cats.forEach(cat => {
            html += `<h3 class="font-black text-[10px] text-slate-400 mb-4 mt-8 uppercase tracking-widest border-l-4 border-slate-200 pl-2">${cat}</h3>`;
            const list = appts.filter(a => a.dataStr === dataF && a.categoria === cat);
            list.forEach(ag => {
                html += `<div class="ios-card p-5 mb-4 border-l-8 border-orange-100 flex justify-between items-center" onclick="openAcoes('${ag.id}')">
                    <div><p class="text-[9px] font-bold text-slate-400 uppercase">${ag.hora} — ${ag.servico}</p>
                    <p class="font-black text-slate-800 uppercase text-base">${ag.paciente}</p></div>
                    <i class="fab fa-whatsapp text-green-500 text-2xl"></i>
                </div>`;
            });
        });
        c.innerHTML = html;
    }

    function openAcoes(id) {
        const ag = appts.find(a => a.id == id);
        document.getElementById('m-content').innerHTML = `
            <div class="text-center mb-8"><h2 class="font-black text-2xl uppercase italic">${ag.paciente}</h2></div>
            <div class="flex flex-col gap-3">
                <button onclick="enviarZap('${id}')" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black uppercase text-[11px]">WhatsApp</button>
                <button id="btnDelAg" onclick="deletarAgendamento('${id}', '${ag.paciente}', '${ag.dataStr}')" class="w-full bg-red-50 text-red-500 p-5 rounded-2xl font-black uppercase text-[11px]">Excluir Agendamento</button>
                <button onclick="closeModal()" class="text-slate-300 font-black text-[9px] uppercase mt-6">Voltar</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
    }

    async function deletarAgendamento(id, paciente, data) {
        if(!confirm("CANCERLAR AGENDAMENTO?")) return;
        const btn = document.getElementById('btnDelAg');
        btn.classList.add('btn-loading');
        btn.innerText = "EXCLUINDO";
        
        await fetch(API, { method: 'POST', body: JSON.stringify({action: 'deleteAppointment', id: id, paciente: paciente, data: data}) });
        closeModal(); loadAll();
    }

    function renderHistorico(c) {
        c.innerHTML = `<div class="p-2"><input type="text" id="histSearch" oninput="searchHist()" placeholder="BUSCAR PACIENTE..." class="w-full p-5 rounded-2xl border-2 border-slate-100 font-black uppercase outline-none focus:border-orange-500 text-center"><div id="histResults" class="mt-8"></div></div>`;
    }

    function searchHist() {
        const term = document.getElementById('histSearch').value.toUpperCase().trim();
        const results = document.getElementById('histResults');
        if(term.length < 3) return results.innerHTML = "";
        const pac = pacs.find(p => p.nome.includes(term));
        if(!pac) return results.innerHTML = "<p class='text-center text-slate-300 font-black text-[10px]'>NÃO ENCONTRADO</p>";
        results.innerHTML = `
            <div class="ios-card p-6 border-l-8 border-orange-500">
                <h3 class="font-black text-lg uppercase mb-4 italic">${pac.nome}</h3>
                <button id="btnDelPac" onclick="deletarPaciente('${pac.nome}')" class="w-full bg-red-50 text-red-500 p-4 rounded-xl font-black uppercase text-[10px]">Excluir Cadastro</button>
            </div>`;
    }

    async function deletarPaciente(nome) {
        if(!confirm("EXCLUIR CADASTRO COMPLETO?")) return;
        const btn = document.getElementById('btnDelPac');
        btn.classList.add('btn-loading');
        btn.innerText = "EXCLUINDO";
        
        await fetch(API, { method: 'POST', body: JSON.stringify({action: 'deletePatient', nome: nome}) });
        document.getElementById('histSearch').value = ""; loadAll();
    }

    function openAgendar(cat, hora) {
        document.getElementById('m-content').innerHTML = `
            <h2 class="font-black text-xl mb-6 uppercase text-center italic">${cat}</h2>
            <div class="space-y-4 relative">
                <input type="text" id="newPac" placeholder="NOME DO PACIENTE" autocomplete="off" class="w-full p-4 bg-slate-50 rounded-xl font-black uppercase outline-none border-2 border-transparent focus:border-orange-500">
                <div id="suggestions" class="suggestions-box hidden"></div>
                <button id="btnSalvar" onclick="salvarNovo('${cat}', '${hora}')" class="w-full bg-slate-900 text-white p-5 rounded-[22px] font-black uppercase">Salvar Agendamento</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
        
        const input = document.getElementById('newPac');
        const suggBox = document.getElementById('suggestions');
        input.addEventListener('input', () => {
            const val = input.value.toUpperCase().trim();
            suggBox.innerHTML = '';
            if(val.length < 2) { suggBox.classList.add('hidden'); return; }
            const filtered = pacs.filter(p => p.nome.includes(val)).slice(0, 5);
            if(filtered.length > 0) {
                suggBox.classList.remove('hidden');
                filtered.forEach(p => {
                    const div = document.createElement('div'); div.className = 'suggestion-item'; div.innerText = p.nome;
                    div.onclick = () => { input.value = p.nome; suggBox.classList.add('hidden'); };
                    suggBox.appendChild(div);
                });
            } else { suggBox.classList.add('hidden'); }
        });
    }

    async function salvarNovo(cat, hora) {
        const btn = document.getElementById('btnSalvar');
        btn.classList.add('btn-loading');
        btn.innerText = "SALVANDO";
        
        const data = document.getElementById('datepicker').value.split('-').reverse().join('/');
        const obj = { action: 'addAppointment', paciente: document.getElementById('newPac').value.toUpperCase(), servico: cat, data: data, hora: hora || 'ENCAIXE', categoria: cat, obs: "" };
        await fetch(API, { method: 'POST', body: JSON.stringify(obj) });
        closeModal(); loadAll();
    }

    function showTab(t){ currentTab = t; render(); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
    window.onload = () => { document.getElementById('datepicker').value = new Date().toISOString().split('T')[0]; loadAll(); };
</script>
</body>
</html>
