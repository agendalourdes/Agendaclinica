<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Dr. Jorge Salomão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main-purple: #4a148c; 
            --text-dark: #1a1a1a; /* Texto bem escuro para contraste */
            --whatsapp: #25d366;
            --cat-esportivo: #f97316; 
            --cat-emagrecimento: #3b82f6; 
            --cat-aplicacao: #a855f7; 
        }
        
        body { background: #ffffff; font-family: 'Quicksand', sans-serif; color: var(--text-dark); }
        
        /* Layout Geral */
        .luxury-card { background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; }
        .tab-btn { transition: all 0.3s ease; border-radius: 16px; color: #666; }
        .tab-active { background: #f8f5ff; color: var(--main-purple) !important; font-weight: 700; }
        
        /* LOGICA DOS CARDS SOLICITADA */
        .slot-card { transition: all 0.2s ease; border-radius: 20px; border: 2px solid transparent; }
        
        /* Estados Livres (Bordas Coloridas) */
        .free-esportivo { border-color: rgba(249, 115, 22, 0.2); border-left: 6px solid var(--cat-esportivo); background: #fffaf7; }
        .free-emagrecimento { border-color: rgba(59, 130, 246, 0.2); border-left: 6px solid var(--cat-emagrecimento); background: #f7faff; }
        .free-aplicacao { border-color: rgba(168, 85, 247, 0.2); border-left: 6px solid var(--cat-aplicacao); background: #fbf7ff; }

        /* Estados Ocupados (Totalmente Coloridos) */
        .busy-esportivo { background: var(--cat-esportivo) !important; color: white !important; border: none; }
        .busy-emagrecimento { background: var(--cat-emagrecimento) !important; color: white !important; border: none; }
        .busy-aplicacao { background: var(--cat-aplicacao) !important; color: white !important; border: none; }

        .busy-card span, .busy-card p { color: white !important; }
        .busy-card .status-badge { background: rgba(255,255,255,0.2) !important; color: white !important; border: none; }

        .btn-whatsapp { background: var(--whatsapp); color: white; border-radius: 12px; padding: 10px; transition: all 0.2s; }
        
        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; }
        }
    </style>
</head>
<body class="pb-32">

    <header class="p-6 pt-10 pb-16 no-print text-center">
        <div class="max-w-xl mx-auto flex flex-col items-center gap-6">
            <h1 class="text-2xl font-black tracking-tight text-slate-900 uppercase">Clínica <span class="text-purple-900">Lourdes</span></h1>
            
            <div class="flex flex-col items-center gap-2">
                <p class="text-[12px] font-extrabold text-slate-800 uppercase tracking-widest">Portal de Agendamento Profissional</p>
                <div class="bg-slate-50 p-2 px-5 rounded-full inline-flex items-center gap-3 border-2 border-slate-200 shadow-sm">
                    <i class="far fa-calendar-alt text-slate-900 font-bold"></i>
                    <input type="date" id="data-seletor" onchange="render()" class="bg-transparent font-black text-sm outline-none border-none text-slate-900 cursor-pointer">
                </div>
            </div>
        </div>
    </header>

    <nav class="fixed bottom-6 left-4 right-4 h-20 luxury-card z-[100] flex items-center justify-around p-2 no-print shadow-2xl">
        <button onclick="showTab('agenda')" id="tab-agenda" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1.5">
            <i class="fas fa-calendar-check text-lg"></i><span class="text-[10px] font-bold">Agenda</span>
        </button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1.5">
            <i class="fas fa-user-plus text-lg"></i><span class="text-[10px] font-bold">Cadastrar</span>
        </button>
        <button onclick="showTab('busca')" id="tab-busca" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1.5">
            <i class="fas fa-search text-lg"></i><span class="text-[10px] font-bold">Pesquisar</span>
        </button>
        <button onclick="showTab('relatorio')" id="tab-relatorio" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1.5">
            <i class="fas fa-print text-lg"></i><span class="text-[10px] font-bold">Relatório</span>
        </button>
    </nav>

    <main id="content" class="p-4 -mt-8 max-w-xl mx-auto relative z-10"></main>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end sm:items-center justify-center no-print">
        <div class="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] p-8 shadow-2xl">
            <h2 class="font-bold text-2xl mb-1 text-slate-900">Novo Horário</h2>
            <p id="info-horario" class="text-slate-500 font-bold mb-6 text-sm"></p>
            
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Serviço</label>
            <select id="tipo-servico" class="w-full p-4 bg-slate-50 border rounded-2xl mb-4 font-bold text-slate-800 outline-none">
                <option value="CONSULTA">CONSULTA</option>
                <option value="RETORNO">RETORNO</option>
                <option value="APLICAÇÃO">APLICAÇÃO</option>
                <option value="CONSULTA (C)">CONSULTA CLINICAL</option>
                <option value="RETORNO (C)">RETORNO CLINICAL</option>
                <option value="APLICAÇÃO (C)">APLICAÇÃO CLINICAL</option>
            </select>

            <input type="text" id="busca-paciente-modal" oninput="filtrarModal(this.value)" placeholder="🔍 Nome do paciente..." class="w-full p-4 bg-slate-50 border rounded-2xl mb-2 font-bold outline-none">
            <div id="lista-pacientes-modal" class="max-h-40 overflow-y-auto rounded-xl mb-8 bg-slate-50 border"></div>
            
            <div class="flex gap-3">
                <button onclick="fecharModal()" class="flex-1 p-4 bg-slate-100 rounded-2xl font-bold text-slate-400">Sair</button>
                <button id="btn-confirmar" class="flex-2 px-8 bg-slate-900 text-white rounded-2xl font-bold opacity-30 shadow-lg" disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // ======= COLE O SEU LINK DA PLANILHA ABAIXO =======
        const API_URL = "https://script.google.com/macros/s/AKfycbwGmxjKsqV5RswuNPp5T2B079kpOVUB8h3PnrgeRWVWRX25wVKX9Fdmm9oRdILFU4xZ/exec";
        
        let pacientes = [], agendamentos = [], selectedTime, selectedCat, selectedPac;

        window.onload = () => {
            const hoje = new Date();
            document.getElementById('data-seletor').value = hoje.toLocaleDateString('en-CA');
            showTab('agenda'); loadData();
        };

        async function loadData() {
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || []; 
                agendamentos = d.appointments || [];
                render();
            } catch(e) { console.log("Erro de conexão"); }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            window.currentTab = tab; render();
        }

        function cleanDate(d) {
            if(!d) return '--';
            if(d.includes('T')) return d.split('T')[0].split('-').reverse().join('/');
            return d;
        }

        function openWhatsApp(phone) {
            const cleanPhone = phone.replace(/\D/g, '');
            window.open(`https://wa.me/55${cleanPhone}`, '_blank');
        }

        function render() {
            const container = document.getElementById('content');
            const dataSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const dataObj = new Date(document.getElementById('data-seletor').value + "T12:00:00");
            const diaSemana = dataObj.getDay();

            if (window.currentTab === 'agenda') {
                if (diaSemana !== 2 && diaSemana !== 4) {
                    container.innerHTML = `<div class="p-12 text-center luxury-card mt-10"><p class="text-slate-900 font-black">CONSULTÓRIO FECHADO</p><p class="text-slate-400 text-xs">Selecione Terça ou Quinta.</p></div>`;
                    return;
                }
                container.innerHTML = `
                    <div class="space-y-10">
                        ${renderSection('Esportivo', 'free-esportivo', 'busy-esportivo', 25, dataSel)}
                        ${renderSection('Emagrecimento', 'free-emagrecimento', 'busy-emagrecimento', 35, dataSel)}
                        ${renderSection('Aplicação', 'free-aplicacao', 'busy-aplicacao', 30, dataSel)}
                    </div>`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `<div class="luxury-card p-8"><h2 class="font-black text-xl mb-6">Cadastro de Paciente</h2><div class="space-y-4"><input type="text" id="n" placeholder="Nome Completo" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold"><input type="tel" id="t" placeholder="WhatsApp (com DDD)" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold"><input type="text" id="d" placeholder="Nascimento" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold"><button onclick="salvarPaciente()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black shadow-lg">SALVAR NO BANCO</button></div></div>`;
            } else if (window.currentTab === 'busca') {
                container.innerHTML = `<div class="luxury-card p-8"><h2 class="font-black text-xl mb-6 text-slate-800">Localizar Ficha</h2><input type="text" oninput="buscarFicha(this.value)" placeholder="🔍 Digite o nome..." class="w-full p-4 bg-slate-50 border rounded-2xl outline-none font-bold mb-6"><div id="res-busca"></div></div>`;
            } else if (window.currentTab === 'relatorio') { renderRelatorio(dataSel); }
        }

        function renderSection(cat, freeClass, busyClass, step, dataF) {
            let html = `<section><div class="flex items-center gap-3 mb-4"><h3 class="font-black text-[12px] uppercase tracking-[3px] text-slate-900">${cat}</h3><div class="h-[1px] bg-slate-100 flex-1"></div></div>`;
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < 12) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const ocupado = agendamentos.find(a => cleanDate(a.data) === dataF && a.categoria.trim() === cat.trim() && a.hora.includes(h));
                
                const cardClass = ocupado ? `busy-card ${busyClass}` : freeClass;

                html += `
                    <div class="p-5 mb-3 flex justify-between items-center slot-card ${cardClass}">
                        <div>
                            <span class="text-[10px] font-black uppercase opacity-60">${h}</span>
                            <span class="block font-black text-lg">${ocupado ? ocupado.paciente : 'Livre'}</span>
                            ${ocupado ? `<span class="status-badge mt-1 inline-block">${ocupado.servico}</span>` : ''}
                        </div>
                        ${ocupado ? `<button onclick="openWhatsApp('${pacientes.find(p=>p.name===ocupado.paciente)?.phone || ''}')" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white"><i class="fab fa-whatsapp text-lg"></i></button>` : `<button onclick="abrirAgenda('${h}', '${cat}')" class="text-slate-900 font-black text-[11px] uppercase border-2 border-slate-200 px-4 py-2 rounded-xl hover:bg-slate-100">Agendar</button>`}
                    </div>`;
                t.setMinutes(t.getMinutes() + step);
            }
            return html + `</section>`;
        }

        function renderRelatorio(dataF) {
            const dataObj = new Date(document.getElementById('data-seletor').value + "T12:00:00");
            const diaSemana = dataObj.getDay();
            const medicoEsportivo = (diaSemana === 2) ? "Dra. Líbia" : "Dr. Geraldo";
            const filtrar = (cat) => agendamentos.filter(a => cleanDate(a.data) === dataF && a.categoria.trim() === cat.trim());

            const gerarTabela = (titulo, dados, corHex) => `
                <div class="mb-8 luxury-card overflow-hidden">
                    <div class="p-4 text-white font-black text-xs uppercase" style="background:${corHex}">${titulo}</div>
                    <table class="w-full text-[11px]">
                        <thead><tr class="text-slate-400 bg-slate-50 border-b">
                            <th class="p-3">H</th><th class="p-3">Paciente</th><th class="p-3">Tel</th><th class="p-3">S</th>
                        </tr></thead>
                        <tbody>
                            ${dados.map(a => {
                                const p = pacientes.find(pac => pac.name === a.paciente) || {};
                                return `<tr class="border-b font-bold text-slate-700">
                                    <td class="p-3">${a.hora.includes('T') ? a.hora.split('T')[1].substring(0,5) : a.hora}</td>
                                    <td class="p-3 uppercase">${a.paciente}</td>
                                    <td class="p-3">${p.phone || ''}</td>
                                    <td class="p-3">${a.servico}</td>
                                </tr>`;
                            }).join('') || '<tr><td colspan="4" class="p-6 text-center text-slate-300">Vazio</td></tr>'}
                        </tbody>
                    </table>
                </div>`;

            document.getElementById('content').innerHTML = `
                <button onclick="window.print()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black mb-10 no-print shadow-xl">IMPRIMIR PDF</button>
                <div class="print-area">
                    <div class="text-center mb-10">
                        <h2 class="text-3xl font-black text-slate-900 uppercase">Mapa do Dia</h2>
                        <p class="font-black text-slate-400 tracking-[5px]">${dataF}</p>
                    </div>
                    ${gerarTabela(`Esportivo: ${medicoEsportivo}`, filtrar('Esportivo'), 'var(--cat-esportivo)')}
                    ${gerarTabela('Emagrecimento: Dr. Bruno', filtrar('Emagrecimento'), 'var(--cat-emagrecimento)')}
                    ${gerarTabela('Setor de Aplicações', filtrar('Aplicação'), 'var(--cat-aplicacao)')}
                </div>`;
        }

        function buscarFicha(nome) {
            const res = document.getElementById('res-busca'); if(nome.length < 2) { res.innerHTML = ""; return; }
            const p = pacientes.find(p => p.name.toLowerCase().includes(nome.toLowerCase())); if(!p) return;
            const hist = agendamentos.filter(a => a.paciente.trim() === p.name.trim());
            res.innerHTML = `
                <div class="bg-slate-900 p-6 rounded-3xl text-white mb-6 flex justify-between items-center">
                    <div>
                        <h4 class="text-xl font-black uppercase">${p.name}</h4>
                        <p class="text-xs opacity-60">Nasc: ${cleanDate(p.nasc)} | Tel: ${p.phone}</p>
                    </div>
                    <button onclick="openWhatsApp('${p.phone}')" class="w-12 h-12 rounded-full bg-green-500 flex items-center justify-center"><i class="fab fa-whatsapp text-xl"></i></button>
                </div>
                <div class="space-y-2">
                    <p class="text-[10px] font-black text-slate-400 uppercase px-2">Histórico Clínico</p>
                    ${hist.map(h => `<div class="bg-white p-3 rounded-xl border font-bold text-xs"><b>${cleanDate(h.data)}</b> - ${h.servico}</div>`).join('') || '<p class="text-center text-slate-300 py-6 font-bold">Sem registros.</p>'}
                </div>`;
        }

        function abrirAgenda(h, c) { selectedTime = h; selectedCat = c; document.getElementById('info-horario').innerText = `${c} • às ${h}`; document.getElementById('modal-agenda').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }
        function filtrarModal(v) {
            const l = document.getElementById('lista-pacientes-modal');
            const f = pacientes.filter(p => p.name.toLowerCase().includes(v.toLowerCase()));
            l.innerHTML = f.map(p => `<div onclick="selecionarParaAgenda('${p.name}')" class="p-4 border-b hover:bg-slate-50 font-bold text-sm cursor-pointer">${p.name}</div>`).join('');
        }
        function selecionarParaAgenda(n) { selectedPac = n; document.getElementById('busca-paciente-modal').value = n; const b = document.getElementById('btn-confirmar'); b.disabled = false; b.classList.replace('opacity-30', 'opacity-100'); b.onclick = confirmarAgendamento; }
        async function confirmarAgendamento() {
            const dSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const srv = document.getElementById('tipo-servico').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data: dSel, hora: selectedTime, paciente: selectedPac, categoria: selectedCat, servico: srv }) });
            fecharModal(); loadData();
        }
        async function salvarPaciente() {
            const n = document.getElementById('n').value, t = document.getElementById('t').value, d = document.getElementById('d').value;
            if(!n || !t) return alert("Nome e WhatsApp são obrigatórios!");
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name: n, phone: t, nascimento: d }) });
            alert("✅ Cadastro Realizado!"); loadData();
        }
    </script>
</body>
</html>
