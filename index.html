<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Dr. Jorge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cat-esportivo: #f97316; --cat-emagrecimento: #3b82f6; --cat-aplicacao: #a855f7; }
        body { background: #fafafa; font-family: 'Quicksand', sans-serif; color: #000000; margin: 0; padding: 0; }
        
        .full-header { width: 100%; background: #fff; border-bottom: 1px solid #eee; }
        .full-header img { width: 100%; max-width: 450px; display: block; margin: 0 auto; }

        .slot-card { transition: all 0.2s ease; border-radius: 20px; border: 1px solid #f0f0f0; cursor: pointer; margin-bottom: 12px; background: #fff; }
        .free-esportivo { border-left: 10px solid var(--cat-esportivo) !important; background: #fffaf7; }
        .free-emagrecimento { border-left: 10px solid var(--cat-emagrecimento) !important; background: #f7faff; }
        .free-aplicacao { border-left: 10px solid var(--cat-aplicacao) !important; background: #fbf7ff; }

        .busy-card { color: white !important; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .busy-esportivo { background: var(--cat-esportivo) !important; }
        .busy-emagrecimento { background: var(--cat-emagrecimento) !important; }
        .busy-aplicacao { background: var(--cat-aplicacao) !important; }
        .busy-card p, .busy-card span { color: white !important; font-weight: 700; }

        .font-black-strong { color: #000000 !important; font-weight: 700; }
        .tab-active { color: #4a148c !important; font-weight: 800; border-bottom: 3px solid #4a148c; }
        
        #sugestoes { position: absolute; width: 100%; z-index: 50; background: white; border: 1px solid #ddd; border-radius: 12px; }

        @media print { .no-print { display: none !important; } .print-area { display: block !important; } }
    </style>
</head>
<body class="pb-32">

    <header class="full-header no-print">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <div class="max-w-xl mx-auto py-3 px-4 text-center">
            <div class="bg-white p-2 rounded-2xl inline-flex items-center gap-3 border border-gray-200 shadow-sm">
                <i class="far fa-calendar-alt text-gray-400"></i>
                <input type="date" id="data-seletor" onchange="verificarDia(this.value)" class="bg-transparent outline-none font-black-strong">
            </div>
        </div>
    </header>

    <main id="content" class="p-4 max-w-xl mx-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around no-print z-50 shadow-lg">
        <button onclick="showTab('agenda')" id="tab-agenda" class="flex-1 py-3 flex flex-col items-center gap-1"><i class="fas fa-calendar-day"></i><span class="text-[10px] font-bold">AGENDA</span></button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="flex-1 py-3 flex flex-col items-center gap-1"><i class="fas fa-user-plus"></i><span class="text-[10px] font-bold">CADASTRO</span></button>
        <button onclick="showTab('busca')" id="tab-busca" class="flex-1 py-3 flex flex-col items-center gap-1"><i class="fas fa-search"></i><span class="text-[10px] font-bold">FICHAS</span></button>
        <button onclick="showTab('relatorio')" id="tab-relatorio" class="flex-1 py-3 flex flex-col items-center gap-1"><i class="fas fa-file-invoice"></i><span class="text-[10px] font-bold">RELATÓRIO</span></button>
    </nav>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] p-8 shadow-2xl relative">
            <h2 class="font-black-strong text-2xl mb-1 uppercase" id="m-titulo">Agendar</h2>
            <p id="m-horario" class="text-blue-600 font-bold mb-6 text-sm"></p>
            
            <label class="text-[10px] font-bold text-gray-400 uppercase">Serviço</label>
            <select id="tipo-servico" class="w-full p-4 border rounded-2xl mb-4 font-black-strong outline-none">
                <option value="Consulta Clinical">Consulta Clinical</option>
                <option value="Retorno Clinical">Retorno Clinical</option>
                <option value="Aplicação Clinical">Aplicação Clinical</option>
            </select>

            <label class="text-[10px] font-bold text-gray-400 uppercase">Paciente</label>
            <div class="relative">
                <input type="text" id="busca-pac" oninput="autoSugerir(this.value)" placeholder="Digite o nome..." class="w-full p-4 border rounded-2xl mb-2 font-black-strong outline-none">
                <div id="sugestoes" class="hidden overflow-y-auto max-h-40 shadow-xl"></div>
            </div>
            
            <div class="flex flex-col gap-3 mt-6">
                <button onclick="salvar()" class="w-full bg-black text-white p-5 rounded-2xl font-black-strong text-lg">SALVAR HORÁRIO</button>
                <button onclick="fecharModal()" class="w-full p-4 font-bold text-gray-400 uppercase">Voltar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwGmxjKsqV5RswuNPp5T2B079kpOVUB8h3PnrgeRWVWRX25wVKX9Fdmm9oRdILFU4xZ/exec"; 
        let pacientes = [], agendamentos = [], sTime, sCat, editId = null;

        window.onload = () => {
            const hoje = new Date();
            document.getElementById('data-seletor').value = hoje.toLocaleDateString('en-CA');
            showTab('agenda'); loadData();
        };

        function verificarDia(data) {
            const d = new Date(data + "T12:00:00").getDay();
            if(d !== 2 && d !== 4) { alert("Atendimento apenas Terças e Quintas!"); return; }
            loadData();
        }

        async function loadData() {
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || [];
                agendamentos = d.appointments || [];
                render();
            } catch(e) { console.error("Erro ao carregar"); }
        }

        function showTab(tab) {
            window.currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const dataF = document.getElementById('data-seletor').value.split('-').reverse().join('/');

            if (window.currentTab === 'agenda') {
                container.innerHTML = `
                    ${renderCategoria('Esportivo', 'free-esportivo', 'busy-esportivo', 25, dataF)}
                    ${renderCategoria('Emagrecimento', 'free-emagrecimento', 'busy-emagrecimento', 35, dataF)}
                    ${renderCategoria('Aplicação', 'free-aplicacao', 'busy-aplicacao', 30, dataF)}`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `<div class="p-8 bg-white rounded-[32px] border">
                    <h2 class="font-black-strong text-2xl mb-8 uppercase">Novo Paciente</h2>
                    <div class="space-y-4">
                        <input id="c-nome" placeholder="Nome Completo" class="w-full p-4 border rounded-2xl font-black-strong">
                        <input id="c-tel" placeholder="WhatsApp (com DDD)" class="w-full p-4 border rounded-2xl font-black-strong">
                        <input id="c-email" placeholder="E-mail" class="w-full p-4 border rounded-2xl font-black-strong">
                        <input id="c-alt" placeholder="Altura" class="w-full p-4 border rounded-2xl font-black-strong">
                        <input id="c-nasc" placeholder="Data de Nascimento" class="w-full p-4 border rounded-2xl font-black-strong">
                        <button onclick="cadastrar()" class="w-full bg-black text-white p-5 rounded-2xl font-black-strong text-xl mt-4">CADASTRAR</button>
                    </div>
                </div>`;
            } else if (window.currentTab === 'busca') {
                container.innerHTML = `<input type="text" oninput="pesquisarFicha(this.value)" placeholder="Buscar paciente..." class="w-full p-4 border rounded-2xl font-black-strong mb-6 outline-none"><div id="res-busca"></div>`;
            } else if (window.currentTab === 'relatorio') {
                gerarRelatorio(dataF);
            }
        }

        function renderCategoria(cat, freeCl, busyCl, step, dataF) {
            let html = `<h3 class="font-black-strong text-[11px] uppercase tracking-widest mt-8 mb-4 text-gray-400 px-2">${cat}</h3>`;
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < 13) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const ag = agendamentos.find(a => a.data.includes(dataF) && a.categoria === cat && a.hora === h);
                if(ag) {
                    html += `<div onclick="abrirModal('${h}','${cat}',${JSON.stringify(ag).replace(/"/g, '&quot;')})" class="p-5 slot-card busy-card ${busyCl}">
                                <div class="flex justify-between text-[10px] uppercase"><span>${h}</span><span>${ag.servico}</span></div>
                                <p class="text-xl font-black-strong uppercase mt-1">${ag.paciente}</p>
                             </div>`;
                } else {
                    html += `<div onclick="abrirModal('${h}','${cat}')" class="p-5 slot-card ${freeCl} flex justify-between items-center"><span class="font-black-strong">${h} - LIVRE</span><i class="fas fa-plus opacity-20"></i></div>`;
                }
                t.setMinutes(t.getMinutes() + step);
            }
            return html;
        }

        function pesquisarFicha(v) {
            const res = document.getElementById('res-busca');
            if(v.length < 2) { res.innerHTML = ""; return; }
            const encontrados = pacientes.filter(p => p.nome.toLowerCase().includes(v.toLowerCase()));
            res.innerHTML = encontrados.map(p => `
                <div class="bg-gray-900 text-white p-6 rounded-[28px] mb-4 shadow-xl">
                    <div class="flex justify-between items-start border-b border-white/10 pb-3 mb-4">
                        <h4 class="font-black-strong text-xl uppercase">${p.nome}</h4>
                        <a href="https://wa.me/55${p.telefone.replace(/\D/g,'')}" target="_blank" class="bg-green-500 p-2 rounded-full"><i class="fab fa-whatsapp"></i></a>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-xs font-bold uppercase opacity-80">
                        <p>TEL: ${p.telefone}</p><p>ALTURA: ${p.altura}</p>
                        <p>EMAIL: ${p.email}</p><p>NASC: ${p.nascimento}</p>
                    </div>
                </div>`).join('');
        }

        function gerarRelatorio(dataF) {
            const ags = agendamentos.filter(a => a.data.includes(dataF));
            const tab = (cat, cor) => {
                const lista = ags.filter(a => a.categoria === cat);
                return `
                <div class="mb-8 border-2 rounded-2xl overflow-hidden shadow-sm" style="border-color: ${cor}">
                    <div class="p-3 font-black-strong text-white uppercase text-center" style="background:${cor}">${cat}</div>
                    <div class="bg-white">
                        ${lista.map(a => {
                            const p = pacientes.find(pac => pac.nome === a.paciente) || {};
                            return `<div class="border-b last:border-0 p-4">
                                <div class="flex justify-between font-black-strong text-sm mb-2">
                                    <span>${a.hora} - ${a.paciente}</span>
                                    <a href="https://wa.me/55${p.telefone ? p.telefone.replace(/\D/g,'') : ''}" class="text-green-600"><i class="fab fa-whatsapp text-lg"></i></a>
                                </div>
                                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-[10px] font-bold uppercase text-gray-500">
                                    <span>Nascimento: ${p.nascimento || '--'}</span>
                                    <span>E-mail: ${p.email || '--'}</span>
                                    <span>Altura: ${p.altura || '--'}</span>
                                    <span class="text-black font-black">Procedimento: ${a.servico}</span>
                                </div>
                            </div>`;
                        }).join('') || '<p class="p-4 text-center text-gray-300">Vazio</p>'}
                    </div>
                </div>`;
            }
            document.getElementById('content').innerHTML = `
                <div class="print-area">
                    <h2 class="text-center font-black-strong text-2xl mb-8 uppercase">Relatório do Dia</h2>
                    ${tab('Esportivo', '#f97316')}${tab('Emagrecimento', '#3b82f6')}${tab('Aplicação', '#a855f7')}
                    <button onclick="window.print()" class="no-print w-full bg-black text-white p-5 rounded-2xl font-black-strong mt-6 shadow-lg">IMPRIMIR RELATÓRIO</button>
                </div>`;
        }

        function autoSugerir(v) {
            const s = document.getElementById('sugestoes');
            if(v.length < 2) { s.classList.add('hidden'); return; }
            const f = pacientes.filter(p => p.nome.toLowerCase().includes(v.toLowerCase()));
            s.innerHTML = f.map(p => `<div onclick="setPac('${p.nome}')" class="p-4 border-b font-black-strong text-sm cursor-pointer hover:bg-gray-100">${p.nome}</div>`).join('');
            s.classList.remove('hidden');
        }

        function setPac(n) { document.getElementById('busca-pac').value = n; document.getElementById('sugestoes').classList.add('hidden'); }

        function abrirModal(h, cat, ag = null) {
            sTime = h; sCat = cat; editId = ag ? ag.id : null;
            document.getElementById('m-horario').innerText = `${cat.toUpperCase()} ÀS ${h}`;
            document.getElementById('modal-agenda').classList.remove('hidden');
            document.getElementById('busca-pac').value = ag ? ag.paciente : "";
            document.getElementById('tipo-servico').value = ag ? ag.servico : "Consulta Clinical";
        }

        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }

        async function salvar() {
            const pac = document.getElementById('busca-pac').value;
            const data = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const serv = document.getElementById('tipo-servico').value;
            if(!pac) return alert("Selecione um paciente!");
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data, hora: sTime, paciente: pac, categoria: sCat, servico: serv, id: editId }) });
            fecharModal(); loadData();
        }

        async function cadastrar() {
            const n = document.getElementById('c-nome').value, t = document.getElementById('c-tel').value, e = document.getElementById('c-email').value, a = document.getElementById('c-alt').value, d = document.getElementById('c-nasc').value;
            if(!n || !t) return alert("Nome e WhatsApp são obrigatórios!");
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name: n, phone: t, email: e, altura: a, nascimento: d }) });
            alert("Cadastrado com sucesso!"); loadData(); showTab('agenda');
        }
    </script>
</body>
</html>
