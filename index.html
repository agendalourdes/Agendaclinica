<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clínica Lourdes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; }
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: bold; }
        .card-slot { border-left-width: 6px; transition: 0.2s; }
        .card-esportivo { border-left-color: #f97316; background: #fffcf9; }
        .card-emagrecimento { border-left-color: #3b82f6; background: #f9fbff; }
        .card-aplicacao { border-left-color: #a855f7; background: #fdfaff; }
    </style>
</head>
<body class="pb-24">
    <div class="bg-slate-800 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-lg font-bold italic text-orange-400">Clínica Lourdes</h1>
            <input type="date" id="data-seletor" onchange="render()" class="bg-slate-700 text-xs p-1 rounded mt-1 border-none text-white outline-none">
        </div>
        <button onclick="loadData()" class="p-3 bg-slate-700 rounded-full active:bg-blue-600"><i class="fas fa-sync-alt"></i></button>
    </div>

    <div class="bg-white sticky top-[72px] z-40 flex shadow-sm border-b overflow-x-auto">
        <button onclick="showTab('agenda')" id="tab-agenda" class="p-3 flex-1 tab-active text-[10px] uppercase font-bold">Agenda</button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="p-3 flex-1 text-[10px] uppercase font-bold">Cadastrar</button>
        <button onclick="showTab('busca')" id="tab-busca" class="p-3 flex-1 text-[10px] uppercase font-bold">Ficha</button>
        <button onclick="showTab('relatorio')" id="tab-relatorio" class="p-3 flex-1 text-[10px] uppercase font-bold">Relatório</button>
    </div>

    <div id="content" class="p-4 max-w-xl mx-auto"></div>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <h2 class="font-bold text-xl mb-4">Agendar</h2>
            <p id="info-horario" class="text-blue-600 font-bold mb-4 bg-blue-50 p-2 rounded-lg text-center"></p>
            
            <select id="tipo-servico" class="w-full p-4 border rounded-2xl mb-4 bg-gray-50 font-bold">
                <option value="CONSULTA">CONSULTA</option>
                <option value="RETORNO">RETORNO</option>
                <option value="APLICAÇÃO">APLICAÇÃO</option>
            </select>

            <input type="text" id="busca-paciente-modal" oninput="filtrarModal(this.value)" placeholder="Nome do paciente..." class="w-full p-4 border rounded-2xl mb-2 outline-none focus:border-blue-500">
            <div id="lista-pacientes-modal" class="max-h-32 overflow-y-auto border rounded-xl mb-6"></div>
            
            <div class="flex gap-2">
                <button onclick="fecharModal()" class="flex-1 p-4 bg-gray-100 rounded-2xl font-bold">Sair</button>
                <button id="btn-confirmar" class="flex-1 p-4 bg-blue-600 text-white rounded-2xl font-bold opacity-30" disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzaia9_-saykXi7yFNPw5OrxedEpdMTYLguvnCCR4g73J7dJUQgwPeUZ-7VXMEdQbSZ/exec";
        
        let pacientes = [];
        let agendamentos = [];
        let selectedTime, selectedCat, selectedPac;

        window.onload = () => {
            const hoje = new Date().toLocaleDateString('en-CA');
            document.getElementById('data-seletor').value = hoje;
            showTab('agenda');
            loadData();
        };

        async function loadData() {
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || [];
                agendamentos = d.appointments || [];
                render();
            } catch(e) { console.log("Erro"); }
        }

        function showTab(tab) {
            document.querySelectorAll('.bg-white button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            window.currentTab = tab;
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const dataSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');

            if (window.currentTab === 'agenda') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <section>
                            <h3 class="text-orange-600 font-bold text-[10px] uppercase mb-2">Esportivo</h3>
                            ${gerarSlots(9, 12, 25, 'card-esportivo', 'Esportivo', dataSel)}
                        </section>
                        <section>
                            <h3 class="text-blue-600 font-bold text-[10px] uppercase mb-2">Emagrecimento</h3>
                            ${gerarSlots(9, 12, 35, 'card-emagrecimento', 'Emagrecimento', dataSel)}
                        </section>
                        <section>
                            <h3 class="text-purple-600 font-bold text-[10px] uppercase mb-2">Aplicação</h3>
                            ${gerarSlots(9, 12, 30, 'card-aplicacao', 'Aplicação', dataSel)}
                        </section>
                    </div>`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h2 class="font-bold mb-4">Novo Cadastro</h2>
                        <input type="text" id="n" placeholder="Nome" class="w-full p-4 border rounded-2xl mb-3 bg-slate-50 outline-none">
                        <input type="tel" id="t" placeholder="WhatsApp" class="w-full p-4 border rounded-2xl mb-3 bg-slate-50 outline-none">
                        <input type="text" id="d" placeholder="Nascimento" class="w-full p-4 border rounded-2xl mb-4 bg-slate-50 outline-none">
                        <button onclick="salvarPaciente()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold">Salvar</button>
                    </div>`;
            } else if (window.currentTab === 'busca') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border">
                        <h2 class="font-bold mb-4">Ficha do Paciente</h2>
                        <input type="text" id="in-busca" oninput="buscarFicha(this.value)" placeholder="Nome para pesquisar..." class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
                        <div id="res-busca" class="mt-4"></div>
                    </div>`;
            } else if (window.currentTab === 'relatorio') {
                renderRelatorio(dataSel);
            }
        }

        function gerarSlots(hStart, hEnd, step, css, cat, dataF) {
            let html = '';
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < hEnd) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                // Ajuste de comparação de data para ser mais flexível
                const ocupado = agendamentos.find(a => a.hora == h && String(a.data).includes(dataF) && a.categoria == cat);
                html += `<div class="p-4 mb-2 rounded-2xl shadow-sm flex justify-between items-center border card-slot ${css}">
                            <div>
                                <span class="text-[10px] font-bold text-gray-400">${h}</span>
                                <span class="block font-bold text-slate-800">${ocupado ? ocupado.paciente : 'Livre'}</span>
                                ${ocupado ? `<span class="text-[9px] text-blue-600 font-bold">${ocupado.servico}</span>` : ''}
                            </div>
                            ${ocupado ? '<i class="fas fa-check-circle text-green-500"></i>' : `<button onclick="abrirAgenda('${h}', '${cat}')" class="text-blue-600 font-bold text-xs">+ Agendar</button>`}
                         </div>`;
                t.setMinutes(t.getMinutes() + step);
            }
            return html;
        }

        function buscarFicha(nome) {
            const res = document.getElementById('res-busca');
            if(nome.length < 2) { res.innerHTML = ""; return; }
            const p = pacientes.find(p => p.name.toLowerCase().includes(nome.toLowerCase()));
            if(!p) return;
            const hist = agendamentos.filter(a => a.paciente === p.name);
            res.innerHTML = `
                <div class="p-4 bg-blue-50 rounded-2xl mb-4">
                    <p class="font-bold">${p.name}</p>
                    <p class="text-xs">Tel: ${p.phone} | Nasc: ${p.nasc || '--'}</p>
                </div>
                <h3 class="text-[10px] font-bold uppercase text-gray-400 mb-2">Histórico</h3>
                ${hist.map(h => `<div class="p-2 border-b text-xs"><b>${h.data}</b> - ${h.servico} (${h.hora})</div>`).join('') || 'Sem histórico'};`
        }

        function renderRelatorio(dataF) {
            const filtrados = agendamentos.filter(a => String(a.data).includes(dataF));
            document.getElementById('content').innerHTML = `
                <button onclick="window.print()" class="w-full bg-blue-600 text-white p-4 rounded-2xl font-bold mb-4 shadow-lg">Imprimir Agenda</button>
                <div class="bg-white p-6 shadow border">
                    <h2 class="text-center font-bold border-b pb-2 mb-4">AGENDA: ${dataF}</h2>
                    ${filtrados.sort((a,b)=>a.hora.localeCompare(b.hora)).map(a => `
                        <div class="flex justify-between border-b py-2 text-sm">
                            <span><b>${a.hora}</b> - ${a.paciente}</span>
                            <span class="text-[10px] uppercase">${a.servico}</span>
                        </div>
                    `).join('') || 'Vazio'}
                </div>`;
        }

        function abrirAgenda(h, c) { 
            selectedTime = h; selectedCat = c; 
            document.getElementById('info-horario').innerText = `${c} às ${h}`;
            document.getElementById('modal-agenda').classList.remove('hidden');
            filtrarModal('');
        }
        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }
        function filtrarModal(v) {
            const l = document.getElementById('lista-pacientes-modal');
            const f = pacientes.filter(p => p.name.toLowerCase().includes(v.toLowerCase()));
            l.innerHTML = f.map(p => `<div onclick="selecionarParaAgenda('${p.name}')" class="p-4 border-b font-bold text-sm">${p.name}</div>`).join('');
        }
        function selecionarParaAgenda(n) {
            selectedPac = n; document.getElementById('busca-paciente-modal').value = n;
            const b = document.getElementById('btn-confirmar');
            b.disabled = false; b.classList.replace('opacity-30', 'opacity-100');
            b.onclick = confirmarAgendamento;
        }
        async function confirmarAgendamento() {
            const dSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const srv = document.getElementById('tipo-servico').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data: dSel, hora: selectedTime, paciente: selectedPac, categoria: selectedCat, servico: srv }) });
            fecharModal(); loadData();
        }
        async function salvarPaciente() {
            const n = document.getElementById('n').value, t = document.getElementById('t').value, d = document.getElementById('d').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name: n, phone: t, nascimento: d }) });
            alert("Salvo!"); loadData();
        }
    </script>
</body>
</html>
