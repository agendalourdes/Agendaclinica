<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Clínica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --esp:#f97316; --emag:#3b82f6; --aplic:#a855f7; --roxo:#4a148c; }
        * { box-sizing:border-box; }
        body { background:#fafafa; font-family:'Quicksand',sans-serif; color:#111; -webkit-tap-highlight-color:transparent; }
        .full-header { width:100%; background:#fff; border-bottom:2px solid #eee; text-align:center; padding:0; }
        .full-header img { width:100%; height:240px; object-fit:cover; display:block; }
        .date-row { display:flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; }
        .date-row input[type=date] { padding:6px 12px; border:2px solid #eee; border-radius:12px; font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; background:#fafafa; }
        .prof-edit { font-size:11px; cursor:pointer; color:#0369a1; font-weight:700; }
        .badge { font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; }
        .b-ter  { background:#f0fdf4; color:#16a34a; }
        .b-blq  { background:#fef2f2; color:#dc2626; }
        .slot { border-radius:18px; border:1px solid #f0f0f0; cursor:pointer; margin-bottom:10px; background:#fff; padding:18px 20px; position:relative; }
        .sl-esp   { border-left:8px solid var(--esp); }
        .sl-emag  { border-left:8px solid var(--emag); }
        .sl-aplic { border-left:8px solid var(--aplic); }
        .sl-busy  { border:none!important; color:#fff!important; }
        .bg-esp   { background:var(--esp)!important; }
        .bg-emag  { background:var(--emag)!important; }
        .bg-aplic { background:var(--aplic)!important; }
        .slot-btns { position:absolute; top:8px; right:8px; display:flex; gap:6px; }
        .slot-btn { width:32px; height:32px; border-radius:8px; border:none; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; }
        .slot-edit { background:rgba(255,255,255,0.2); color:#fff; }
        .slot-status { position:absolute; top:8px; left:8px; font-size:16px; }
        nav button { transition:color .15s; }
        .tab-on { color:var(--roxo)!important; font-weight:800; border-top:3px solid var(--roxo); }
        .modal-bg  { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
        .modal-box { background:#fff; width:100%; max-width:480px; border-radius:28px 28px 0 0; padding:28px 24px 40px; max-height:92vh; overflow-y:auto; }
        @media(min-height:700px){ .modal-bg{align-items:center} .modal-box{border-radius:28px} }
        .sug { position:absolute; width:100%; top:100%; left:0; z-index:300; background:#fff; border:1px solid #ddd; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.1); overflow:hidden; }
        .sug div { padding:13px 16px; border-bottom:1px solid #f5f5f5; cursor:pointer; font-weight:700; font-size:14px; }
        .sug div:active { background:#f5f0ff; }
        .spinner { width:36px; height:36px; border:4px solid #eee; border-top:4px solid var(--roxo); border-radius:50%; animation:spin 1s linear infinite; margin:40px auto; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @media print { body > *:not(#print-area) { display:none!important; } #print-area { display:block!important; } }
        #print-area { display:none; }
        .rtable { width:100%; border-collapse:collapse; font-size:11px; }
        .rtable th, .rtable td { border:1px solid #ccc; padding:4px 6px; }
        .rtable th { font-weight:800; text-align:left; }
        .btn-edit { background:#0369a1; color:#fff; padding:6px 12px; border-radius:8px; border:none; font-weight:700; font-size:12px; cursor:pointer; }
    </style>
</head>
<body class="pb-24">

<header class="full-header">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div class="date-row">
        <input type="date" id="datepicker" onchange="onDateChange()">
        <span id="day-badge" class="badge"></span>
    </div>
</header>

<main id="content" class="p-4 max-w-2xl mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 shadow-lg text-gray-400 text-[9px] font-bold uppercase overflow-x-auto">
    <button onclick="showTab('agenda')"    id="tab-agenda"    class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-calendar-day text-xl"></i>Agenda</button>
    <button onclick="showTab('historico')" id="tab-historico" class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-history text-xl"></i>Histórico</button>
    <button onclick="showTab('cadastro')"  id="tab-cadastro"  class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-user-plus text-xl"></i>Cadastro</button>
    <button onclick="showTab('fichas')"    id="tab-fichas"    class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-search text-xl"></i>Fichas</button>
    <button onclick="showTab('relatorio')" id="tab-relatorio" class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-file-alt text-xl"></i>Relatório</button>
    <button onclick="showTab('produtividade')" id="tab-produtividade" class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-chart-bar text-xl"></i>Produtividade</button>
    <button onclick="showTab('acompanhamento')" id="tab-acompanhamento" class="flex-1 flex flex-col items-center gap-1 pt-2 min-w-max"><i class="fas fa-phone text-xl"></i>Acompanhamento</button>
</nav>

<div id="modal" class="hidden modal-bg" onclick="closeBg(event)">
    <div class="modal-box">
        <h2 id="modal-title" class="font-black text-xl mb-5 uppercase text-center tracking-wide">Agendar</h2>
        <select id="m-servico" class="w-full p-4 border-2 rounded-2xl mb-4 font-bold bg-gray-50 text-sm"><option>Primeira Consulta</option><option>Consulta</option><option>Retorno</option><option>Aplicação</option><option>Consulta Clinical</option><option>Retorno Clinical</option><option>Aplicação Clinical</option></select>
        <div class="relative mb-5">
            <input type="text" id="m-pac" oninput="sugerir(this.value,'sug-modal')" placeholder="Nome do paciente..." autocomplete="off" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 outline-none text-sm">
            <div id="sug-modal" class="sug hidden"></div>
        </div>
        <textarea id="m-obs" placeholder="Observações (aparecerá no relatório)" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 outline-none text-sm mb-4" rows="3"></textarea>
        <div id="edit-fields" class="hidden space-y-3 mb-4">
            <input type="date" id="m-data" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 text-sm outline-none">
            <input type="time" id="m-hora" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 text-sm outline-none">
            <select id="m-cat" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 text-sm"><option>Esportivo</option><option>Emagrecimento</option><option>Aplicação</option></select>
        </div>
        <div class="flex gap-2 flex-wrap">
            <button onclick="closeModal()" class="flex-1 p-3 font-bold text-gray-400 rounded-2xl border-2 text-xs min-w-[80px]">SAIR</button>
            <button id="btn-del" onclick="delAppt()" class="hidden flex-1 bg-red-500 text-white p-3 rounded-2xl font-bold text-xs min-w-[100px]">CANCELAR</button>
            <button id="btn-lembrete" onclick="enviarLembrete()" class="hidden flex-1 bg-yellow-500 text-white p-3 rounded-2xl font-bold text-xs min-w-[100px]">LEMBRETE</button>
            <button id="btn-confirmar" onclick="confirmarConsulta()" class="hidden flex-1 bg-green-600 text-white p-3 rounded-2xl font-bold text-xs min-w-[100px]">CONFIRMAR</button>
            <button onclick="saveAppt()" class="flex-1 bg-black text-white p-3 rounded-2xl font-bold text-xs min-w-[80px]">SALVAR</button>
        </div>
    </div>
</div>

<div id="modal-pac" class="hidden modal-bg" onclick="closeBgPac(event)">
    <div class="modal-box">
        <h2 class="font-black text-xl mb-5 uppercase text-center tracking-wide">Editar Paciente</h2>
        <div class="space-y-3">
            <input id="ep-nome"   placeholder="Nome completo" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none">
            <input id="ep-tel"    placeholder="WhatsApp (com DDD)" type="tel" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none">
            <input id="ep-nasc"   placeholder="Nascimento (DD/MM/AAAA)" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none">
            <input id="ep-email"  placeholder="E-mail" type="email" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none">
            <input id="ep-altura" placeholder="Altura (cm)" type="number" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none">
        </div>
        <div class="flex gap-3 mt-4">
            <button onclick="closePacModal()" class="flex-1 p-4 font-bold text-gray-400 rounded-2xl border-2 text-sm">SAIR</button>
            <button onclick="savePacEdit()" class="flex-[2] bg-black text-white p-4 rounded-2xl font-bold text-sm">SALVAR</button>
        </div>
    </div>
</div>

<div id="modal-prof" class="hidden modal-bg" onclick="closeBgProf(event)">
    <div class="modal-box">
        <h2 class="font-black text-xl mb-5 uppercase text-center tracking-wide">Editar Profissional</h2>
        <p class="text-sm text-gray-600 mb-4">Nutricionista Esportivo para <span id="prof-data-label"></span>:</p>
        <input id="prof-nome" placeholder="Nome do profissional" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none mb-4">
        <div class="flex gap-3">
            <button onclick="closeProf()" class="flex-1 p-4 font-bold text-gray-400 rounded-2xl border-2 text-sm">CANCELAR</button>
            <button onclick="saveProf()" class="flex-[2] bg-black text-white p-4 rounded-2xl font-bold text-sm">SALVAR</button>
        </div>
    </div>
</div>

<div id="print-area"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyQOFU8-X9aUqZKoPcqdbL41Dz5AjD_hmCxYhorC_ZztIh4V1aaf0ZsMmJrrF0xfMtl/exec";
let pacs = [], appts = [];
let mTime, mCat, mId = null, mTel = null, mEditData = null, mEditHora = null;
let profData = {}, profEditData = null;
let observacoes = {}, faltosos = {};

function limparTelefone(tel) {
    if (!tel) return '';
    let cleaned = String(tel).replace(/\D/g, '').trim();
    return cleaned;
}

window.onload = () => {
    if (localStorage.getItem('obsClinca')) try { observacoes = JSON.parse(localStorage.getItem('obsClinca')); } catch(e) {}
    if (localStorage.getItem('faltosos')) try { faltosos = JSON.parse(localStorage.getItem('faltosos')); } catch(e) {}
    if (localStorage.getItem('profData')) try { profData = JSON.parse(localStorage.getItem('profData')); } catch(e) {}
    
    const d = new Date();
    const diff = (2 - d.getDay() + 7) % 7 || 7;
    d.setDate(d.getDate() + diff);
    document.getElementById('datepicker').value = d.toLocaleDateString('en-CA');
    updateBadge();
    showTab('agenda');
    loadAll();
};

async function api(params) {
    try {
        const url = API + '?' + new URLSearchParams(params).toString();
        const r = await fetch(url);
        if (!r.ok) throw new Error('Erro na requisição');
        const text = await r.text();
        return JSON.parse(text);
    } catch(e) {
        console.error('API Error:', e);
        throw e;
    }
}

async function loadAll() {
    showSpinner();
    try {
        const d = await api({ action: 'getAll' });
        pacs = d.patients || [];
        appts = (d.appointments || []).map(a => ({ ...a, data: normDate(a.data), hora: normHora(a.hora) }));
    } catch(e) {
        console.error('loadAll error:', e);
        alert('Erro ao carregar dados');
    }
    render();
}

function normDate(v) {
    if (!v) return '';
    v = String(v).trim();
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
    const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[3]}/${m[2]}/${m[1]}`;
    try { const d = new Date(v); if (!isNaN(d)) return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}/${d.getUTCFullYear()}`; } catch(e) {}
    return v;
}

function normHora(v) {
    if (!v) return '';
    v = String(v).trim();
    if (/^\d{2}:\d{2}$/.test(v)) return v;
    if (v.includes('encaixe')) return v;
    const m = v.match(/^(\d{2}):(\d{2})/);
    if (m) return `${m[1]}:${m[2]}`;
    const n = parseFloat(v);
    if (!isNaN(n) && n >= 0 && n < 1) { const tot = Math.round(n * 1440); return `${pad(Math.floor(tot/60))}:${pad(tot%60)}`; }
    try { const d = new Date(v); if (!isNaN(d)) return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; } catch(e) {}
    return v;
}

function cleanDate(v) { if (!v) return ''; v = String(v).trim(); const m = v.match(/^(\d{2}\/\d{2}\/\d{4})/); return m ? m[1] : v; }
function pad(n) { return String(n).padStart(2,'0'); }
function getISO()  { return document.getElementById('datepicker').value; }
function getBR()   { const [y,m,d] = getISO().split('-'); return `${d}/${m}/${y}`; }
function weekday() { return new Date(getISO()+'T12:00:00').getDay(); }
function allowed() { return weekday() === 2; }

function getEsportivoProf() {
    const dataF = getBR();
    if (profData[dataF]) return profData[dataF];
    
    const [d, m, a] = dataF.split('/');
    const dataAtual = new Date(`${a}-${m}-${d}T12:00:00`);
    const dataInicio = new Date('2026-05-05T12:00:00'); // 05/05/2026 = Líbia
    
    let dataTemp = new Date(dataInicio);
    let semanas = 0;
    while (dataTemp < dataAtual) { 
        dataTemp.setDate(dataTemp.getDate() + 7); 
        semanas++; 
    }
    
    const prof = semanas % 2 === 0 ? 'Líbia' : 'Geraldo';
    profData[dataF] = prof;
    localStorage.setItem('profData', JSON.stringify(profData));
    return prof;
}

function onDateChange() { updateBadge(); render(); }
function updateBadge() {
    const b = document.getElementById('day-badge');
    if (weekday()===2) { b.textContent='TERÇA'; b.className='badge b-ter'; }
    else { b.textContent='BLOQUEADO'; b.className='badge b-blq'; }
}

function showTab(t) {
    window.TAB = t;
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-on'));
    document.getElementById('tab-'+t).classList.add('tab-on');
    render();
}

function showSpinner() { document.getElementById('content').innerHTML = '<div class="spinner"></div>'; }

function render() {
    const c = document.getElementById('content');
    if (window.TAB === 'agenda') {
        if (!allowed()) { c.innerHTML = `<div class="mt-12 text-center"><div class="text-5xl mb-3">🚫</div><p class="font-bold text-red-400 text-lg">Selecione uma terça-feira.</p></div>`; return; }
        c.innerHTML = catHTML('Esportivo', getEsportivoProf(), 'sl-esp', 'bg-esp', 25) + catHTML('Emagrecimento', 'Bruno', 'sl-emag', 'bg-emag', 35) + catHTML('Aplicação', '', 'sl-aplic', 'bg-aplic', 30);
    } else if (window.TAB === 'historico') {
        c.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><div class="flex justify-between items-center mb-4"><h2 class="font-black text-xl uppercase">Histórico</h2><button onclick="imprimirHistorico()" class="bg-black text-white px-4 py-2 rounded-2xl font-bold text-sm"><i class="fas fa-print"></i> Imprimir</button></div><div class="relative"><input id="inp-hist" oninput="sugerir(this.value,'sug-hist')" type="text" placeholder="Nome do paciente..." autocomplete="off" class="w-full p-4 border-2 rounded-2xl font-bold outline-none bg-gray-50 text-sm"><div id="sug-hist" class="sug hidden"></div></div><div id="hist-list" class="mt-5 space-y-3"></div></div>`;
    } else if (window.TAB === 'cadastro') {
        c.innerHTML = `<div class="p-6 bg-white rounded-3xl border shadow-sm"><h2 class="font-black text-2xl mb-6 uppercase text-center">Novo Paciente</h2><div class="space-y-3"><div class="relative"><input id="c-nome" oninput="verificarDuplicado(this.value)" placeholder="Nome completo *" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none"><div id="sug-cadastro" class="sug hidden"></div><div id="aviso-dup" class="text-red-500 text-xs font-bold mt-1 hidden">⚠️ Paciente já existe!</div></div><input id="c-tel" placeholder="WhatsApp (com DDD)" type="tel" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none"><input id="c-nasc" placeholder="Nascimento (DD/MM/AAAA)" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none"><input id="c-email" placeholder="E-mail" type="email" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none"><input id="c-altura" placeholder="Altura (cm)" type="number" class="w-full p-4 border-2 rounded-2xl font-bold text-sm outline-none"><button id="btn-cadastrar" onclick="cadastrar()" class="w-full bg-black text-white p-5 rounded-2xl font-black text-sm">SALVAR PACIENTE</button></div></div>`;
    } else if (window.TAB === 'fichas') {
        c.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><h2 class="font-black text-xl mb-4 uppercase">Fichas</h2><div class="relative"><input id="inp-fichas" oninput="sugerir(this.value,'sug-fichas')" type="text" placeholder="Nome do paciente..." autocomplete="off" class="w-full p-4 border-2 rounded-2xl font-bold outline-none bg-gray-50 text-sm"><div id="sug-fichas" class="sug hidden"></div></div><div id="ficha-res" class="mt-5"></div></div>`;
    } else if (window.TAB === 'relatorio') {
        renderRel();
    } else if (window.TAB === 'produtividade') {
        renderProdutividade();
    } else if (window.TAB === 'acompanhamento') {
        renderAcompanhamento();
    }
}

function catHTML(cat, prof, slCl, bgCl, step) {
    const dataF = getBR();
    const titulo = prof ? `${cat.toUpperCase()} — <span class="prof-edit" onclick="editProf('${dataF}')">${prof} ✏️</span>` : cat.toUpperCase();
    let html = `<h3 class="font-black text-[10px] uppercase tracking-widest mt-8 mb-3 px-1 text-gray-400">${titulo}</h3>`;
    const agsReais = appts.filter(a => a.data === dataF && a.categoria === cat && !a.hora.includes('encaixe'));
    const slots = [];
    let h=9, m=0;
    while (h < 12 || (h===12 && m===0)) { slots.push(`${pad(h)}:${pad(m)}`); m += step; if (m >= 60) { h += Math.floor(m/60); m = m%60; } }
    const todosHorarios = new Set(slots);
    agsReais.forEach(ag => todosHorarios.add(normHora(ag.hora)));
    const horariosOrdenados = Array.from(todosHorarios).sort((a, b) => a.localeCompare(b));
    horariosOrdenados.forEach(hora => {
        const ag = agsReais.find(a => normHora(a.hora) === hora);
        if (ag) {
            const esc = JSON.stringify(ag).replace(/"/g,'&quot;');
            const faltouIcon = faltosos[ag.id] ? '❌ FALTOU' : '';
            html += `<div data-ag="${esc}" class="slot sl-busy ${bgCl}" style="${faltosos[ag.id] ? 'opacity:0.5;text-decoration:line-through;' : ''}"><div class="slot-status">${faltouIcon}</div><div class="slot-btns"><button onclick="openEdit('${normHora(ag.hora)}','${cat}',this)" class="slot-btn slot-edit" title="Editar">✏️</button><button onclick="enviarWhatsApp('${ag.id}','${ag.paciente.replace(/'/g,"\\'")}','${ag.data}','${normHora(ag.hora)}','${ag.servico}','${ag.categoria}')" class="slot-btn slot-edit" title="WhatsApp" style="background:rgba(37,211,102,0.2)"><i class="fab fa-whatsapp"></i></button></div><div onclick="openEdit('${normHora(ag.hora)}','${cat}',this)" style="cursor:pointer"><div class="flex justify-between text-[10px] uppercase font-bold mb-1 opacity-80"><span>${hora}</span><span>${ag.servico||''}</span></div><p class="text-lg font-black uppercase">${ag.paciente}</p></div></div>`;
        } else {
            html += `<div onclick="openNew('${hora}','${cat}')" class="slot ${slCl} flex justify-between items-center"><span class="font-bold text-gray-400 text-sm">${hora} — LIVRE</span><i class="fas fa-plus text-gray-300"></i></div>`;
        }
    });
    const temEncaixeAgendado = appts.find(a => a.data === dataF && a.categoria === cat && a.hora.includes('encaixe'));
    if (!temEncaixeAgendado) { html += `<div onclick="openNew('encaixe-${cat}','${cat}')" class="slot ${slCl} flex justify-between items-center border-dashed border-2" style="min-height:80px;background:#fafafa;cursor:pointer;"></div>`; }
    return html;
}

function editProf(data) {
    profEditData = data;
    const atual = profData[data] || getEsportivoProf();
    document.getElementById('prof-data-label').textContent = data;
    document.getElementById('prof-nome').value = atual;
    document.getElementById('modal-prof').classList.remove('hidden');
}

function closeProf() { document.getElementById('modal-prof').classList.add('hidden'); }
function closeBgProf(e) { if (e.target.id==='modal-prof') closeProf(); }

function saveProf() {
    const nome = document.getElementById('prof-nome').value.trim();
    if (!nome) { alert('Nome obrigatório!'); return; }
    profData[profEditData] = nome;
    localStorage.setItem('profData', JSON.stringify(profData));
    closeProf();
    render();
}

function openNew(hora, cat) {
    mTime=hora; mCat=cat; mId=null; mTel=null; mEditData=null; mEditHora=null;
    document.getElementById('modal-title').textContent = hora.includes('encaixe') ? `Agendar Encaixe` : `Agendar — ${hora}`;
    document.getElementById('m-pac').value = '';
    document.getElementById('m-obs').value = '';
    document.getElementById('m-servico').selectedIndex = 0;
    document.getElementById('sug-modal').classList.add('hidden');
    document.getElementById('edit-fields').classList.add('hidden');
    document.getElementById('btn-del').classList.add('hidden');
    document.getElementById('btn-lembrete').classList.add('hidden');

async function saveAppt() {
    const pac = document.getElementById('m-pac').value.trim();
    if (!pac) { alert('Selecione um paciente!'); return; }
    
    let horaParaSalvar = mTime;
    if (mTime.includes('encaixe')) {
        const horaEncaixe = document.getElementById('m-hora').value;
        if (!horaEncaixe) { alert('Adicione um horário para o encaixe!'); return; }
        horaParaSalvar = horaEncaixe;
    }
    
    let data = mEditData || getBR();
    let hora = mEditHora || horaParaSalvar;
    let cat = mCat;
    const servico = document.getElementById('m-servico').value;
    
    if (mId) {
        const newData = document.getElementById('m-data').value;
        const newHora = document.getElementById('m-hora').value;
        const newCat = document.getElementById('m-cat').value;
        if (newData) { const [y,m,d] = newData.split('-'); data = `${d}/${m}/${y}`; }
        if (newHora) hora = newHora;
        if (newCat) cat = newCat;
    }
    
    const obs = document.getElementById('m-obs').value.trim();
    if (obs) { 
        const chaveObs = `${data}|${pac}|${hora}`; 
        observacoes[chaveObs] = obs; 
        localStorage.setItem('obsClinca', JSON.stringify(observacoes)); 
    }
    
    closeModal();
    
    try {
        await api({ action: 'saveAppt', data, hora, paciente: pac, servico: servico, categoria: cat, id: mId || '' });
        alert('✅ Agendamento salvo!');
        await loadAll();
    } catch(e) { 
        alert('Erro ao salvar: ' + e.message);
        render();
    }
}

async function delAppt() {
    if (!mId) return;
    if (!confirm('Cancelar este agendamento?')) return;
    closeModal();
    try {
        await api({ action: 'delAppt', id: mId });
        alert('✅ Agendamento cancelado!');
        await loadAll();
    } catch(e) { alert('Erro ao cancelar: ' + e.message); render(); }
}

function sugerir(v, sid) {
    const el = document.getElementById(sid);
    if (!v || v.length < 1) { el.classList.add('hidden'); return; }
    const f = pacs.filter(p => p.nome && p.nome.toLowerCase().includes(v.toLowerCase())).slice(0, 8);
    if (!f.length) { el.classList.add('hidden'); return; }
    el.innerHTML = f.map(p => `<div onclick="selPac('${p.nome.replace(/'/g,"\\'")}','${sid}')">${p.nome}</div>`).join('');
    el.classList.remove('hidden');
}

function selPac(nome, sid) {
    document.getElementById(sid).classList.add('hidden');
    if (sid === 'sug-modal')  document.getElementById('m-pac').value = nome;
    if (sid === 'sug-hist')   { document.getElementById('inp-hist').value = nome; showHist(nome); }
    if (sid === 'sug-fichas') { document.getElementById('inp-fichas').value = nome; showFicha(nome); }
}

function verificarDuplicado(v) {
    const el = document.getElementById('sug-cadastro');
    const aviso = document.getElementById('aviso-dup');
    const btn = document.getElementById('btn-cadastrar');
    if (!v || v.length < 1) { el.classList.add('hidden'); aviso.classList.add('hidden'); btn.disabled = false; return; }
    const f = pacs.filter(p => p.nome && p.nome.toLowerCase().includes(v.toLowerCase())).slice(0, 5);
    if (f.length > 0) {
        el.innerHTML = f.map(p => `<div onclick="preencherCadastro('${p.nome.replace(/'/g,"\\'")}','${p.telefone||''}','${p.nascimento||''}','${p.email||''}','${p.altura||''}')">${p.nome}</div>`).join('');
        el.classList.remove('hidden');
        aviso.classList.remove('hidden');
        btn.disabled = true;
    } else {
        el.classList.add('hidden');
        aviso.classList.add('hidden');
        btn.disabled = false;
    }
}

function preencherCadastro(nome, tel, nasc, email, altura) {
    document.getElementById('c-nome').value = nome;
    document.getElementById('c-tel').value = tel;
    document.getElementById('c-nasc').value = nasc;
    document.getElementById('c-email').value = email;
    document.getElementById('c-altura').value = altura;

    document.getElementById('aviso-dup').classList.add('hidden');
}

async function cadastrar() {
    const btn = document.getElementById('btn-cadastrar');
    const nome = document.getElementById('c-nome').value.trim();
    if (!nome) { alert('Nome obrigatório!'); return; }
    btn.disabled = true;
    btn.textContent = '⏳ Salvando...';
    try {
        await api({ action: 'savePac', nome, tel: document.getElementById('c-tel').value.trim(), nasc: document.getElementById('c-nasc').value.trim(), email: document.getElementById('c-email').value.trim(), altura: document.getElementById('c-altura').value.trim() });
        alert(`✅ ${nome} cadastrado!`);
        document.getElementById('c-nome').value = '';
        document.getElementById('c-tel').value = '';
        document.getElementById('c-nasc').value = '';
        document.getElementById('c-email').value = '';
        document.getElementById('c-altura').value = '';
        await loadAll();
    } catch(e) { 
        alert('Erro ao cadastrar: ' + e.message);
    } 
    finally { btn.disabled = false; btn.textContent = 'SALVAR PACIENTE'; }
}

function showHist(nome) {
    const lista = appts.filter(a => a.paciente === nome).sort((a,b) => b.data.split('/').reverse().join('').localeCompare(a.data.split('/').reverse().join('')));
    const el = document.getElementById('hist-list');
    if (!lista.length) { el.innerHTML = '<p class="text-gray-400 text-center">Sem histórico.</p>'; return; }
    el.innerHTML = lista.map(a => `<div class="p-4 border-2 rounded-2xl bg-gray-50"><div class="flex justify-between items-center"><span class="font-black text-sm">${a.data} — ${normHora(a.hora)}</span><span class="text-xs font-bold px-2 py-1 rounded-full bg-white border">${a.categoria}</span></div><p class="font-bold text-sm mt-1 text-gray-500">${a.servico||'—'}</p></div>`).join('');
}

function imprimirHistorico() {
    const paciente = document.getElementById('inp-hist').value.trim();
    if (!paciente) { alert('Selecione um paciente!'); return; }
    const lista = appts.filter(a => a.paciente === paciente).sort((a,b) => b.data.split('/').reverse().join('').localeCompare(a.data.split('/').reverse().join('')));
    let html = `<div style="font-family:Arial;padding:20px"><h2 style="text-align:center;margin-bottom:20px">${paciente} - Histórico</h2>`;
    html += `<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#f0f0f0;font-weight:bold"><th style="border:1px solid #ccc;padding:8px">Data</th><th style="border:1px solid #ccc;padding:8px">Hora</th><th style="border:1px solid #ccc;padding:8px">Serviço</th><th style="border:1px solid #ccc;padding:8px">Categoria</th></tr>`;
    lista.forEach(a => { html += `<tr><td style="border:1px solid #ccc;padding:8px">${a.data}</td><td style="border:1px solid #ccc;padding:8px">${normHora(a.hora)}</td><td style="border:1px solid #ccc;padding:8px">${a.servico||'-'}</td><td style="border:1px solid #ccc;padding:8px">${a.categoria}</td></tr>`; });

    document.getElementById('print-area').style.display = 'block';

function secaoRel(cat, prof, step, thBg) {
    const dataF = getBR();
    const titulo = prof ? `${cat} — ${prof}` : cat;
    let rows = '';
    const agsDaCat = appts.filter(a => a.data===dataF && a.categoria===cat && !a.hora.includes('encaixe')).sort((a,b) => normHora(a.hora).localeCompare(normHora(b.hora)));
    agsDaCat.forEach(ag => {
        const pac = pacs.find(p => p.nome===ag.paciente);
        const prev = appts.filter(a => a.paciente===ag.paciente && a.data!==dataF && !a.hora.includes('encaixe')).sort((a,b) => b.data.split('/').reverse().join('').localeCompare(a.data.split('/').reverse().join('')))[0];
        const chaveObs = `${ag.data}|${ag.paciente}|${normHora(ag.hora)}`;
        const obs = observacoes[chaveObs] || '';
        rows += `<tr><td style="font-weight:800;color:#555;white-space:nowrap">${normHora(ag.hora)}</td><td style="font-weight:800">${ag.paciente.toUpperCase()}</td><td style="white-space:nowrap">${pac?.telefone||''}</td><td style="white-space:nowrap">${cleanDate(pac?.nascimento||'')}</td><td style="font-size:10px">${pac?.email||''}</td><td style="white-space:nowrap">${pac?.altura ? pac.altura+'cm' : ''}</td><td style="white-space:nowrap">${prev ? prev.data : ''}</td><td style="font-size:10px">${prev ? (prev.servico||'')+(prev.categoria?' · '+prev.categoria:'') : ''}</td><td style="font-weight:800">${ag.servico||''}</td><td style="font-size:10px">${obs}</td></tr>`;
    });
    return `<tr><td colspan="10" style="background:${thBg};font-weight:900;font-size:13px;padding:7px 8px;border:1px solid #ccc">* ${titulo.toUpperCase()}</td></tr><tr style="background:${thBg}99;font-size:10px;font-weight:800"><th>Horário</th><th>Paciente</th><th>Telefone</th><th>Nascimento</th><th>Email</th><th>Alt.</th><th>Última visita</th><th>Último proc.</th><th>Hoje</th><th>Observação</th></tr>${rows}`;
}

    const c = document.getElementById('content');
    const nutricionistas = ['Líbia', 'Geraldo', 'Bruno'];
    let html = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><h2 class="font-black text-xl mb-4 uppercase">Produtividade</h2><div class="mb-4 space-y-3"><div><label class="text-sm font-bold text-gray-600">Data Inicial</label><input type="date" id="data-inicio" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 text-sm mt-1" onchange="renderProdutividade()"></div><div><label class="text-sm font-bold text-gray-600">Data Final</label><input type="date" id="data-fim" class="w-full p-4 border-2 rounded-2xl font-bold bg-gray-50 text-sm mt-1" onchange="renderProdutividade()"></div></div><div id="prod-res"></div></div>`;
    c.innerHTML = html;
    setTimeout(() => {
        const dataInicio = document.getElementById('data-inicio').value;
        const dataFim = document.getElementById('data-fim').value;
        let dataInicioNum, dataFimNum;
        if (!dataInicio || !dataFim) {
            const hoje = new Date();
            const primeiroDia = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
            const ultimoDia = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
            dataInicioNum = parseInt(`${primeiroDia.getFullYear()}${String(primeiroDia.getMonth()+1).padStart(2,'0')}${String(primeiroDia.getDate()).padStart(2,'0')}`);
            dataFimNum = parseInt(`${ultimoDia.getFullYear()}${String(ultimoDia.getMonth()+1).padStart(2,'0')}${String(ultimoDia.getDate()).padStart(2,'0')}`);
            document.getElementById('data-inicio').value = primeiroDia.toLocaleDateString('en-CA');
            document.getElementById('data-fim').value = ultimoDia.toLocaleDateString('en-CA');
        } else {
            const [aI, mI, dI] = dataInicio.split('-');
            const [aF, mF, dF] = dataFim.split('-');
            dataInicioNum = parseInt(`${aI}${mI}${dI}`);
            dataFimNum = parseInt(`${aF}${mF}${dF}`);
        }
        function dataToNum(dataBR) {
            const [d, m, a] = dataBR.split('/');
            return parseInt(`${a}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`);
        }
        let tabela = `<table class="rtable"><thead><tr><td colspan="4" style="text-align:center;font-weight:900;font-size:15px;padding:8px;border:1px solid #ccc">PRODUTIVIDADE</td></tr></thead><tbody><tr style="background:#f0f0f0;font-size:10px;font-weight:800"><th>Nutricionista</th><th>Consultas</th><th>Retornos</th><th>Total</th></tr>`;
        nutricionistas.forEach(n => {
            let consultas = 0, retornos = 0;
            appts.forEach(a => {
                const dataNum = dataToNum(a.data);
                if (dataNum < dataInicioNum || dataNum > dataFimNum) return;
                if (a.hora.includes('encaixe')) return;
                if (!['Primeira Consulta','Consulta','Retorno'].includes(a.servico)) return;
                if (n === 'Líbia' && a.categoria === 'Esportivo') {
                    const prof = profData[a.data] || getEsportivoProf();
                    if (prof === 'Líbia') {
                        if (a.servico === 'Retorno') retornos++; else consultas++;
                    }
                }
                if (n === 'Geraldo' && a.categoria === 'Esportivo') {
                    const prof = profData[a.data] || getEsportivoProf();
                    if (prof === 'Geraldo') {
                        if (a.servico === 'Retorno') retornos++; else consultas++;
                    }
                }
                if (n === 'Bruno' && a.categoria === 'Emagrecimento') {
                    if (a.servico === 'Retorno') retornos++; else consultas++;
                }
            });
            tabela += `<tr><td style="font-weight:800">${n}</td><td style="text-align:center;font-weight:800">${consultas}</td><td style="text-align:center;font-weight:800">${retornos}</td><td style="text-align:center;font-weight:800">${consultas+retornos}</td></tr>`;
        });
        tabela += `</tbody></table>`;
        document.getElementById('prod-res').innerHTML = `<div style="overflow-x:auto">${tabela}</div><div class="mt-4"><button onclick="imprimirProdutividade()" class="w-full bg-black text-white p-4 rounded-2xl font-bold text-sm flex items-center justify-center gap-2"><i class="fas fa-print"></i> Imprimir</button></div>`;
        document.getElementById('print-area').innerHTML = `<div style="padding:20px;font-family:Arial,sans-serif"><h2 style="text-align:center;margin-bottom:20px;font-weight:bold">PRODUTIVIDADE</h2>${tabela}</div>`;
    }, 100);
}

function imprimirProdutividade() {
    document.getElementById('print-area').style.display = 'block';
    window.print();
    setTimeout(() => { document.getElementById('print-area').style.display = 'none'; }, 1000);
}

function renderAcompanhamento() {
    const c = document.getElementById('content');
    const hoje = new Date();
    const data60d = new Date(hoje.getTime() - 60 * 24 * 60 * 60 * 1000);
    const data25d = new Date(hoje.getTime() - 25 * 24 * 60 * 60 * 1000);
    function dataToNum(d) { const [dia, mes, ano] = d.split('/'); return parseInt(ano + ('0' + mes).slice(-2) + ('0' + dia).slice(-2)); }
    function dateToNum(date) { const dia = ('0' + date.getDate()).slice(-2); const mes = ('0' + (date.getMonth() + 1)).slice(-2); const ano = date.getFullYear(); return parseInt(ano + mes + dia); }
    const ultimasConsultas = {};
    appts.forEach(ag => { if (!ag.hora.includes('encaixe')) { const num = dataToNum(ag.data); if (!ultimasConsultas[ag.paciente] || num > dataToNum(ultimasConsultas[ag.paciente].data)) { ultimasConsultas[ag.paciente] = ag; } } });
    const num60 = dateToNum(data60d);
    const num25 = dateToNum(data25d);
    const acompanhar = Object.values(ultimasConsultas).filter(ag => { const num = dataToNum(ag.data); return num >= num60 && num <= num25; }).map(ag => {
        const pac = pacs.find(p => p.nome === ag.paciente);
        const [d, m, a] = ag.data.split('/');
        const dataConsulta = new Date(a, m - 1, d);
        const diasAtrás = Math.floor((hoje - dataConsulta) / (1000 * 60 * 60 * 24));
        return { ...ag, pac, diasAtrás };
    }).sort((a, b) => b.diasAtrás - a.diasAtrás);
    if (!acompanhar.length) {
        c.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm text-center"><i class="fas fa-check-circle text-5xl text-green-500 mb-3" style="display:block"></i><p class="font-black text-lg text-green-600">✅ Sem pacientes para acompanhar!</p></div>`;
        return;
    }
    let html = `<div class="bg-white p-6 rounded-3xl border shadow-sm"><h2 class="font-black text-xl mb-2 uppercase">Acompanhamento</h2><p class="text-xs text-gray-500 mb-4">Pacientes com última consulta entre 25-60 dias</p><div class="space-y-3">`;
    acompanhar.forEach(ag => {
        const tel = ag.pac?.telefone || '';
        html += `<div class="border-2 border-orange-300 rounded-2xl p-4 bg-orange-50"><div class="flex items-start justify-between gap-2"><div class="flex-1"><p class="font-black text-sm uppercase text-orange-900">${ag.paciente}</p><p class="text-xs text-gray-600 mt-1">Última consulta: ${ag.data} (${ag.diasAtrás} dias atrás)</p>${ag.pac?.telefone ? `<p class="text-xs text-gray-600"><i class="fas fa-phone mr-1"></i>${ag.pac.telefone}</p>` : ''}</div><div class="flex flex-col gap-2"><button onclick="enviarWhatsAppAcompanhamento('${ag.paciente.replace(/'/g,"\\'")}','${ag.data}')" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1 whitespace-nowrap"><i class="fab fa-whatsapp"></i> Chamar</button></div></div></div>`;
    });
    html += `</div></div>`;
    c.innerHTML = html;
}

function enviarWhatsAppAcompanhamento(nome, data) {
    const pac = pacs.find(p => p.nome === nome);
    const tel = limparTelefone(pac?.telefone);
    if (!tel) { alert('Paciente sem telefone!'); return; }
    const msg = encodeURIComponent(`Olá ${nome}! 👋\n\nVimos que sua última consulta foi em ${data}. Que tal agendar uma nova consulta? 📅\n\nAguardamos seu contato! 😊`);
    window.open(`https://wa.me/55${tel}?text=${msg}`, '_blank');
}

document.addEventListener('click', e => { document.querySelectorAll('.sug').forEach(s => { if (!s.contains(e.target)) s.classList.add('hidden'); }); });
</script>
