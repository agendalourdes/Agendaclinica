<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Clínico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --cat-esportivo: #f97316; --cat-emagrecimento: #3b82f6; --cat-aplicacao: #a855f7; }
        body { background: #fafafa; font-family: 'Quicksand', sans-serif; color: #000; }
        .full-header { width: 100%; background: #fff; border-bottom: 1px solid #eee; text-align: center; padding: 10px 0; }
        .full-header img { max-width: 250px; }
        .slot-card { border-radius: 18px; border: 1px solid #f0f0f0; cursor: pointer; margin-bottom: 10px; background: #fff; padding: 20px; }
        .free-esportivo { border-left: 10px solid var(--cat-esportivo); }
        .free-emagrecimento { border-left: 10px solid var(--cat-emagrecimento); }
        .free-aplicacao { border-left: 10px solid var(--cat-aplicacao); }
        .busy-card { color: white !important; border: none; }
        .busy-esportivo { background: var(--cat-esportivo) !important; }
        .busy-emagrecimento { background: var(--cat-emagrecimento) !important; }
        .busy-aplicacao { background: var(--cat-aplicacao) !important; }
        .tab-active { color: #4a148c !important; font-weight: 800; border-bottom: 3px solid #4a148c; }
        .search-suggestions { position: absolute; width: 100%; top: 100%; z-index: 100; background: white; border: 1px solid #ddd; border-radius: 12px; }
        .search-suggestions div { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    </style>
</head>
<body class="pb-32">

    <header class="full-header">
        <img src="logo.png">
        <div class="mt-2"><input type="date" id="data-seletor" onchange="loadData()" class="p-2 border rounded-xl font-bold"></div>
    </header>

    <main id="content" class="p-4 max-w-2xl mx-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 shadow-lg text-gray-400">
        <button onclick="showTab('agenda')" id="tab-agenda" class="flex-1 flex flex-col items-center"><i class="fas fa-calendar-day"></i><span class="text-[9px] font-bold">AGENDA</span></button>
        <button onclick="showTab('historico')" id="tab-historico" class="flex-1 flex flex-col items-center"><i class="fas fa-history"></i><span class="text-[9px] font-bold">HISTÓRICO</span></button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="flex-1 flex flex-col items-center"><i class="fas fa-user-plus"></i><span class="text-[9px] font-bold">CADASTRO</span></button>
        <button onclick="showTab('busca')" id="tab-busca" class="flex-1 flex flex-col items-center"><i class="fas fa-search"></i><span class="text-[9px] font-bold">FICHAS</span></button>
    </nav>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[28px] p-8 relative text-black">
            <h2 class="font-bold text-2xl mb-4 uppercase text-center">Agendar</h2>
            <select id="tipo-servico" class="w-full p-4 border rounded-2xl mb-4 font-bold bg-gray-50">
                <option value="Primeira Consulta">Primeira Consulta</option>
                <option value="Consulta">Consulta</option>
                <option value="Retorno">Retorno</option>
                <option value="Aplicação">Aplicação</option>
                <option value="Consulta Clinical">Consulta Clinical</option>
                <option value="Retorno Clinical">Retorno Clinical</option>
                <option value="Aplicação Clinical">Aplicação Clinical</option>
                <option value="Peneira Consulta">Peneira Consulta</option>
            </select>
            <div class="relative mb-6">
                <input type="text" id="busca-pac" oninput="autoSugerir(this.value, 'sug-modal')" placeholder="Nome do paciente..." class="w-full p-4 border rounded-2xl font-bold bg-gray-50 outline-none">
                <div id="sug-modal" class="search-suggestions hidden"></div>
            </div>
            <div class="flex gap-3">
                <button onclick="fecharModal()" class="flex-1 p-4 font-bold text-gray-400">SAIR</button>
                <button onclick="salvar()" class="flex-[2] bg-black text-white p-4 rounded-2xl font-bold">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwq10NESr9gx83tuwvASPj8Wc6uKoYXlSb0mrNumWqfapI6FtgjhS43sUQueXdaIXbu/exec"; 
        let pacientes = [], agendamentos = [], sTime, sCat, editId = null;

        window.onload = () => {
            const hoje = new Date();
            document.getElementById('data-seletor').value = hoje.toLocaleDateString('en-CA');
            showTab('agenda'); loadData();
        };

        async function loadData() {
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || [];
                agendamentos = d.appointments || [];
                render();
            } catch(e) { console.error(e); }
        }

        function showTab(tab) {
            window.currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const dataSel = document.getElementById('data-seletor').value;
            const partes = dataSel.split('-');
            const dataF = `${partes[2]}/${partes[1]}/${partes[0]}`;

            if (window.currentTab === 'agenda') {
                container.innerHTML = `
                    ${renderCategoria('Esportivo', 'free-esportivo', 'busy-esportivo', 25, dataF)}
                    ${renderCategoria('Emagrecimento', 'free-emagrecimento', 'busy-emagrecimento', 35, dataF)}
                    ${renderCategoria('Aplicação', 'free-aplicacao', 'busy-aplicacao', 30, dataF)}`;
            } else if (window.currentTab === 'historico') {
                container.innerHTML = `<div class="bg-white p-6 rounded-3xl border shadow-sm relative"><h2 class="font-bold text-xl mb-4 uppercase">Histórico</h2><input type="text" oninput="autoSugerir(this.value, 'sug-hist')" placeholder="Nome do paciente..." class="w-full p-4 border rounded-2xl font-bold outline-none"><div id="sug-hist" class="search-suggestions hidden"></div><div id="lista-historico" class="mt-8 space-y-4"></div></div>`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `<div class="p-8 bg-white rounded-3xl border shadow-sm"><h2 class="font-bold text-2xl mb-6 uppercase text-center">Cadastro</h2><div class="space-y-4"><input id="c-nome" placeholder="Nome" class="w-full p-4 border rounded-2xl font-bold"><input id="c-tel" placeholder="WhatsApp" class="w-full p-4 border rounded-2xl font-bold"><button onclick="cadastrar()" class="w-full bg-black text-white p-5 rounded-2xl font-bold">SALVAR</button></div></div>`;
            }
        }

        function renderCategoria(cat, freeCl, busyCl, step, dataF) {
            let html = `<h3 class="font-bold text-[11px] uppercase tracking-widest mt-8 mb-4 text-gray-400 px-2">${cat}</h3>`;
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < 13) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                // CORREÇÃO: Comparação exata de data e categoria
                const ag = agendamentos.find(a => String(a.data).trim() === dataF && a.categoria === cat && a.hora === h);
                if(ag) {
                    html += `<div onclick="abrirModal('${h}','${cat}',${JSON.stringify(ag).replace(/"/g, '&quot;')})" class="slot-card busy-card ${busyCl}"><div class="flex justify-between text-[10px] uppercase font-bold"><span>${h}</span><span>${ag.servico}</span></div><p class="text-xl font-bold uppercase mt-1">${ag.paciente}</p></div>`;
                } else {
                    html += `<div onclick="abrirModal('${h}','${cat}')" class="slot-card ${freeCl} flex justify-between items-center"><span class="font-bold text-gray-400">${h} - LIVRE</span><i class="fas fa-plus opacity-20"></i></div>`;
                }
                t.setMinutes(t.getMinutes() + step);
            }
            return html;
        }

        function autoSugerir(v, cid) {
            const s = document.getElementById(cid);
            if(v.length < 1) { s.classList.add('hidden'); return; }
            const f = pacientes.filter(p => p.nome.toLowerCase().includes(v.toLowerCase()));
            s.innerHTML = f.map(p => `<div onclick="selecionar('${p.nome}', '${cid}')">${p.nome}</div>`).join('');
            s.classList.remove('hidden');
        }

        function selecionar(n, cid) {
            document.getElementById(cid).classList.add('hidden');
            if(cid === 'sug-modal') document.getElementById('busca-pac').value = n;
            if(cid === 'sug-hist') verHistorico(n);
        }

        function verHistorico(nome) {
            const lista = agendamentos.filter(a => a.paciente === nome).reverse();
            document.getElementById('lista-historico').innerHTML = lista.map(a => `<div class="p-4 border rounded-2xl bg-gray-50 text-black font-bold">${a.data} - ${a.hora} - ${a.servico}</div>`).join('') || 'Sem histórico';
        }

        function abrirModal(h, cat, ag = null) {
            sTime = h; sCat = cat; editId = ag ? ag.id : null;
            document.getElementById('modal-agenda').classList.remove('hidden');
            document.getElementById('busca-pac').value = ag ? ag.paciente : "";
        }

        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }

        async function salvar() {
            const pac = document.getElementById('busca-pac').value;
            const dataBruta = document.getElementById('data-seletor').value;
            const partes = dataBruta.split('-');
            const dataFormatada = `${partes[2]}/${partes[1]}/${partes[0]}`; // DD/MM/AAAA
            
            if(!pac) return alert("Selecione o paciente!");
            fecharModal();
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data: dataFormatada, hora: sTime, paciente: pac, categoria: sCat, servico: document.getElementById('tipo-servico').value, id: editId }) });
            loadData();
        }

        async function cadastrar() {
            const n = document.getElementById('c-nome').value, t = document.getElementById('c-tel').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name: n, phone: t }) });
            alert("Salvo!"); loadData(); showTab('agenda');
        }
    </script>
</body>
</html>
