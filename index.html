<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGP PRO - Dr. Jorge Salomão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root{--esp:#f97316;--emag:#3b82f6;--aplic:#a855f7}
        body{background:#f4f7f6;font-family:'Quicksand',sans-serif;padding-bottom:100px}
        .header-bar{background:#4a148c;padding:15px;text-align:center;color:white;font-weight:900;text-transform:uppercase;font-size:12px}
        .slot{border-radius:15px;border-left:8px solid #ddd;margin-bottom:10px;background:#fff;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        .sl-esp.sl-busy{background:#fff7ed; border-left-color:var(--esp)}
        .sl-emag.sl-busy{background:#eff6ff; border-left-color:var(--emag)}
        .sl-aplic.sl-busy{background:#faf5ff; border-left-color:var(--aplic)}
        .sl-vago{border:2px dashed #475569; background:#e2e8f0; color:#1e293b !important; font-weight:900}
        .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:flex;align-items:flex-end;justify-content:center}
        .modal-box{background:#fff;width:100%;max-width:480px;border-radius:25px 25px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
        @media print{.no-print{display:none} .print-area{display:block !important}}
    </style>
</head>
<body>

<header class="no-print">
    <div class="header-bar text-xs">SISTEMA DE GESTÃO - DR. JORGE SALOMÃO</div>
    <div class="flex justify-center p-4 bg-white border-b shadow-sm">
        <input type="date" id="datepicker" onchange="loadAll()" class="border-2 rounded-xl p-3 font-bold border-purple-200 outline-none focus:border-purple-600">
    </div>
</header>

<main id="content" class="p-4 max-w-2xl mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 shadow-2xl text-gray-400 text-[10px] font-bold uppercase no-print">
    <button onclick="showTab('agenda')" id="t-agenda" class="flex-1 flex flex-col items-center gap-1"><i class="fas fa-calendar-day text-xl"></i>Agenda</button>
    <button onclick="showTab('pacientes')" id="t-pacientes" class="flex-1 flex flex-col items-center gap-1"><i class="fas fa-search text-xl"></i>Histórico</button>
    <button onclick="showTab('relatorio')" id="t-relatorio" class="flex-1 flex flex-col items-center gap-1"><i class="fas fa-file-pdf text-xl"></i>Relatório</button>
    <button onclick="showTab('ausentes')" id="t-ausentes" class="flex-1 flex flex-col items-center gap-1"><i class="fas fa-user-clock text-xl"></i>Faltosos</button>
</nav>

<div id="modal" class="hidden modal-bg" onclick="if(event.target.id==='modal')closeModal()"><div class="modal-box" id="m-content"></div></div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbyxG7L8_zUGjzhFUFwMQzLI2R_IGjIBgZiw4lESf7wqK4YBTCS23Wub0BFuhOfp_FM5/exec";
    let pacs = [], appts = [], currentTab = 'agenda', removidosLocal = [];

    async function loadAll() {
        const c = document.getElementById('content');
        c.innerHTML = '<div class="text-center mt-20 font-bold animate-pulse text-purple-600 tracking-widest">SINCRONIZANDO...</div>';
        try {
            const r = await fetch(API + '?action=getAll');
            const d = await r.json();
            pacs = d.patients || []; appts = d.appointments || [];
            render();
        } catch(e) { c.innerHTML = '<div class="text-red-500 text-center font-bold">ERRO DE CONEXÃO</div>'; }
    }

    function render() {
        const c = document.getElementById('content');
        const dVal = document.getElementById('datepicker').value;
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('text-purple-700','border-t-4','border-purple-700'));
        document.getElementById('t-'+currentTab).classList.add('text-purple-700','border-t-4','border-purple-700');

        if(currentTab === 'agenda') renderAgenda(c, dVal);
        else if(currentTab === 'pacientes') renderPacientes(c);
        else if(currentTab === 'relatorio') renderRelatorioFull(c, dVal);
        else renderAusentes(c);
    }

    function renderAgenda(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        const ref = new Date("2026-05-19T12:00:00"), alvo = new Date(dVal + "T12:00:00");
        const sem = Math.floor((alvo-ref)/(7*24*60*60*1000));
        const medEsp = (sem % 2 === 0) ? "GERALDO" : "LÍBIA";

        let html = "";
        const cats = [
            {n:'ESPORTIVO', m:medEsp, step:25, cor:'sl-esp'},
            {n:'EMAGRECIMENTO', m:'BRUNO', step:35, cor:'sl-emag'},
            {n:'APLICAÇÃO', m:'SUELEN', step:30, cor:'sl-aplic', max:4}
        ];

        cats.forEach(cat => {
            html += `<div class="mb-6"><div class="flex justify-between items-center mb-2 px-1"><span class="font-black text-xs text-gray-400 uppercase tracking-widest">* ${cat.n}</span><span class="text-[10px] font-bold text-white bg-black px-2 py-1 rounded">${cat.m}</span></div>`;
            const list = appts.filter(a => a.data === dataF && a.categoria.toUpperCase() === cat.n);
            if(cat.n === 'APLICAÇÃO') {
                for(let i=1; i<=cat.max; i++) html += (list[i-1]) ? slotBusy(list[i-1], cat.cor) : slotLivre('LIVRE', cat.n);
            } else {
                let h=9, m=0;
                while(h < 12 || (h===12 && m===0)){
                    const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                    const ag = list.find(a => a.hora === t);
                    html += ag ? slotBusy(ag, cat.cor) : slotLivre(t, cat.n);
                    m += cat.step; if(m>=60){ h++; m-=60; }
                }
            }
            html += `<div class="slot border-dashed border-2 border-purple-200 text-purple-400 font-black text-center text-[10px] py-2" onclick="openNew('ENCAIXE','${cat.n}')">+ ENCAIXAR PACIENTE</div></div>`;
        });
        c.innerHTML = html;
    }

    function slotBusy(ag, cor) {
        return `<div class="slot sl-busy ${cor}" onclick="openActions('${ag.id}')"><div class="flex justify-between text-[9px] font-bold text-gray-400 mb-1"><span>${ag.hora} - ${ag.servico}</span><i class="fab fa-whatsapp text-green-500"></i></div><div class="font-black uppercase text-gray-800 text-sm">${ag.paciente}</div></div>`;
    }

    function slotLivre(t, cat) {
        return `<div class="slot sl-vago flex justify-between items-center" onclick="openNew('${t}','${cat}')"><span class="text-xs font-black uppercase tracking-tighter">${t} - DISPONÍVEL</span><i class="fas fa-plus-circle text-slate-400"></i></div>`;
    }

    function renderRelatorioFull(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        const list = appts.filter(a => a.data === dataF).sort((a,b) => a.hora.localeCompare(b.hora));
        c.innerHTML = `<div class="bg-white p-4 shadow-sm rounded-2xl"><div class="flex justify-between mb-6 border-b pb-4"><div><h2 class="font-black text-lg text-purple-900 uppercase">Agenda Lourdes</h2><p class="text-[10px] font-bold text-gray-400">${dataF}</p></div><button onclick="window.print()" class="no-print bg-black text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Imprimir</button></div>
        <table class="w-full text-[9px] border-collapse uppercase font-bold">
            <thead><tr class="bg-gray-50 text-gray-400"><th class="p-2 border text-left">HORA</th><th class="p-2 border text-left">PACIENTE</th><th class="p-2 border text-left">PROCEDIMENTO</th><th class="p-2 border text-left">OBS</th></tr></thead>
            <tbody>${list.length ? list.map(a => `<tr><td class="p-2 border border-gray-100">${a.hora}</td><td class="p-2 border border-gray-100">${a.paciente}</td><td class="p-2 border border-gray-100">${a.servico}</td><td class="p-2 border border-gray-100"></td></tr>`).join('') : '<tr><td colspan="4" class="p-4 text-center">Nenhum agendamento</td></tr>'}</tbody>
        </table></div>`;
    }

    function renderAusentes(c) {
        const hoje = new Date();
        const sumidos = pacs.filter(p => { 
            if(!p.ultimaVisita || removidosLocal.includes(p.nome)) return false; 
            const pt = p.ultimaVisita.split('/'); 
            const d = new Date(pt[2], pt[1]-1, pt[0]); 
            return (hoje - d) / (1000 * 3600 * 24) > 25; 
        });
        
        c.innerHTML = `<div class="flex justify-between items-center mb-4 px-2"><h2 class="font-black text-red-600 uppercase text-xs">Faltosos (+25 dias)</h2><span class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded-full font-bold">${sumidos.length} PACIENTES</span></div>` + (sumidos.length ? sumidos.map(p => `
            <div id="card-ausente-${p.nome.replace(/\s/g,'')}" class="bg-white p-5 rounded-2xl mb-3 flex justify-between items-center border-l-8 border-red-500 shadow-sm animate-in slide-in-from-right duration-300">
                <div>
                    <div class="font-black uppercase text-sm text-gray-800">${p.nome}</div>
                    <div class="text-[10px] font-bold text-gray-400 uppercase">Última visita em: ${p.ultimaVisita}</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="zapFaltoso('${p.nome}','${p.telefone}','${p.ultimaVisita}')" class="bg-green-500 text-white p-4 rounded-xl shadow-lg"><i class="fab fa-whatsapp"></i></button>
                    <button onclick="removerAusente('${p.nome}')" class="bg-gray-100 text-gray-400 p-4 rounded-xl"><i class="fas fa-trash-alt"></i></button>
                </div>
            </div>`).join('') : '<div class="text-center py-20"><i class="fas fa-check-circle text-gray-200 text-5xl mb-4"></i><p class="text-gray-400 font-bold">Tudo em dia!</p></div>');
    }

    function removerAusente(nome) {
        if(confirm(`Remover ${nome} da lista de acompanhamento de hoje?`)) {
            removidosLocal.push(nome);
            render();
        }
    }

    function zapFaltoso(nome, tel, data) {
        const msg = `Olá, ${nome}! Tudo bem? Sentimos sua falta aqui na clínica! Notamos que sua última consulta com o Dr. Jorge Salomão foi no dia ${data}. Gostaria de agendar um novo horário para dar continuidade ao seu acompanhamento? Ficamos à disposição!`;
        window.open(`https://wa.me/55${tel.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`);
    }

    function renderPacientes(c) {
        c.innerHTML = `<div class="bg-white p-4 rounded-2xl mb-4 shadow-sm border"><h2 class="text-[9px] font-black text-gray-400 uppercase mb-2">Consulta Histórico</h2><input id="inp-p" oninput="sugerir(this.value, 's-pac')" placeholder="NOME DO PACIENTE..." class="w-full p-4 border-2 rounded-xl font-bold uppercase outline-none focus:border-purple-600"><div id="s-pac" class="hidden mt-2 bg-white shadow-2xl rounded-xl"></div></div><div id="p-detail"></div>`;
    }

    function sugerir(v, tid) {
        const el = document.getElementById(tid); if(v.length < 2){ el.classList.add('hidden'); return; }
        const ms = pacs.filter(p => p.nome.toLowerCase().includes(v.toLowerCase())).slice(0,6);
        el.innerHTML = ms.map(p => `<div onclick="selPac('${p.nome}','${tid}')" class="p-4 border-b font-black uppercase text-[10px] hover:bg-purple-50">${p.nome}</div>`).join('');
        el.classList.remove('hidden');
    }

    function selPac(n, tid){ document.getElementById(tid).classList.add('hidden'); if(tid === 's-pac') showFicha(n); else document.getElementById('m-nome-ag').value = n; }

    function showFicha(n) {
        const p = pacs.find(x => x.nome.toUpperCase() === n.toUpperCase());
        const his = appts.filter(a => a.paciente === p.nome).slice(-5).reverse();
        document.getElementById('p-detail').innerHTML = `<div class="bg-white p-6 rounded-3xl shadow-xl border-t-8 border-purple-600 animate-in fade-in zoom-in duration-300">
            <h3 class="font-black text-lg mb-4 uppercase text-purple-900">${p.nome}</h3>
            <div class="grid grid-cols-2 gap-2 text-[9px] mb-6 font-black uppercase">
                <div class="bg-gray-50 p-3 rounded-xl tracking-tighter">TEL: <br><span class="text-gray-900 text-xs">${p.telefone}</span></div>
                <div class="bg-gray-50 p-3 rounded-xl tracking-tighter">NASC: <br><span class="text-gray-900 text-xs">${p.nascimento}</span></div>
                <div class="bg-gray-50 p-3 rounded-xl tracking-tighter">ALTURA: <br><span class="text-gray-900 text-xs">${p.altura || '-'}</span></div>
                <div class="bg-gray-50 p-3 rounded-xl tracking-tighter text-[7px]">EMAIL: <br><span class="text-gray-900 text-[9px]">${p.email || '-'}</span></div>
            </div>
            <h4 class="font-black text-[10px] text-purple-300 uppercase mb-3 tracking-widest italic">Últimas passagens pela clínica</h4>
            <div class="space-y-2">${his.length ? his.map(h => `<div class="text-[10px] bg-purple-50 p-3 rounded-lg border border-purple-100 font-bold uppercase">${h.data} - ${h.servico}</div>`).join('') : '<p class="text-xs text-gray-400">Nenhum registro anterior</p>'}</div></div>`;
    }

    function openNew(h, c) {
        document.getElementById('m-content').innerHTML = `<h2 class="font-black text-center mb-6 uppercase text-purple-900 tracking-widest">Agendar ${h}</h2><input id="m-nome-ag" oninput="sugerir(this.value, 's-m')" placeholder="PACIENTE" class="w-full p-4 border-2 rounded-xl mb-3 font-bold uppercase outline-none focus:border-purple-600"><div id="s-m" class="hidden bg-white shadow-xl rounded-xl mb-3"></div>
        <select id="m-serv" class="w-full p-4 border-2 rounded-xl font-bold mb-6 uppercase outline-none"><option>CONSULTA</option><option>RETORNO</option><option>APLICAÇÃO</option><option>PRIMEIRA CONSULTA</option><option>CONSULTA CLINICAL</option></select>
        <button onclick="saveAppt('${h}','${c}')" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase tracking-widest shadow-xl">Confirmar</button>`;
        document.getElementById('modal').classList.remove('hidden');
    }

    function openActions(id) {
        const ag = appts.find(a => a.id == id);
        document.getElementById('m-content').innerHTML = `<h2 class="font-black mb-6 text-center uppercase text-purple-900 border-b pb-4">${ag.paciente}</h2>
        <button onclick="zap('confirm','${id}')" class="w-full bg-green-600 text-white p-4 rounded-xl mb-3 font-bold uppercase text-[10px] shadow-lg flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-lg"></i> Confirmar Consulta</button>
        <button onclick="zap('bio','${id}')" class="w-full bg-blue-500 text-white p-4 rounded-xl mb-3 font-bold uppercase text-[10px] shadow-lg flex items-center justify-center gap-2"><i class="fas fa-weight text-lg"></i> Bioimpedância (Preparo)</button>
        <button onclick="zap('pos','${id}')" class="w-full bg-purple-500 text-white p-4 rounded-xl mb-6 font-bold uppercase text-[10px] shadow-lg flex items-center justify-center gap-2"><i class="fas fa-heart text-lg"></i> Pós-Consulta (Como está?)</button>
        <button onclick="delAppt('${id}')" class="w-full text-red-500 font-black p-2 text-[10px] uppercase opacity-50 hover:opacity-100">Excluir Agendamento</button>`;
        document.getElementById('modal').classList.remove('hidden');
    }

    async function saveAppt(h, cat) {
        const pac = document.getElementById('m-nome-ag').value;
        const serv = document.getElementById('m-serv').value;
        const d = document.getElementById('datepicker').value.split('-').reverse().join('/');
        if(!pac) return alert("Digite o nome!");
        closeModal();
        await fetch(`${API}?action=saveAppt&data=${d}&hora=${h}&paciente=${pac}&servico=${serv}&categoria=${cat}`);
        loadAll();
    }

    async function delAppt(id) {
        if(confirm("Deseja realmente excluir?")){
            closeModal();
            await fetch(`${API}?action=deleteAppt&id=${id}`);
            loadAll();
        }
    }

    function zap(tipo, id) {
        const ag = appts.find(a => a.id == id); const p = pacs.find(x => x.nome === ag.paciente);
        let msg = "";
        if(tipo === 'confirm') msg = `Olá, ${ag.paciente}! Tudo bem? Aqui é da Clínica do Dr. Jorge Salomão. Confirmamos sua consulta para amanhã, dia ${ag.data} às ${ag.hora}?`;
        if(tipo === 'bio') msg = `Oi, ${ag.paciente}! Lembrete importante para sua Bioimpedância amanhã: Jejum de 2h (alimento e água), vir com roupas leves (estilo academia) e não ingerir álcool hoje. Até lá!`;
        if(tipo === 'pos') msg = `Olá, ${ag.paciente}! Como você se sentiu após sua consulta com o Dr. Jorge? Qualquer dúvida, estamos aqui!`;
        window.open(`https://wa.me/55${(p?.telefone || '').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`);
    }

    function showTab(t){ currentTab = t; render(); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); }

    window.onload = () => {
        const d = new Date(); d.setDate(d.getDate() + ((2 + 7 - d.getDay()) % 7 || 7));
        document.getElementById('datepicker').value = d.toLocaleDateString('en-CA');
        loadAll();
    };
</script>
</body>
</html>
