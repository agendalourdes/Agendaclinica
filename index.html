<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGP LOURDES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; padding-bottom: 100px; }
        .ios-card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .borda-esp { border-left: 8px solid #fed7aa; } 
        .borda-emag { border-left: 8px solid #bfdbfe; } 
        .borda-apl { border-left: 8px solid #e9d5ff; } 
        
        .relatorio-tabela { width: 100%; border-collapse: collapse; margin-bottom: 30px; font-size: 9px; }
        .relatorio-tabela th { background: #f1f5f9; padding: 8px 4px; text-align: left; border: 1px solid #e2e8f0; text-transform: uppercase; }
        .relatorio-tabela td { padding: 8px 4px; border: 1px solid #e2e8f0; background: white; }
        
        .cat-header { padding: 10px; font-weight: 900; font-size: 11px; text-transform: uppercase; display: flex; justify-content: space-between; border-radius: 8px 8px 0 0; }
        @media print { .no-print { display: none !important; } .print-area { display: block !important; } .relatorio-tabela th { background: #eee !important; color: black; } }
    </style>
</head>
<body>

<header class="no-print p-6 bg-white border-b flex justify-between items-center sticky top-0 z-40">
    <h1 class="text-lg font-black uppercase tracking-tighter">CLÍNICA <span class="text-orange-600">LOURDES</span></h1>
    <input type="date" id="datepicker" onchange="loadAll()" class="p-2 border rounded-xl font-bold text-xs bg-slate-50 outline-none">
</header>

<main id="content" class="p-4 max-w-[1200px] mx-auto"></main>

<nav class="fixed bottom-0 left-0 right-0 h-20 bg-white border-t flex items-center justify-around z-50 no-print shadow-2xl">
    <button onclick="showTab('agenda')" id="t-agenda" class="flex flex-col items-center text-slate-400"><i class="fas fa-calendar-alt text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Agenda</span></button>
    <button onclick="showTab('relatorio')" id="t-relatorio" class="flex flex-col items-center text-slate-400"><i class="fas fa-file-medical text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Relatório</span></button>
    <button onclick="showTab('historico')" id="t-historico" class="flex flex-col items-center text-slate-400"><i class="fas fa-users text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Pacientes</span></button>
    <button onclick="showTab('ausentes')" id="t-ausentes" class="flex flex-col items-center text-slate-400"><i class="fas fa-clock text-xl"></i><span class="text-[9px] font-black mt-1 uppercase">Retornos</span></button>
</nav>

<div id="modal" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white w-full max-w-lg rounded-[32px] p-8 shadow-2xl overflow-y-auto max-h-[90vh]" onclick="event.stopPropagation()">
        <div id="m-content"></div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbz4445za3kVsKVzUbHmo-_-7L4QBPp8cHZ0UPdCSywFV4OnMWs3SBL1qmKyMKS3SolP/exec"; 
    let pacs = [], appts = [], currentTab = 'agenda';

    async function loadAll() {
        const c = document.getElementById('content');
        c.innerHTML = '<div class="text-center mt-20 font-black text-slate-300 animate-pulse uppercase text-xs">Carregando...</div>';
        try {
            const r = await fetch(API + '?action=getAll');
            const d = await r.json();
            pacs = d.patients || [];
            appts = d.appointments || [];
            render();
        } catch(e) { c.innerHTML = '<div class="text-center p-10 font-bold text-red-500 uppercase">Erro na Conexão</div>'; }
    }

    function render() {
        const c = document.getElementById('content');
        const dVal = document.getElementById('datepicker').value;
        document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-orange-600', 'text-slate-400'));
        document.getElementById('t-'+currentTab).classList.replace('text-slate-400', 'text-orange-600');
        
        if(currentTab === 'agenda') renderAgenda(c, dVal);
        else if(currentTab === 'relatorio') renderRelatorio(c, dVal);
        else if(currentTab === 'historico') renderHistorico(c);
        else renderAusentes(c);
    }

    function renderAgenda(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        let html = `<div class="mb-6 text-center"><button onclick="openAgendar('ENCAIXE','')" class="bg-orange-600 text-white px-10 py-3 rounded-2xl text-[10px] font-black uppercase">+ Encaixe</button></div>`;
        const config = [{n:'ESPORTIVO', b:'borda-esp', step:25},{n:'EMAGRECIMENTO', b:'borda-emag', step:35},{n:'APLICAÇÃO', b:'borda-apl', max:3}];
        
        config.forEach(cat => {
            html += `<h3 class="font-black text-[10px] text-slate-400 mb-4 mt-8 uppercase tracking-widest border-l-4 border-slate-200 pl-2">${cat.n}</h3>`;
            const list = appts.filter(a => a.data.includes(dataF) && a.categoria.toUpperCase().trim() === cat.n);
            if(cat.n === 'APLICAÇÃO') {
                for(let i=1; i<=cat.max; i++) html += list[i-1] ? slotBusy(list[i-1], cat.b) : `<div onclick="openAgendar('${cat.n}', '')" class="bg-white border border-dashed p-4 mb-4 text-[10px] rounded-xl text-slate-300 text-center">Livre</div>`;
            } else {
                let h=9, m=0;
                while(h < 12 || (h == 11 && m <= 55)){
                    const t = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
                    const ag = list.find(a => a.hora.includes(t));
                    html += ag ? slotBusy(ag, cat.b) : `<div onclick="openAgendar('${cat.n}', '${t}')" class="bg-white border border-dashed p-4 mb-3 flex justify-between text-[10px] rounded-xl text-slate-300 font-bold"><span>${t}</span><span>Disponível</span></div>`;
                    m += cat.step; if(m>=60){ h++; m-=60; }
                }
            }
        });
        c.innerHTML = html;
    }

    function slotBusy(ag, borda) {
        return `<div class="ios-card p-5 mb-4 ${borda} flex justify-between items-center" onclick="openAcoes('${ag.id}')">
            <div><p class="text-[9px] font-bold text-slate-400 uppercase">${ag.hora} — ${ag.servico}</p>
            <p class="font-black text-slate-800 uppercase text-base">${ag.paciente}</p>
            <p class="text-[8px] text-orange-500 font-bold uppercase mt-1 italic">${ag.obs ? 'OBS: ' + ag.obs : ''}</p></div>
            <i class="fab fa-whatsapp text-green-500 text-2xl"></i>
        </div>`;
    }

    function renderRelatorio(c, dVal) {
        const dataF = dVal.split('-').reverse().join('/');
        let html = `<div class="no-print mb-6"><button onclick="window.print()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-[10px]">Imprimir Relatório Completo</button></div>
        <div class="print-area bg-white p-2">
            <h2 class="text-center font-black mb-6 uppercase text-sm border-b-2 border-black pb-2 italic">AGENDA LOURDES — ${dataF}</h2>`;
        
        const cats = [
            {n:'ESPORTIVO', bg:'bg-orange-50', profs:['LIBIA', 'GERALDO']},
            {n:'EMAGRECIMENTO', bg:'bg-blue-50', profs:['BRUNO']},
            {n:'APLICAÇÃO', bg:'bg-purple-50', profs:['SUELLEN']}
        ];

        cats.forEach(cat => {
            const list = appts.filter(a => a.data.includes(dataF) && a.categoria.toUpperCase().trim() === cat.n);
            html += `<div class="cat-header ${cat.bg} border"><span>${cat.n}</span>
                <select class="bg-transparent font-black text-[10px] outline-none border-none">
                    ${cat.profs.map(p => `<option>PROF: ${p}</option>`).join('')}
                </select></div>
            <table class="relatorio-tabela">
                <thead><tr><th>Hora</th><th>Paciente</th><th>WhatsApp</th><th>Nascimento</th><th>Email</th><th>Alt.</th><th>Últ. Visita</th><th>Últ. Proc.</th><th>Hoje</th><th>Observação</th></tr></thead>
                <tbody>`;
            list.forEach(a => {
                const p = pacs.find(x => x.nome.toUpperCase().trim() === a.paciente.toUpperCase().trim()) || {};
                const hPac = appts.filter(x => x.paciente.toUpperCase().trim() === a.paciente.toUpperCase().trim() && x.data !== dataF);
                const ultima = hPac.length > 0 ? hPac[hPac.length-1] : {data: '-', servico: '-'};
                html += `<tr><td>${a.hora}</td><td class="font-bold">${a.paciente}</td><td>${p.telefone || ''}</td><td>${p.nascimento || ''}</td><td class="text-[7px]">${p.email || ''}</td><td>${p.altura || ''}</td><td>${ultima.data}</td><td>${ultima.servico}</td><td class="font-bold">${a.servico}</td><td class="text-orange-600 font-bold">${a.obs || ''}</td></tr>`;
            });
            html += `</tbody></table>`;
        });
        c.innerHTML = html + `</div>`;
    }

    function renderHistorico(c) {
        c.innerHTML = `<div class="p-2"><input type="text" id="histSearch" oninput="searchHist()" placeholder="PESQUISAR PACIENTE..." class="w-full p-5 rounded-2xl border-2 border-slate-100 font-black uppercase outline-none focus:border-orange-500 shadow-sm mb-8 text-center"><div id="histResults"></div></div>`;
    }

    function searchHist() {
        const term = document.getElementById('histSearch').value.toUpperCase().trim();
        const results = document.getElementById('histResults');
        if(term.length < 3) return results.innerHTML = "";
        const pac = pacs.find(p => p.nome.toUpperCase().includes(term));
        if(!pac) return results.innerHTML = "<p class='text-center text-slate-300 font-bold'>Não encontrado.</p>";
        const visitas = appts.filter(a => a.paciente.toUpperCase().trim() === pac.nome.toUpperCase().trim()).reverse();
        results.innerHTML = `
            <div class="ios-card p-6 border-l-8 border-orange-500 shadow-xl">
                <h3 class="font-black text-lg uppercase mb-4 italic">${pac.nome}</h3>
                <div class="grid grid-cols-2 gap-3 text-[10px] mb-6">
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">WhatsApp</label><input type="text" id="eTel" value="${pac.telefone}" class="w-full bg-transparent font-bold outline-none"></div>
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">Altura</label><input type="text" id="eAlt" value="${pac.altura}" class="w-full bg-transparent font-bold outline-none"></div>
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">Nascimento</label><input type="text" id="eNasc" value="${pac.nascimento}" class="w-full bg-transparent font-bold outline-none"></div>
                    <div class="bg-slate-50 p-3 rounded-xl"><label class="text-[8px] text-slate-400 font-black uppercase block">Email</label><input type="text" id="eEmail" value="${pac.email}" class="w-full bg-transparent font-bold outline-none"></div>
                </div>
                <button onclick="salvarEdicao('${pac.nome}')" class="w-full bg-slate-900 text-white p-4 rounded-xl font-black uppercase text-[10px]">Salvar Dados</button>
            </div>`;
    }

    async function salvarEdicao(nome) {
        const obj = { action: 'editPatient', nome: nome, telefone: document.getElementById('eTel').value, nascimento: document.getElementById('eNasc').value, email: document.getElementById('eEmail').value, altura: document.getElementById('eAlt').value };
        await fetch(API, { method: 'POST', body: JSON.stringify(obj) }); alert("Atualizado!"); loadAll();
    }

    function renderAusentes(c) {
        const hoje = new Date();
        const faltosos = pacs.filter(p => {
            const h = appts.filter(a => a.paciente.toUpperCase().trim() === p.nome.toUpperCase().trim());
            if(h.length === 0) return false;
            const u = h[h.length-1].data.split('/');
            const dV = new Date(u[2], u[1]-1, u[0]);
            return ((hoje - dV)/(1000*3600*24)) > 25;
        });
        c.innerHTML = `<h2 class="font-black text-slate-400 mb-6 uppercase text-[10px] text-center italic">Retornos pendentes (+25 dias)</h2>` + 
        (faltosos.length ? faltosos.map(p => {
            const u = appts.filter(x => x.paciente.toUpperCase().trim() === p.nome.toUpperCase().trim()).pop();
            return `<div class="ios-card p-6 mb-4 flex justify-between items-center"><div class="uppercase"><p class="font-black">${p.nome}</p><p class="text-[8px] text-slate-400 font-bold italic">Última em: ${u.data}</p></div>
            <div class="flex gap-4"><button onclick="window.open('https://wa.me/55${p.telefone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá '+p.nome+'! Notamos que sua última visita foi em '+u.data+'. Gostaríamos de convidá-lo para um novo agendamento com o Dr. Jorge Salomão.')}')" class="bg-green-50 text-green-500 p-3 rounded-full"><i class="fab fa-whatsapp text-xl"></i></button>
            <button onclick="this.parentElement.parentElement.remove()" class="bg-slate-50 text-slate-300 p-3 rounded-full"><i class="fas fa-trash-alt"></i></button></div></div>`;
        }).join('') : '<p class="text-center py-10 text-slate-300 font-bold uppercase text-[10px]">Tudo em dia!</p>');
    }

    function openAgendar(cat, hora) {
        document.getElementById('m-content').innerHTML = `
            <h2 class="font-black text-xl mb-6 uppercase text-center italic">${cat}</h2>
            <div class="space-y-4">
                <input type="text" id="newPac" placeholder="NOME DO PACIENTE" class="w-full p-4 bg-slate-50 rounded-xl font-black uppercase outline-none border-2 border-transparent focus:border-orange-500">
                <div id="extra" class="hidden space-y-4 p-4 bg-orange-50 rounded-2xl border border-orange-100">
                    <input type="text" id="nTel" placeholder="WhatsApp" class="w-full p-3 rounded-xl text-xs font-bold border-none">
                    <input type="text" id="nAlt" placeholder="Altura" class="w-full p-3 rounded-xl text-xs font-bold border-none">
                    <input type="text" id="nNasc" placeholder="Nasc. DD/MM/AAAA" class="w-full p-3 rounded-xl text-xs font-bold border-none">
                    <input type="text" id="nEmail" placeholder="Email" class="w-full p-3 rounded-xl text-xs font-bold border-none">
                </div>
                <textarea id="nObs" placeholder="OBSERVAÇÃO DO AGENDAMENTO" class="w-full p-4 bg-slate-50 rounded-xl font-bold text-xs uppercase outline-none min-h-[80px]"></textarea>
                <button onclick="salvarNovo('${cat}', '${hora}')" class="w-full bg-slate-900 text-white p-5 rounded-[22px] font-black uppercase shadow-2xl">Salvar Agendamento</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('newPac').addEventListener('input', function() {
            const term = this.value.toUpperCase().trim();
            const existe = pacs.some(p => p.nome.toUpperCase().trim() === term);
            document.getElementById('extra').classList.toggle('hidden', term.length < 3 || existe);
        });
    }

    async function salvarNovo(cat, hora) {
        const data = document.getElementById('datepicker').value.split('-').reverse().join('/');
        let servico = cat === 'APLICAÇÃO' ? 'APLICAÇÃO' : (cat === 'ESPORTIVO' ? 'NUTRIÇÃO ESPORTIVA' : 'EMAGRECIMENTO');
        const obj = { 
            action: 'addAppointment', 
            paciente: document.getElementById('newPac').value.toUpperCase(), 
            servico: servico, 
            data: data, 
            hora: hora || 'ENCAIXE', 
            categoria: cat,
            obs: document.getElementById('nObs').value.toUpperCase(),
            telefone: document.getElementById('nTel')?.value || "",
            nascimento: document.getElementById('nNasc')?.value || "",
            email: document.getElementById('nEmail')?.value || "",
            altura: document.getElementById('nAlt')?.value || ""
        };
        await fetch(API, { method: 'POST', body: JSON.stringify(obj) }); closeModal(); loadAll();
    }

    function openAcoes(id) {
        const ag = appts.find(a => a.id == id);
        document.getElementById('m-content').innerHTML = `
            <div class="text-center mb-10"><h2 class="font-black text-2xl uppercase italic">${ag.paciente}</h2><p class="text-[9px] font-bold text-orange-500 uppercase">${ag.obs ? 'OBSERVAÇÃO: ' + ag.obs : ''}</p></div>
            <div class="flex flex-col gap-4">
                <button onclick="enviarZap('confirmar','${id}')" class="w-full bg-blue-600 text-white p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Confirmar Agendamento <i class="fas fa-check"></i></button>
                <button onclick="enviarZap('lembrete','${id}')" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black uppercase text-[11px] flex justify-between items-center">Enviar Lembrete <i class="fab fa-whatsapp"></i></button>
                <button onclick="closeModal()" class="text-slate-300 font-black text-[9px] uppercase mt-10">Voltar</button>
            </div>`;
        document.getElementById('modal').classList.remove('hidden');
    }

    function enviarZap(tipo, id) {
        const ag = appts.find(a => a.id == id);
        const p = pacs.find(x => x.nome.toUpperCase().trim() === ag.paciente.toUpperCase().trim()) || {};
        const tel = (p.telefone || "").replace(/\D/g,'');
        let msg = "";
        if(tipo === 'confirmar') {
            msg = `Oi ${ag.paciente}! 👋\n\nSeu agendamento foi realizado com sucesso!\n\n📅 ${ag.data}\n🕐 ${ag.hora}\n\n*${ag.servico.toUpperCase()}*\nCom os profissionais: DR Jorge Vieira Salomão (médico nutrólogo) | Geraldo (nutricionista) | Suelen Fernanda (enfermeira)\n\n📍 Rua dos Timbiras, 2237 / 5º andar - Lourdes.`;
        } else {
            msg = `Olá ${ag.paciente}! 👋\n\nConfirmamos sua consulta para amanhã:\n📅 ${ag.data}\n🕐 ${ag.hora}\n\n📊 *BIOIMPEDÂNCIA*\n✓ Jejum de 2h\n✓ Sem exercícios 4h antes.\n\nResponda SIM para confirmar. 😊`;
        }
        window.open(`https://wa.me/55${tel}?text=${encodeURIComponent(msg)}`);
    }

    function showTab(t){ currentTab = t; render(); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
    window.onload = () => { document.getElementById('datepicker').value = new Date().toISOString().split('T')[0]; loadAll(); };
</script>
</body>
</html>
