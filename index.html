<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda Clínica Lourdes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: sans-serif; }
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: bold; }
        .bg-esportivo { background-color: #fff7ed; border-left: 5px solid #f97316; }
        .bg-emagrecimento { background-color: #eff6ff; border-left: 5px solid #3b82f6; }
        .bg-aplicacao { background-color: #faf5ff; border-left: 5px solid #a855f7; }
    </style>
</head>
<body class="pb-24">
    <div class="bg-slate-800 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-lg font-bold italic text-orange-400">Clínica Lourdes</h1>
            <input type="date" id="data-seletor" onchange="render()" class="bg-slate-700 text-xs p-1 rounded mt-1 border-none outline-none text-white">
        </div>
        <button onclick="loadData()" class="p-2 bg-slate-700 rounded-lg"><i class="fas fa-sync-alt"></i></button>
    </div>

    <div class="bg-white sticky top-[72px] z-40 flex justify-around shadow-sm border-b">
        <button onclick="showTab('agenda')" id="tab-agenda" class="p-3 flex-1 tab-active text-sm">Agenda</button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="p-3 flex-1 text-sm">Pacientes</button>
        <button onclick="showTab('relatorio')" id="tab-relatorio" class="p-3 flex-1 text-sm">Relatório</button>
    </div>

    <div id="content" class="p-4 max-w-xl mx-auto"></div>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <h2 class="font-bold text-xl mb-1 text-slate-800">Agendar</h2>
            <p id="info-horario" class="text-blue-600 font-bold mb-4"></p>
            <input type="text" id="busca-paciente-modal" oninput="filtrarModal(this.value)" placeholder="Digite para buscar..." class="w-full p-4 border rounded-2xl mb-4 bg-gray-50 outline-none focus:border-blue-500">
            <div id="lista-pacientes-modal" class="max-h-40 overflow-y-auto border rounded-xl p-2 space-y-2 mb-6"></div>
            <div class="flex gap-2">
                <button onclick="fecharModal()" class="flex-1 p-3 bg-gray-100 rounded-xl font-bold">Voltar</button>
                <button id="btn-confirmar" class="flex-1 p-3 bg-blue-600 text-white rounded-xl font-bold opacity-30" disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // COLE O LINK QUE TERMINA EM /EXEC ENTRE AS ASPAS ABAIXO:
        const API_URL = "https://script.google.com/macros/s/AKfycby_rKyi29S2AufBioFmFHbpJq5quJarkG02ST-EjXPIvkAahpvsGxW7er4PGrHPVPEX/exec";
        
        let pacientes = [];
        let agendamentos = [];
        let selectedTime, selectedCat, selectedPac;

        window.onload = () => {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data-seletor').value = hoje;
            showTab('agenda');
            loadData();
        };

        async function loadData() {
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || [];
                agendamentos = d.appointments || [];
                render();
            } catch(e) { console.log("Erro de conexão"); }
        }

        function showTab(tab) {
            document.querySelectorAll('.bg-white button').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            window.currentTab = tab;
            render();
        }

        function render() {
            const container = document.getElementById('content');
            const dataSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');

            if (window.currentTab === 'agenda') {
                container.innerHTML = `
                    <div class="space-y-6">
                        <section>
                            <h3 class="text-orange-600 font-bold text-sm mb-2 uppercase italic">Nutricionista Esportivo</h3>
                            ${gerarSlots(9, 12, 25, 'bg-esportivo', 'Esportivo', dataSel)}
                        </section>
                        <section>
                            <h3 class="text-blue-600 font-bold text-sm mb-2 uppercase italic">Emagrecimento</h3>
                            ${gerarSlots(9, 12, 35, 'bg-emagrecimento', 'Emagrecimento', dataSel)}
                        </section>
                        <section>
                            <h3 class="text-purple-600 font-bold text-sm mb-2 uppercase italic">Aplicação</h3>
                            ${gerarSlots(9, 12, 30, 'bg-aplicacao', 'Aplicação', dataSel)}
                        </section>
                    </div>`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <h2 class="font-bold mb-4">Novo Paciente</h2>
                        <input type="text" id="n" placeholder="Nome Completo" class="w-full p-4 border rounded-2xl mb-3 outline-none">
                        <input type="tel" id="t" placeholder="WhatsApp (DDD)" class="w-full p-4 border rounded-2xl mb-3 outline-none">
                        <input type="text" id="d" placeholder="Nascimento (ex: 15/08/1990)" class="w-full p-4 border rounded-2xl mb-4 outline-none">
                        <button onclick="salvarPaciente()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold shadow-lg">Salvar Cadastro</button>
                    </div>`;
            }
        }

        function gerarSlots(hStart, hEnd, step, css, cat, dataF) {
            let html = '';
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < hEnd) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const ocupado = agendamentos.find(a => a.hora === h && a.data === dataF && a.categoria === cat);
                html += `<div class="p-4 mb-2 rounded-2xl shadow-sm flex justify-between items-center ${css}">
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-gray-500">${h}</span>
                                <span class="font-bold text-slate-800 text-sm">${ocupado ? ocupado.paciente : 'Livre'}</span>
                            </div>
                            ${ocupado ? '<i class="fas fa-check-circle text-green-600 text-xl"></i>' : `<button onclick="abrirAgenda('${h}', '${cat}')" class="bg-white/50 px-4 py-2 rounded-xl text-blue-600 font-bold text-sm shadow-sm">+ Agendar</button>`}
                         </div>`;
                t.setMinutes(t.getMinutes() + step);
            }
            return html;
        }

        function abrirAgenda(hora, cat) {
            selectedTime = hora;
            selectedCat = cat;
            document.getElementById('info-horario').innerText = `${cat} às ${hora}`;
            document.getElementById('modal-agenda').classList.remove('hidden');
            filtrarModal('');
        }

        function filtrarModal(val) {
            const lista = document.getElementById('lista-pacientes-modal');
            const filtrados = pacientes.filter(p => p.name.toLowerCase().includes(val.toLowerCase()));
            lista.innerHTML = filtrados.map(p => `<div onclick="selecionarParaAgenda('${p.name}')" class="p-4 border-b last:border-0 active:bg-blue-100 cursor-pointer font-bold text-slate-700">${p.name}</div>`).join('') || '<p class="p-4 text-gray-400">Nenhum encontrado</p>';
        }

        function selecionarParaAgenda(nome) {
            selectedPac = nome;
            document.getElementById('busca-paciente-modal').value = nome;
            const btn = document.getElementById('btn-confirmar');
            btn.disabled = false;
            btn.classList.replace('opacity-30', 'opacity-100');
            btn.onclick = confirmarAgendamento;
        }

        async function confirmarAgendamento() {
            const dataF = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data: dataF, hora: selectedTime, paciente: selectedPac, categoria: selectedCat }) });
            fecharModal();
            loadData();
        }

        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }

        async function salvarPaciente() {
            const name = document.getElementById('n').value;
            if(!name) return;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name, phone: document.getElementById('t').value, nascimento: document.getElementById('d').value }) });
            alert("Paciente " + name + " salvo com sucesso!");
            loadData();
            showTab('agenda');
        }
    </script>
</body>
</html>
