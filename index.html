<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Lourdes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e293b; --accent: #f97316; --bg: #f8fafc; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--primary); }
        
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 14px; position: relative; }
        .tab-active { background: var(--primary); color: white !important; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2); }
        
        .slot-card { transition: all 0.2s ease; border-left-width: 8px; }
        .slot-card:active { transform: scale(0.98); }
        
        .status-badge { padding: 4px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        
        .bg-gradient-header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
        
        @media print {
            .no-print { display: none !important; }
            .print-area { display: block !important; padding: 0; }
            table { width: 100%; border-collapse: collapse; font-size: 11px; }
            th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
            .header-print { background: #f1f5f9 !important; -webkit-print-color-adjust: exact; }
        }

        /* Estilo para simular um App Real */
        .bottom-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-gradient-header text-white p-6 pb-12 rounded-b-[40px] shadow-lg no-print">
        <div class="flex justify-between items-center max-w-xl mx-auto">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">Clínica <span class="text-orange-400">Lourdes</span></h1>
                <div class="flex items-center gap-2 mt-2 bg-white/10 w-fit p-1 px-3 rounded-full">
                    <i class="far fa-calendar-alt text-orange-300 text-xs"></i>
                    <input type="date" id="data-seletor" onchange="render()" class="bg-transparent text-xs font-bold border-none outline-none text-white cursor-pointer">
                </div>
            </div>
            <button onclick="loadData()" class="w-12 h-12 glass-card flex items-center justify-center text-primary bg-white hover:rotate-180 transition-all duration-500">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>

    <nav class="fixed bottom-6 left-4 right-4 h-20 glass-card z-[100] flex items-center justify-around p-2 no-print shadow-2xl border-t border-white">
        <button onclick="showTab('agenda')" id="tab-agenda" class="tab-btn flex-1 py-3 text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-th-list text-lg"></i><span class="text-[9px] font-bold">Agenda</span>
        </button>
        <button onclick="showTab('cadastro')" id="tab-cadastro" class="tab-btn flex-1 py-3 text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-user-plus text-lg"></i><span class="text-[9px] font-bold">Novo</span>
        </button>
        <button onclick="showTab('busca')" id="tab-busca" class="tab-btn flex-1 py-3 text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-search text-lg"></i><span class="text-[9px] font-bold">Fichas</span>
        </button>
        <button onclick="showTab('relatorio')" id="tab-relatorio" class="tab-btn flex-1 py-3 text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-file-invoice text-lg"></i><span class="text-[9px] font-bold">Relatório</span>
        </button>
    </nav>

    <main id="content" class="p-4 -mt-6 max-w-xl mx-auto relative z-10"></main>

    <div id="modal-agenda" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-end sm:items-center justify-center p-0 sm:p-4 no-print">
        <div class="bg-white w-full max-w-md rounded-t-[32px] sm:rounded-[32px] p-8 shadow-2xl">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6 sm:hidden"></div>
            <h2 class="font-extrabold text-2xl mb-2 text-slate-800">Novo Agendamento</h2>
            <p id="info-horario" class="text-orange-500 font-bold mb-6 text-sm"></p>
            
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1">Procedimento</label>
            <select id="tipo-servico" class="w-full p-4 bg-slate-50 border-none rounded-2xl mb-4 font-semibold text-slate-700 outline-none focus:ring-2 ring-orange-500">
                <option value="CONSULTA">CONSULTA</option>
                <option value="RETORNO">RETORNO</option>
                <option value="APLICAÇÃO">APLICAÇÃO</option>
                <option value="CONSULTA (C)">CONSULTA CLINICAL</option>
                <option value="RETORNO (C)">RETORNO CLINICAL</option>
                <option value="APLICAÇÃO (C)">APLICAÇÃO CLINICAL</option>
            </select>

            <input type="text" id="busca-paciente-modal" oninput="filtrarModal(this.value)" placeholder="🔍 Buscar nome do paciente..." class="w-full p-4 bg-slate-50 border-none rounded-2xl mb-2 font-semibold outline-none focus:ring-2 ring-slate-800">
            <div id="lista-pacientes-modal" class="max-h-40 overflow-y-auto rounded-xl mb-8 bg-slate-50"></div>
            
            <div class="flex gap-3">
                <button onclick="fecharModal()" class="flex-1 p-4 bg-slate-100 rounded-2xl font-bold text-slate-500">Cancelar</button>
                <button id="btn-confirmar" class="flex-2 px-8 bg-slate-800 text-white rounded-2xl font-bold opacity-30 shadow-lg" disabled>Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // ======= COLE O SEU LINK DA PLANILHA ABAIXO =======
        const API_URL = "https://script.google.com/macros/s/AKfycbwGmxjKsqV5RswuNPp5T2B079kpOVUB8h3PnrgeRWVWRX25wVKX9Fdmm9oRdILFU4xZ/exec";
        
        let pacientes = [], agendamentos = [], selectedTime, selectedCat, selectedPac;

        window.onload = () => {
            const hoje = new Date();
            document.getElementById('data-seletor').value = hoje.toLocaleDateString('en-CA');
            showTab('agenda'); loadData();
        };

        async function loadData() {
            document.querySelector('.fa-sync-alt').classList.add('fa-spin');
            try {
                const r = await fetch(`${API_URL}?action=getInitialData`);
                const d = await r.json();
                pacientes = d.patients || []; 
                agendamentos = d.appointments || [];
                render();
            } catch(e) { alert("Erro ao carregar dados!"); }
            document.querySelector('.fa-sync-alt').classList.remove('fa-spin');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            window.currentTab = tab; render();
        }

        function cleanDate(d) {
            if(!d) return '--';
            if(d.includes('T')) return d.split('T')[0].split('-').reverse().join('/');
            return d;
        }

        function render() {
            const container = document.getElementById('content');
            const dataSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const dataObj = new Date(document.getElementById('data-seletor').value + "T12:00:00");
            const diaSemana = dataObj.getDay();

            if (window.currentTab === 'agenda') {
                if (diaSemana !== 2 && diaSemana !== 4) {
                    container.innerHTML = `<div class="p-12 text-center glass-card border-orange-100 mt-10"><div class="w-20 h-20 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fas fa-mug-hot text-orange-400 text-2xl"></i></div><p class="text-slate-800 font-extrabold text-lg">Clínica em recesso</p><p class="text-slate-400 text-sm mt-1">Selecione uma Terça ou Quinta-feira no topo.</p></div>`;
                    return;
                }
                container.innerHTML = `
                    <div class="space-y-8">
                        ${renderSection('Esportivo', 'bg-orange-500', 'card-esportivo', 25, dataSel)}
                        ${renderSection('Emagrecimento', 'bg-blue-500', 'card-emagrecimento', 35, dataSel)}
                        ${renderSection('Aplicação', 'bg-purple-500', 'card-aplicacao', 30, dataSel)}
                    </div>`;
            } else if (window.currentTab === 'cadastro') {
                container.innerHTML = `<div class="glass-card p-8"><h2 class="font-extrabold text-2xl mb-6">Novo Cadastro</h2><div class="space-y-4"><div class="relative"><i class="fas fa-user absolute left-4 top-4 text-slate-300"></i><input type="text" id="n" placeholder="Nome Completo" class="w-full p-4 pl-12 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-slate-800"></div><div class="relative"><i class="fab fa-whatsapp absolute left-4 top-4 text-slate-300"></i><input type="tel" id="t" placeholder="WhatsApp" class="w-full p-4 pl-12 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-slate-800"></div><div class="relative"><i class="fas fa-birthday-cake absolute left-4 top-4 text-slate-300"></i><input type="text" id="d" placeholder="Data de Nascimento" class="w-full p-4 pl-12 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-slate-800"></div><button onclick="salvarPaciente()" class="w-full bg-slate-800 text-white p-5 rounded-[22px] font-extrabold text-lg shadow-xl shadow-slate-200 mt-4 active:scale-95 transition-all">Salvar Registro</button></div></div>`;
            } else if (window.currentTab === 'busca') {
                container.innerHTML = `<div class="glass-card p-8"><h2 class="font-extrabold text-2xl mb-6 italic">Fichas e Prontuários</h2><div class="relative mb-6"><i class="fas fa-search absolute left-4 top-4 text-slate-400"></i><input type="text" id="in-busca" oninput="buscarFicha(this.value)" placeholder="Pesquisar por nome..." class="w-full p-4 pl-12 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 ring-slate-800"></div><div id="res-busca"></div></div>`;
            } else if (window.currentTab === 'relatorio') { renderRelatorio(dataSel); }
        }

        function renderSection(cat, color, css, step, dataF) {
            let html = `<section><div class="flex items-center gap-3 mb-4"><span class="w-2 h-6 ${color} rounded-full"></span><h3 class="font-extrabold text-sm uppercase tracking-widest text-slate-500">${cat}</h3></div>`;
            let t = new Date(); t.setHours(9, 0, 0);
            while(t.getHours() < 12) {
                let h = t.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                const ocupado = agendamentos.find(a => cleanDate(a.data) === dataF && a.categoria.trim() === cat.trim() && a.hora.includes(h));
                
                html += `
                    <div class="glass-card p-4 mb-3 flex justify-between items-center slot-card ${css} border-l-8">
                        <div>
                            <span class="text-[10px] font-extrabold text-slate-300 uppercase">${h}</span>
                            <span class="block font-bold text-slate-700 text-base">${ocupado ? ocupado.paciente : '<span class="text-slate-300 font-normal">Disponível</span>'}</span>
                            ${ocupado ? `<span class="status-badge bg-slate-100 text-slate-500 mt-1 inline-block">${ocupado.servico}</span>` : ''}
                        </div>
                        ${ocupado ? `<div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center"><i class="fas fa-check text-green-500"></i></div>` : `<button onclick="abrirAgenda('${h}', '${cat}')" class="bg-slate-50 text-slate-800 px-4 py-2 rounded-xl text-[11px] font-black uppercase hover:bg-slate-200">+ Agendar</button>`}
                    </div>`;
                t.setMinutes(t.getMinutes() + step);
            }
            return html + `</section>`;
        }

        function renderRelatorio(dataF) {
            const dataObj = new Date(document.getElementById('data-seletor').value + "T12:00:00");
            const diaSemana = dataObj.getDay();
            const medicoEsportivo = (diaSemana === 2) ? "Dra. Líbia" : "Dr. Geraldo";
            const filtrar = (cat) => agendamentos.filter(a => cleanDate(a.data) === dataF && a.categoria.trim() === cat.trim());

            const gerarTabela = (titulo, dados, corFundo) => `
                <div class="mb-8">
                    <div class="${corFundo} p-4 rounded-t-3xl text-white flex justify-between items-center">
                        <span class="font-black text-xs uppercase tracking-tighter">${titulo}</span>
                        <span class="text-[10px] opacity-80">${dados.length} pacientes</span>
                    </div>
                    <div class="overflow-hidden border border-t-0 rounded-b-3xl">
                        <table class="w-full text-[11px]">
                            <thead><tr class="bg-slate-50 text-slate-400">
                                <th class="p-3">H</th><th class="p-3">Paciente</th><th class="p-3">Última</th><th class="p-3">C</th>
                            </tr></thead>
                            <tbody>
                                ${dados.map(a => {
                                    const hist = agendamentos.filter(ag => ag.paciente === a.paciente && cleanDate(ag.data) !== dataF);
                                    const ultima = hist.length > 0 ? cleanDate(hist[hist.length-1].data) : 'Novo';
                                    return `<tr class="border-t">
                                        <td class="p-3 font-bold">${a.hora.includes('T') ? a.hora.split('T')[1].substring(0,5) : a.hora}</td>
                                        <td class="p-3 font-bold uppercase">${a.paciente}</td>
                                        <td class="p-3 text-slate-400">${ultima}</td>
                                        <td class="p-3 text-center">${a.servico.includes('(C)') ? '<b>C</b>' : ''}</td>
                                    </tr>`;
                                }).join('') || '<tr><td colspan="4" class="p-6 text-center text-slate-300">Sem agendamentos</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>`;

            document.getElementById('content').innerHTML = `
                <div class="flex flex-col gap-4 no-print mb-8">
                    <button onclick="window.print()" class="bg-slate-800 text-white p-5 rounded-3xl font-black shadow-xl flex items-center justify-center gap-3">
                        <i class="fas fa-print"></i> GERAR PDF PARA IMPRESSÃO
                    </button>
                </div>
                <div class="print-area">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-black text-slate-800">Mapa do Dia</h2>
                        <p class="text-orange-500 font-bold">${dataF}</p>
                    </div>
                    ${gerarTabela(`Esportivo: ${medicoEsportivo}`, filtrar('Esportivo'), 'bg-orange-500')}
                    ${gerarTabela('Emagrecimento: Dr. Bruno', filtrar('Emagrecimento'), 'bg-blue-500')}
                    ${gerarTabela('Setor de Aplicações', filtrar('Aplicação'), 'bg-purple-500')}
                </div>`;
        }

        function buscarFicha(nome) {
            const res = document.getElementById('res-busca'); if(nome.length < 2) { res.innerHTML = ""; return; }
            const p = pacientes.find(p => p.name.toLowerCase().includes(nome.toLowerCase())); if(!p) return;
            const hist = agendamentos.filter(a => a.paciente.trim() === p.name.trim());
            res.innerHTML = `
                <div class="bg-slate-800 p-6 rounded-3xl text-white mb-6 shadow-xl">
                    <p class="text-[10px] font-bold text-orange-400 uppercase mb-1">Paciente</p>
                    <h4 class="text-xl font-black mb-4 uppercase">${p.name}</h4>
                    <div class="flex justify-between text-xs opacity-80">
                        <span><i class="fab fa-whatsapp mr-1"></i> ${p.phone}</span>
                        <span><i class="fas fa-birthday-cake mr-1"></i> ${cleanDate(p.nasc)}</span>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-2">Histórico de Visitas</h3>
                    ${hist.map(h => `
                        <div class="bg-white p-4 rounded-2xl border flex justify-between items-center">
                            <div><p class="font-bold text-slate-700">${cleanDate(h.data)}</p><p class="text-[10px] text-slate-400">${h.servico}</p></div>
                            <span class="text-[10px] font-black bg-slate-100 p-2 rounded-lg text-slate-500">${h.hora.includes('T') ? h.hora.split('T')[1].substring(0,5) : h.hora}</span>
                        </div>
                    `).join('') || '<p class="text-center text-slate-300 py-10">Nenhum registro encontrado</p>'}
                </div>`;
        }

        function abrirAgenda(h, c) { selectedTime = h; selectedCat = c; document.getElementById('info-horario').innerText = `✨ ${c} às ${h}`; document.getElementById('modal-agenda').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-agenda').classList.add('hidden'); }
        function filtrarModal(v) {
            const l = document.getElementById('lista-pacientes-modal');
            const f = pacientes.filter(p => p.name.toLowerCase().includes(v.toLowerCase()));
            l.innerHTML = f.map(p => `<div onclick="selecionarParaAgenda('${p.name}')" class="p-4 border-b border-white hover:bg-slate-100 font-bold text-sm cursor-pointer">${p.name}</div>`).join('');
        }
        function selecionarParaAgenda(n) { selectedPac = n; document.getElementById('busca-paciente-modal').value = n; const b = document.getElementById('btn-confirmar'); b.disabled = false; b.classList.replace('opacity-30', 'opacity-100'); b.onclick = confirmarAgendamento; }
        
        async function confirmarAgendamento() {
            const dSel = document.getElementById('data-seletor').value.split('-').reverse().join('/');
            const srv = document.getElementById('tipo-servico').value;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addAppointment', data: dSel, hora: selectedTime, paciente: selectedPac, categoria: selectedCat, servico: srv }) });
            fecharModal(); loadData();
        }
        async function salvarPaciente() {
            const n = document.getElementById('n').value, t = document.getElementById('t').value, d = document.getElementById('d').value;
            if(!n || !t) return alert("Nome e Telefone são obrigatórios!");
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPatient', name: n, phone: t, nascimento: d }) });
            alert("✨ Paciente Cadastrado com Sucesso!"); loadData();
        }
    </script>
</body>
</html>
